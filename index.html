<body><title>AZAKEI MARKET</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=M+PLUS+Rounded+1c:wght@500;700;800&family=IBM+Plex+Mono:wght@500;600&family=Shippori+Mincho+B1:wght@800&display=swap">
<style>
/* Layout: night trading-floor game app — ticker tape, HUD, rival seats (swipe row on phones), the NEWS rendered as a newspaper front page,
   and the hand docked at the bottom (a sticky, thumb-reach bottom sheet on phones). Single deliberate dark world matching the β3 rulebook:
   indigo night + gold, six industry colors for identity, cyan reserved for FUTURES, paper-cream for the newspaper and history timeline. */
:root{
  color-scheme:dark;
  --night:#0a0c22; --felt:#151843; --felt2:#22276a; --rail:#070818; --panel:#1a1e4f; --panel2:#252a6a; --line:#353b86;
  --ink:#f5f2ff; --muted:#a9addc; --dim:#6c71ad;
  --gold:#ffc83a; --gold2:#ffe08a; --gold-deep:#b97f0c; --cta:#3fe08f; --cta-deep:#1b8f55; --cyan:#4fe3ff;
  --red:#ff5d5d; --red-deep:#a3302f; --up:#5cf0a2; --down:#ff7f7f;
  --paper:#fbf3dc; --paper2:#f1e2b6; --paper-ink:#24180a; --paper-red:#b8261b;
  --i0:#ff7a3d; --i1:#eab520; --i2:#5f86ff; --i3:#ff5c9a; --i4:#20c6d1; --i5:#a77bff;
  --s0:#ffc83a; --s1:#6fb6ff; --s2:#ff8ab4; --s3:#8be36a; --s4:#c49bff; --s5:#ffa65c;
  --display:"Dela Gothic One","M PLUS Rounded 1c",system-ui,sans-serif;
  --body:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Yu Gothic UI",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  --serif:"Shippori Mincho B1","Yu Mincho","Hiragino Mincho ProN",serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%}
body{margin:0;background:var(--night);min-height:100dvh;color:var(--ink);font-family:var(--body);font-weight:500;font-size:15px;line-height:1.55;padding-inline:16px;padding-block:env(safe-area-inset-top,0px) calc(48px + env(safe-area-inset-bottom,0px));overflow-x:hidden}
body::before{content:"";position:fixed;left:0;right:0;top:0;height:100lvh;z-index:-1;pointer-events:none;background:radial-gradient(130% 70% at 50% -10%,var(--felt2) 0%,var(--felt) 45%,var(--night) 100%)}   /* 背景はfixedの擬似要素に（iPhoneでbackground-attachment:fixedが崩れるため） */
#bg{position:fixed;left:0;top:0;width:100%;height:100lvh;z-index:0;pointer-events:none}
#fx{position:fixed;inset:0;width:100%;height:100%;z-index:30;pointer-events:none}
.wrap{position:relative;z-index:1;max-width:1120px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1,h2,h3,p{margin:0}
h3{font-size:16px;font-weight:800}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
button:disabled{cursor:not-allowed}
button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.label{font-size:11px;letter-spacing:.16em;color:var(--muted);font-weight:800;text-transform:uppercase}
.note{font-size:13px;color:var(--muted)}
.up{color:var(--up)} .down{color:var(--down)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.spread{justify-content:space-between}
.col{display:flex;flex-direction:column;gap:16px;min-width:0}
.hide-sm{}

.tape{margin-inline:-16px;background:linear-gradient(90deg,var(--rail),#11143a,var(--rail));border-bottom:1px solid var(--line);overflow:hidden;white-space:nowrap;font-weight:800;font-size:12px;letter-spacing:.04em;position:relative;z-index:1}
.tape-in{display:inline-flex;gap:30px;padding:7px 0;animation:tape 36s linear infinite}
.tape b{font-family:var(--display);font-weight:400;color:var(--gold)}
@keyframes tape{to{transform:translateX(-50%)}}

.btn{--b:var(--panel2);--bd:var(--rail);position:relative;border:0;background:linear-gradient(180deg,color-mix(in srgb,var(--b) 88%,#fff),var(--b));border-radius:14px;padding:10px 16px;min-height:44px;font-weight:800;box-shadow:0 5px 0 var(--bd),0 8px 18px -8px rgb(0 0 0 / .8),inset 0 1px 0 rgb(255 255 255 / .2);transition:transform .08s ease,box-shadow .08s ease,filter .15s;letter-spacing:.02em;overflow:hidden}
.btn::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,rgb(255 255 255 / .28) 45%,transparent 60%);transform:translateX(-120%);transition:transform .5s ease;pointer-events:none}
.btn:hover:not(:disabled)::after{transform:translateX(120%)}
.btn:hover:not(:disabled){filter:brightness(1.08)}
.btn:active:not(:disabled){transform:translateY(4px);box-shadow:0 1px 0 var(--bd)}
.btn:disabled{opacity:.42;filter:grayscale(.5)}
.btn.go{--b:var(--cta);--bd:var(--cta-deep);color:#04220f}
.btn.gold{--b:var(--gold);--bd:var(--gold-deep);color:#2a1a00}
.btn.cyan{--b:#1fa8d0;--bd:#0b5d78;color:#fff}
.btn.big{padding:14px 26px;font-size:18px;border-radius:18px}
.btn.huge{padding:16px 34px;font-size:22px;border-radius:20px;font-family:var(--display);font-weight:400}
.btn.ghost{--b:#1b1f52;--bd:#0b0d2a}
.btn.icon{padding:8px 12px;font-size:14px;display:inline-flex;align-items:center;gap:6px}
.pulse{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 5px 0 var(--bd),0 0 0 8px color-mix(in srgb,var(--b) 25%,transparent),0 8px 18px -8px #000}}
.panel{background:linear-gradient(180deg,rgb(37 42 106 / .92),rgb(26 30 79 / .92));border:1px solid var(--line);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0;box-shadow:0 16px 40px -20px #000,inset 0 1px 0 rgb(255 255 255 / .06)}

.hud{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-top:12px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:9px;font-family:var(--display);font-weight:400;font-size:20px;letter-spacing:.02em;line-height:1;color:var(--ink)}
.logo .mk{width:30px;height:30px;border-radius:9px;background:conic-gradient(var(--i0) 0 60deg,var(--i1) 0 120deg,var(--i2) 0 180deg,var(--i3) 0 240deg,var(--i4) 0 300deg,var(--i5) 0);box-shadow:inset 0 0 0 3px var(--rail),0 0 14px rgb(255 200 58 / .35);flex:0 0 auto}
.logo span{color:var(--gold)}
.modechip{font-family:var(--body);font-size:11px;font-weight:800;border-radius:6px;padding:1px 7px;background:var(--paper);color:var(--paper-ink);letter-spacing:.04em}
.pips{display:flex;gap:6px}
.pips i{width:26px;height:10px;border-radius:5px;background:var(--rail);box-shadow:inset 0 0 0 1px var(--line)}
.pips i.done{background:var(--dim)} .pips i.now{background:var(--gold);box-shadow:0 0 12px var(--gold)}
.pips .term{display:flex;gap:2px;padding:3px;border-radius:7px;background:rgb(0 0 0 / .25)} .pips .term i{width:9px;height:8px;border-radius:3px} .pips .term.cur{box-shadow:inset 0 0 0 1.5px #ff9ad9}
@media (max-width:560px){ .pips .term i{width:7px} .pips .term:not(.cur) i{width:3px;border-radius:2px} .pips .term{gap:1px;padding:2px} }
.turnlbl{font-family:var(--display);color:var(--gold);font-size:15px;white-space:nowrap}
.deckchip{display:inline-flex;align-items:center;gap:6px;font-weight:800;font-size:13px;color:var(--muted);white-space:nowrap}
.deckchip .mini-back{width:16px;height:22px;border-radius:4px;background:linear-gradient(135deg,#3a43b8,#232985);box-shadow:0 0 0 1.5px var(--gold-deep),3px 3px 0 -1px #232985,3px 3px 0 .5px var(--gold-deep)}

/* home */
.hero{position:relative;display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:24px;align-items:center;padding-block:26px 6px}
.ver{display:inline-flex;gap:8px;align-items:center;font-size:11px;letter-spacing:.24em;font-weight:800;color:var(--muted)}
.ver b{background:var(--gold);color:#2a1a00;border-radius:6px;padding:1px 8px;letter-spacing:.08em}
.title{font-family:var(--display);font-weight:400;font-size:clamp(46px,9vw,92px);line-height:.9;margin-top:14px;letter-spacing:.01em;text-shadow:0 6px 0 var(--rail)}
.title .m{display:block;background:linear-gradient(100deg,var(--gold) 0%,var(--gold2) 40%,#fff6d6 50%,var(--gold2) 60%,var(--gold) 100%);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none;animation:shine 4.5s ease-in-out infinite;filter:drop-shadow(0 6px 0 var(--rail))}
@keyframes shine{0%,100%{background-position:100% 0}50%{background-position:0 0}}
.tagline{font-size:15px;color:#d9d6ff;font-weight:800;margin-top:14px}
.trio{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.trio span{font-family:var(--display);font-size:12px;letter-spacing:.06em;border:1.5px solid var(--line);border-radius:8px;padding:2px 10px}
.trio span:nth-child(1){color:#ffb184}.trio span:nth-child(2){color:#7ee0e6}.trio span:nth-child(3){color:var(--gold)}
.showcase{position:relative;height:300px;max-width:100%}
.showcase .glow{position:absolute;inset:10% 5% 0;background:radial-gradient(closest-side,rgb(255 200 58 / .3),transparent)}
.showcase .card{position:absolute;left:50%;bottom:10px;width:122px;transform-origin:50% 140%;animation:bob 4s ease-in-out infinite}
@keyframes bob{50%{translate:0 -10px}}
.feature{position:relative;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:center;border:0;text-align:left;border-radius:24px;padding:20px 22px;background:linear-gradient(120deg,var(--paper) 0%,var(--paper2) 100%);color:var(--paper-ink);box-shadow:0 6px 0 #8a6a2a,0 18px 40px -18px #000;overflow:hidden;transition:transform .15s}
.feature:hover{transform:translateY(-3px)}
.feature::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgb(36 24 10 / .05) 0 1px,transparent 1px 22px);pointer-events:none}
.feature .new{display:inline-block;background:var(--paper-red);color:#fff;font-weight:800;font-size:11px;letter-spacing:.14em;border-radius:5px;padding:1px 8px}
.feature h2{font-family:var(--serif);font-size:clamp(24px,4.5vw,38px);line-height:1.15;margin-top:6px}
.feature p{font-size:13.5px;margin-top:6px;max-width:58ch;font-weight:700;opacity:.85}
.feature .yrs{font-family:var(--serif);font-size:clamp(28px,6vw,56px);line-height:.95;text-align:right;color:var(--paper-red);position:relative}
.feature .yrs small{display:block;font-size:.38em;color:var(--paper-ink);opacity:.7;letter-spacing:.1em}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.tile{position:relative;text-align:left;border:0;border-radius:22px;padding:18px 18px 16px;min-height:150px;display:flex;flex-direction:column;justify-content:flex-end;gap:4px;overflow:hidden;background:var(--panel);color:#fff;box-shadow:0 6px 0 var(--rail),inset 0 0 0 1px var(--line);transition:transform .15s ease}
.tile:hover{transform:translateY(-4px)}
.tile:active{transform:translateY(2px)}
.tile .ic{position:absolute;right:-10px;top:-10px;width:110px;height:110px}
.tile b{font-family:var(--display);font-weight:400;font-size:22px;line-height:1.1;position:relative}
.tile span{font-size:12.5px;position:relative;opacity:.9}
.tile.t1{background:linear-gradient(150deg,#ffcf55,#f29a12);color:#2a1a00;box-shadow:0 6px 0 var(--gold-deep)}
.tile.t2{background:linear-gradient(150deg,#ff7aa8,#c2367a);box-shadow:0 6px 0 #7d1f4d}
.tile.t3{background:linear-gradient(150deg,#47d8ff,#1f78c9);box-shadow:0 6px 0 #0f4777}
.tile.t4{background:linear-gradient(150deg,#3b3f8f,#262a6b)}
.tile.t5{background:linear-gradient(150deg,#3fe08f,#14946a);color:#04220f;box-shadow:0 6px 0 #0d5c42}
.tile.t6{background:linear-gradient(150deg,var(--paper),var(--paper2));color:var(--paper-ink);box-shadow:0 6px 0 #8a6a2a}
.tile.t6 b{font-family:var(--serif)}

/* cards */
.card{--c:var(--i0);position:relative;width:126px;max-width:100%;aspect-ratio:5/7;border-radius:16px;padding:0;border:0;color:#fff;text-align:center;flex:0 0 auto;
  background:linear-gradient(160deg,color-mix(in srgb,var(--c) 85%,#fff) 0%,var(--c) 42%,color-mix(in srgb,var(--c) 62%,#000) 100%);
  box-shadow:0 0 0 3px var(--rail),0 0 0 5px color-mix(in srgb,var(--c) 55%,var(--rail)),0 16px 26px -12px #000;display:flex;flex-direction:column;overflow:hidden;transition:transform .22s cubic-bezier(.2,.9,.3,1.3),box-shadow .2s ease}
.card::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgb(255 255 255 / .35),transparent 22%),repeating-linear-gradient(135deg,rgb(255 255 255 / .08) 0 7px,transparent 7px 14px);pointer-events:none;z-index:1}
.card .wm{position:absolute;right:-22%;bottom:12%;width:90%;opacity:.16;transform:rotate(-14deg);pointer-events:none}
.card .wm svg{width:100%;height:auto}
.card .art{flex:1;display:grid;place-items:center;position:relative}
.card .art .disc{width:58%;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,rgb(255 255 255 / .45),rgb(255 255 255 / .08) 60%);box-shadow:inset 0 0 0 2px rgb(255 255 255 / .35),0 6px 14px -6px rgb(0 0 0 / .5)}
.card .art svg{width:62%;height:auto;filter:drop-shadow(0 2px 0 rgb(0 0 0 / .3))}
.card .ban{background:rgb(0 0 0 / .34);padding:5px 4px 7px;font-weight:800;font-size:13px;white-space:nowrap;letter-spacing:.04em;position:relative;z-index:2}
.card .no{position:absolute;top:7px;right:9px;font-family:var(--display);font-size:11px;opacity:.75;z-index:2}
.card .pt{position:absolute;top:6px;left:6px;min-width:40px;height:40px;padding:0 7px;border-radius:20px;background:var(--rail);border:2px solid #fff;display:grid;place-items:center;font-family:var(--display);font-size:17px;line-height:1;z-index:3}
.card .pt.up{color:var(--up)} .card .pt.down{color:var(--down)}
.card .nx{position:absolute;bottom:34px;left:50%;transform:translateX(-50%);border-radius:8px;background:rgb(7 8 24 / .78);font-size:10px;font-weight:800;padding:1px 7px;z-index:3;color:var(--cyan);white-space:nowrap}
.card .holo{position:absolute;inset:0;pointer-events:none;opacity:0;background:linear-gradient(115deg,transparent 20%,rgb(255 255 255 / .55) 35%,rgb(79 227 255 / .35) 45%,rgb(255 92 154 / .3) 55%,transparent 70%);background-size:250% 250%;mix-blend-mode:overlay;z-index:2}
.c0{--c:var(--i0)}.c1{--c:var(--i1)}.c2{--c:var(--i2)}.c3{--c:var(--i3)}.c4{--c:var(--i4)}.c5{--c:var(--i5)}
.back{width:44px;aspect-ratio:5/7;border-radius:8px;background:linear-gradient(135deg,#3a43b8,#232985);box-shadow:0 0 0 2px var(--rail),0 0 0 3.5px var(--gold-deep),0 6px 10px -4px #000;position:relative;overflow:hidden;flex:0 0 auto}
.back::after{content:"A";position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);color:var(--gold);font-size:18px;background:repeating-linear-gradient(45deg,rgb(255 255 255 / .07) 0 4px,transparent 4px 8px)}
.slot{width:44px;aspect-ratio:5/7;border-radius:8px;border:2px dashed var(--line);flex:0 0 auto}
.mini{width:44px;border-radius:8px;box-shadow:0 0 0 2px var(--rail),0 0 0 3.5px color-mix(in srgb,var(--c) 70%,var(--rail))}
.mini .art .disc{width:78%;box-shadow:none;background:none} .mini .ban{font-size:8px;padding:2px 0} .mini .wm{display:none}

/* seats */
.rivals{display:grid;grid-template-columns:repeat(auto-fit,minmax(178px,1fr));gap:10px}
.seat{position:relative;border-radius:18px;padding:11px 12px;background:linear-gradient(180deg,rgb(37 42 106 / .95),rgb(26 30 79 / .95));box-shadow:inset 0 0 0 1px var(--line),0 10px 24px -14px #000;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:3px 10px;align-items:center}
.seat.me{box-shadow:inset 0 0 0 2px var(--gold),0 0 22px -8px var(--gold)}
.seat .crown{position:absolute;top:-12px;left:14px;width:26px;height:18px;color:var(--gold);filter:drop-shadow(0 2px 0 var(--rail))}
.rk{position:absolute;top:8px;right:10px;font-family:var(--display);font-size:10px;color:var(--muted)}
.ava{--s:var(--s0);width:42px;height:42px;border-radius:50%;background:radial-gradient(circle at 35% 30%,color-mix(in srgb,var(--s) 55%,#fff),var(--s));color:#1a1030;display:grid;place-items:center;font-family:var(--display);font-size:18px;box-shadow:0 0 0 3px var(--rail),0 0 0 5px var(--s);grid-row:span 2;flex:0 0 auto}
.seat .nm{font-weight:800;font-size:14px;line-height:1.25;display:flex;gap:6px;align-items:center;flex-wrap:wrap;overflow-wrap:anywhere;padding-right:14px}
.tagx{font-size:10px;font-weight:800;border-radius:6px;padding:0 6px;background:var(--rail);color:var(--muted);white-space:nowrap}
.tagx.cy{color:var(--cyan)}
.tagx.pro{background:linear-gradient(90deg,#ff7a3d,#ffc83a);color:#2a1a00}
.seat .sc{font-family:var(--display);font-size:28px;line-height:1;grid-row:span 2;text-align:right;min-width:48px;text-shadow:0 3px 0 var(--rail);display:flex;flex-direction:column;align-items:flex-end;gap:3px}
.spark{width:44px;height:16px;display:block}
.seat .meta{display:flex;gap:4px;align-items:center;flex-wrap:wrap;min-height:16px}
.dot{width:13px;height:13px;border-radius:4px;background:var(--c);box-shadow:0 0 0 1.5px var(--rail)}
.eye{display:inline-flex;align-items:center;gap:3px;font-size:11px;font-weight:800;color:var(--dim)}
.eye.on{color:var(--cyan)} .eye svg{width:14px;height:14px}
.seat .play{grid-column:1 / -1;display:flex;align-items:center;gap:9px;margin-top:6px;min-height:64px}
.seat .st{font-size:12px;color:var(--muted);font-weight:700;line-height:1.35}
.dots i{display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--muted);margin-right:3px;animation:dot 1s ease-in-out infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes dot{50%{transform:translateY(-4px);background:var(--gold)}}
.popnum{position:absolute;right:12px;top:-10px;font-family:var(--display);font-size:26px;color:var(--gold);text-shadow:0 3px 0 var(--rail),0 0 16px rgb(255 200 58 / .6);animation:popn 1.8s ease both;pointer-events:none;z-index:2}
.popnum.neg{color:var(--down)}
@keyframes popn{0%{transform:translateY(16px) scale(.5)}25%{transform:translateY(-6px) scale(1.2)}100%{transform:translateY(-12px) scale(1)}}

/* stage: newspaper NEWS */
.stage{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:14px;align-items:stretch}
.paper{position:relative;border-radius:20px;padding:14px 18px 16px;background:linear-gradient(170deg,var(--paper) 0%,var(--paper2) 100%);color:var(--paper-ink);box-shadow:0 0 0 4px var(--rail),0 0 0 7px var(--gold),0 0 60px -8px rgb(255 200 58 / .55);display:flex;flex-direction:column;gap:10px;overflow:hidden;animation:dealin .7s cubic-bezier(.2,.9,.3,1.2) both;transform-origin:50% 60%}
@keyframes dealin{0%{transform:perspective(900px) rotateY(70deg) translateY(-12px) scale(.94)}100%{transform:none}}
.paper::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 85% 10%,rgb(255 255 255 / .55),transparent 40%),repeating-linear-gradient(0deg,rgb(36 24 10 / .035) 0 1px,transparent 1px 3px);pointer-events:none}
.paper::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 35%,rgb(255 255 255 / .6) 48%,transparent 60%);transform:translateX(-120%);animation:sweep 3.6s ease-in-out .7s infinite;pointer-events:none}
@keyframes sweep{0%{transform:translateX(-120%)}45%,100%{transform:translateX(120%)}}
.mast{display:flex;justify-content:space-between;align-items:center;gap:8px;border-bottom:3px double var(--paper-ink);padding-bottom:6px;position:relative}
.mast .t{font-family:var(--serif);font-size:15px;letter-spacing:.06em}
.mast .d{font-size:11px;font-weight:800;letter-spacing:.08em;display:flex;gap:6px;align-items:center;white-space:nowrap}
.mast .gogai{background:var(--paper-red);color:#fff;border-radius:4px;padding:0 6px;animation:blink 1.2s steps(2) infinite}
@keyframes blink{50%{opacity:.6}}
.head{display:flex;align-items:flex-end;gap:12px;position:relative}
.head .yr{font-family:var(--serif);font-size:clamp(34px,7vw,58px);line-height:.85;color:var(--paper-red);letter-spacing:-.02em}
.head .yr small{display:block;font-size:.3em;letter-spacing:.2em;color:var(--paper-ink);opacity:.7;margin-bottom:4px}
.paper h2{font-family:var(--serif);font-weight:800;font-size:clamp(28px,5.2vw,46px);line-height:1.08;position:relative}
.lede{font-size:13px;font-weight:700;line-height:1.6;position:relative;border-left:3px solid var(--paper-red);padding-left:9px}
.payout{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px;position:relative}
.pay{border-radius:12px;padding:6px 2px 5px;text-align:center;background:rgb(36 24 10 / .07);display:flex;flex-direction:column;align-items:center}
.pay .ic{width:28px;height:28px;border-radius:9px;color:#fff;display:grid;place-items:center;box-shadow:0 2px 0 rgb(0 0 0 / .2)}
.pay .ic svg{width:18px;height:18px}
.pay .n{font-size:10.5px;font-weight:800;white-space:nowrap;margin-top:2px}
.pay .v{font-family:var(--display);font-size:26px;line-height:1.1}
.pay .v.up{color:#0b7a42} .pay .v.down{color:#c0322a}
.pay.top{background:var(--paper-ink);color:#fff}
.pay.top .v{color:var(--gold)}
.pay .pbar{position:relative;width:14px;height:34px;margin:4px 0 2px;border-radius:4px;background:rgb(36 24 10 / .1)}
.pay .pbar::after{content:"";position:absolute;left:-3px;right:-3px;top:50%;height:2px;margin-top:-1px;background:rgb(36 24 10 / .45);border-radius:1px}
.pay .pbar i{position:absolute;left:0;right:0;border-radius:3px}
.pay .pbar i.u{bottom:50%;background:linear-gradient(0deg,#0b7a42,#3fe08f)} .pay .pbar i.d{top:50%;background:linear-gradient(180deg,#c0322a,#ff7f7f)}
.pay.top .pbar{background:rgb(255 255 255 / .15)} .pay.top .pbar::after{background:rgb(255 255 255 / .5)} .pay.top .pbar i.u{background:linear-gradient(0deg,var(--gold-deep),var(--gold))}
.pay .mono{margin-top:2px;font-size:10px;font-weight:800;border-radius:6px;padding:0 5px;background:rgb(36 24 10 / .1);white-space:nowrap}
.pay.top .mono{background:var(--gold);color:#2a1a00}
.pay.neg{background:rgb(192 50 42 / .08)}
.side{display:flex;flex-direction:column;gap:12px;min-width:0}
.info{border-radius:18px;padding:12px 14px;background:rgb(7 8 24 / .45);box-shadow:inset 0 0 0 1px var(--line);display:flex;flex-direction:column;gap:8px;min-width:0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips span{font-size:12px;font-weight:800;border-radius:9px;padding:3px 9px;background:var(--panel2);box-shadow:inset 0 0 0 1px var(--line)}
.chips.div span{background:rgb(92 240 162 / .14);color:var(--up);box-shadow:none}
.chips.nx span{display:inline-flex;align-items:center;gap:6px;padding:3px 4px 3px 9px} .chips .tops{display:inline-flex;align-items:center;gap:2px;font-style:normal;border-radius:7px;padding:1px 4px;background:rgb(0 0 0 / .25)} .chips .tops em{width:16px;height:16px;border-radius:5px;display:grid;place-items:center;color:#fff} .chips .tops em svg{width:11px;height:11px} .chips .tops b{font-family:var(--display);font-weight:400;font-size:11px;color:var(--up);margin-left:2px}
/* history timeline */
.tl{position:relative;display:flex;gap:6px;overflow-x:auto;padding:4px 2px 6px;scroll-snap-type:x proximity}
.ev{flex:0 0 auto;scroll-snap-align:start;border-radius:12px;padding:6px 9px;min-width:86px;background:rgb(251 243 220 / .1);box-shadow:inset 0 0 0 1px rgb(251 243 220 / .25);display:flex;flex-direction:column;gap:1px}
.ev b{font-family:var(--serif);font-size:16px;line-height:1}
.ev span{font-size:11px;font-weight:700;white-space:nowrap}
.ev.done{background:var(--paper);color:var(--paper-ink);box-shadow:none}
.ev.now{background:var(--gold);color:#2a1a00;box-shadow:0 0 16px -2px var(--gold)}
.ev.gone{opacity:.32;text-decoration:line-through}
.ev.maybe{box-shadow:inset 0 0 0 1.5px var(--cyan)}
.ev.maybe b::after{content:" ?";color:var(--cyan)}

/* dock / hand */
.dock{position:relative;border-radius:26px;padding:14px 14px 18px;background:linear-gradient(180deg,rgb(7 8 24 / .2),rgb(7 8 24 / .65));box-shadow:inset 0 0 0 1px var(--line);display:flex;flex-direction:column;gap:12px}
.dock.futmode{box-shadow:inset 0 0 0 2px var(--cyan),0 0 40px -10px var(--cyan)}
.futbar{align-self:center;font-family:var(--display);font-size:13px;letter-spacing:.12em;color:#03222b;background:linear-gradient(90deg,#4fe3ff,#b8f6ff,#4fe3ff);background-size:200% 100%;animation:shine 2.5s linear infinite;border-radius:999px;padding:3px 14px;white-space:nowrap}
.fan{display:flex;justify-content:center;align-items:flex-end;min-height:214px;padding-top:30px;perspective:1100px}
.fan .card{margin-inline:-9px;transform:translateY(var(--y)) rotate(var(--r))}
.fan button.card:hover:not(:disabled){transform:translateY(calc(var(--y) - 18px)) rotate(0deg) rotateX(var(--rx,8deg)) rotateY(var(--ry,0deg)) scale(1.06);z-index:9!important}
.fan button.card:hover:not(.sel) .holo{opacity:1;background:radial-gradient(circle at var(--gx,50%) var(--gy,30%),rgb(255 255 255 / .5),transparent 55%);mix-blend-mode:soft-light}
.fan .card.sel{transform:translateY(-34px) rotate(0deg) scale(1.1);z-index:10!important;box-shadow:0 0 0 3px var(--rail),0 0 0 6px var(--gold),0 0 36px var(--gold),0 22px 30px -12px #000}
.fan .card.sel .holo{opacity:1;animation:holo 2.4s linear infinite}
@keyframes holo{to{background-position:-250% -250%}}
.futmode .fan .card{box-shadow:0 0 0 3px var(--rail),0 0 0 5px var(--cyan),0 0 22px -4px var(--cyan),0 16px 26px -12px #000}
.futmode .fan .card.sel{box-shadow:0 0 0 3px var(--rail),0 0 0 6px var(--cyan),0 0 40px var(--cyan)}
.actions{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
.preview{display:flex;gap:8px;align-items:center;font-weight:800;font-size:13px;color:var(--muted);flex-wrap:wrap;min-height:28px}
.preview b{font-family:var(--display);font-weight:400;font-size:20px;color:var(--gold)}
.preview .x{font-family:var(--display);font-size:20px;color:var(--ink)}
.peek{border-radius:16px;padding:10px 14px;background:rgb(79 227 255 / .1);box-shadow:inset 0 0 0 2px var(--cyan);display:flex;flex-direction:column;gap:2px}
.peek b{font-family:var(--display);font-weight:400;font-size:22px}

/* reveal */
.board{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:9px}
.lane{--c:var(--i0);position:relative;border-radius:16px;overflow:hidden;display:flex;flex-direction:column;background:rgb(7 8 24 / .5);box-shadow:inset 0 0 0 1px var(--line);min-width:0}
.lane.mono{box-shadow:inset 0 0 0 2px var(--gold),0 0 26px -6px var(--gold)}
.lane.hit{box-shadow:inset 0 0 0 2px var(--red);animation:shake .5s ease .35s both}
@keyframes shake{20%,60%{transform:translateX(-4px)}40%,80%{transform:translateX(4px)}}
.lane .lh{background:var(--c);padding:7px 4px;display:flex;align-items:center;justify-content:center;gap:4px;font-weight:800;font-size:12px;white-space:nowrap}
.lane .lh svg{width:16px;height:16px}
.lane .lb{padding:8px 6px;display:flex;flex-direction:column;gap:5px;min-height:70px}
.lane .who{--s:var(--s0);border-radius:9px;background:var(--panel2);font-size:12px;font-weight:800;padding:3px 6px;text-align:center;overflow-wrap:anywhere;animation:fly .55s cubic-bezier(.2,.9,.3,1.3) both;display:flex;align-items:center;justify-content:center;gap:5px;flex-wrap:wrap}
.lane .who .d{width:9px;height:9px;border-radius:50%;background:var(--s)}
@keyframes fly{from{transform:translateY(40px) rotateX(70deg) scale(.8)}to{transform:none}}
.lane .lf{padding:6px 4px 7px;font-size:12px;text-align:center;font-weight:800;color:var(--muted);border-top:1px solid var(--line)}
.lane.mono .lf{color:var(--gold)}
.lane.empty{opacity:.35}
.stamp{position:absolute;top:46%;left:50%;transform:translate(-50%,-50%) rotate(-14deg);font-family:var(--display);font-size:17px;color:var(--red);border:3px solid var(--red);border-radius:8px;padding:0 8px;background:rgb(7 8 24 / .55);animation:stamp .4s cubic-bezier(.2,.9,.3,1.5) .3s both;pointer-events:none;white-space:nowrap}
.stamp.g{color:var(--gold);border-color:var(--gold)}
@keyframes stamp{from{transform:translate(-50%,-50%) rotate(-14deg) scale(2.4)}to{transform:translate(-50%,-50%) rotate(-14deg) scale(1)}}
.flip{animation:flip .55s cubic-bezier(.2,.9,.3,1.25) both}
@keyframes flip{from{transform:rotateY(80deg) scale(.85)}to{transform:none}}

/* overlays */
.overlay{position:fixed;inset:0;background:radial-gradient(circle at 50% 45%,rgb(34 39 106 / .92),rgb(7 8 24 / .95));display:grid;place-items:center;z-index:25;padding:16px}
.overlay .box{max-width:520px;width:100%;text-align:center;display:flex;flex-direction:column;gap:16px;align-items:center}
.count{font-family:var(--display);font-size:clamp(110px,28vw,200px);line-height:1;color:var(--gold);text-shadow:0 10px 0 var(--gold-deep),0 0 80px rgb(255 200 58 / .7);animation:bang .55s cubic-bezier(.2,.9,.3,1.5) both}
.count.open{font-size:clamp(66px,18vw,140px);color:#fff;text-shadow:0 10px 0 var(--red-deep),0 0 80px rgb(255 93 93 / .7)}
@keyframes bang{from{transform:scale(2) rotate(-8deg)}to{transform:none}}
.intro{cursor:pointer}
.intro .tn{font-family:var(--display);font-size:clamp(18px,4vw,28px);letter-spacing:.3em;color:var(--muted);animation:slidein .5s ease both}
.intro .yr{font-family:var(--serif);font-size:clamp(70px,20vw,150px);line-height:.9;color:var(--paper);text-shadow:0 6px 0 var(--rail);animation:bang .6s cubic-bezier(.2,.9,.3,1.4) both}
.intro .nw{font-family:var(--display);font-size:clamp(30px,8vw,64px);line-height:1.08;color:var(--gold);text-shadow:0 6px 0 var(--rail),0 0 50px rgb(255 200 58 / .5);animation:bang .6s cubic-bezier(.2,.9,.3,1.4) .15s both}
.intro .nw.serif{font-family:var(--serif)}
.intro .bar{width:min(420px,80vw);height:6px;border-radius:3px;background:linear-gradient(90deg,transparent,var(--gold),transparent);animation:slidein .6s ease both}
@keyframes slidein{from{transform:translateX(-40px)}to{transform:none}}
.hand-name{font-family:var(--display);font-weight:400;font-size:40px}

/* lobby & forms */
.seatrow{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:8px;border-radius:16px;background:rgb(7 8 24 / .35)}
.seatrow .ava{width:38px;height:38px;font-size:15px;grid-row:auto}
.seatrow input,.field select{width:100%;padding:10px 12px;min-height:44px;border:1px solid var(--line);border-radius:12px;background:var(--rail);color:var(--ink);font:inherit;font-size:16px}
.seg{display:inline-flex;background:var(--rail);border-radius:12px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:8px 11px;min-height:38px;font-size:13px;font-weight:800;color:var(--muted);border-radius:9px}
.seg button.on{background:var(--gold);color:#2a1a00}
.x{border:0;background:var(--rail);border-radius:10px;width:40px;height:40px;color:var(--muted)}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mode{border:2px solid var(--line);background:var(--rail);border-radius:18px;padding:12px 14px;text-align:left;display:flex;flex-direction:column;gap:3px}
.mode.on{border-color:var(--gold);box-shadow:0 0 22px -6px var(--gold)}
.mode.hist.on{border-color:var(--paper);box-shadow:0 0 22px -6px var(--paper)}
.mode b{font-family:var(--display);font-weight:400;font-size:17px}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:12px;font-weight:800;color:var(--muted)}
.check{display:flex;gap:8px;align-items:center;font-size:14px}
.rules{display:flex;flex-direction:column;gap:10px}
.rule{display:flex;gap:10px;align-items:flex-start}
.rule .no{width:26px;height:26px;border-radius:50%;background:var(--gold);color:#2a1a00;display:grid;place-items:center;font-family:var(--display);font-size:12px;flex:0 0 auto}
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px}
.choice{text-align:left;border:2px solid var(--line);background:var(--rail);border-radius:18px;padding:12px 14px;display:flex;flex-direction:column;gap:4px;transition:transform .12s}
.choice:hover{transform:translateY(-2px)}
.choice.on{border-color:var(--gold);box-shadow:0 0 22px -6px var(--gold)}
.choice b{font-size:15px}
.badge{display:inline-block;font-size:10px;font-weight:800;background:var(--gold);color:#2a1a00;border-radius:6px;padding:0 6px;margin-left:6px;vertical-align:middle}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:16px;align-items:start}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(300px,100%),1fr));gap:16px}
.ttl{font-family:var(--display);font-weight:400;font-size:24px}

/* tables */
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:separate;border-spacing:3px;width:100%;font-size:14px}
th,td{padding:6px 8px;text-align:left;white-space:nowrap}
th{font-size:11px;color:var(--muted);letter-spacing:.06em;font-weight:800}
.st td.v{text-align:center;font-family:var(--display);border-radius:8px;background:rgb(7 8 24 / .45)}
.st td.v.p3{background:var(--gold);color:#2a1a00}
.st td.v.neg{color:var(--down)} .st td.v.pos{color:var(--up)}
tr.cur th{color:var(--gold)}
tr.cur td.v{box-shadow:inset 0 0 0 2px var(--gold)}
.chip{--c:var(--i0);display:inline-flex;align-items:center;gap:4px;border-radius:8px;padding:0 8px 0 6px;font-size:12px;font-weight:800;white-space:nowrap;line-height:22px;background:color-mix(in srgb,var(--c) 22%,transparent);box-shadow:inset 0 0 0 1px var(--c)}
.chip i{width:8px;height:8px;border-radius:2px;background:var(--c)}
.edit td input{width:54px;padding:5px;border:1px solid var(--line);border-radius:8px;background:var(--rail);color:var(--ink);font-family:var(--mono);text-align:right;font-size:16px}
.edit td.chg input{border-color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold)}
td.n,th.n{font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:right}
.lt{border-spacing:0}
.lt td,.lt th{border-bottom:1px solid var(--line)}
.yrcell{font-family:var(--serif);font-size:15px;color:var(--paper)}

/* final */
.winner{font-family:var(--display);font-weight:400;font-size:clamp(30px,6.5vw,52px);text-align:center;line-height:1.1;text-shadow:0 6px 0 var(--rail),0 0 40px rgb(255 200 58 / .35)}
.winner span{color:var(--gold)}
.podium{display:flex;justify-content:center;align-items:flex-end;gap:12px;padding-top:34px}
.pod{display:flex;flex-direction:column;align-items:center;gap:6px;width:min(30%,160px)}
.pod .ava{width:58px;height:58px;font-size:24px;grid-row:auto}
.crownbig{width:40px;height:28px;color:var(--gold);filter:drop-shadow(0 0 10px var(--gold))}
.pod .blk{width:100%;border-radius:16px 16px 6px 6px;background:linear-gradient(180deg,var(--panel2),var(--panel));box-shadow:inset 0 0 0 1px var(--line);display:flex;flex-direction:column;align-items:center;padding-top:10px;transform-origin:bottom;animation:rise .8s cubic-bezier(.2,.9,.3,1.2) both}
@keyframes rise{from{transform:scaleY(.2)}to{transform:none}}
.pod .blk .r{font-family:var(--display);font-size:34px;line-height:1}
.pod.p1 .blk{background:linear-gradient(180deg,#ffd769,#d79a17);color:#2a1a00;box-shadow:0 0 34px -6px var(--gold)}
.pod .nm{font-weight:800;font-size:13px;text-align:center;overflow-wrap:anywhere}
.pod .pts{font-family:var(--display);font-size:18px}
.awards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.award{border-radius:18px;padding:12px 14px;background:rgb(7 8 24 / .45);box-shadow:inset 0 0 0 1px var(--line);display:flex;flex-direction:column;gap:2px}
.award .t{font-family:var(--display);font-size:15px;color:var(--gold)}
.award .w{font-weight:800}
.chart svg{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-family:var(--mono);font-size:11px}
.chart .lbl{fill:var(--ink);font-family:var(--body);font-size:12px;font-weight:800}
.recap{display:flex;flex-direction:column;gap:8px}
.recap div{display:grid;grid-template-columns:54px minmax(0,1fr);gap:10px;align-items:start;padding:8px 10px;border-radius:12px;background:rgb(251 243 220 / .08)}
.recap b{font-family:var(--serif);font-size:20px;color:var(--paper);line-height:1}
.recap p{font-size:13px}

/* lab */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kpi{border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:2px;background:rgb(7 8 24 / .45);box-shadow:inset 0 0 0 1px var(--line)}
.kpi .v{font-family:var(--display);font-size:30px;line-height:1.1}
.kpi .s{font-size:12px;color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:800;border-radius:999px;padding:1px 9px;border:1px solid currentColor;white-space:nowrap}
.pill.good{color:var(--up)} .pill.warn{color:var(--gold)} .pill.bad{color:var(--down)}
.bars{display:flex;flex-direction:column;gap:8px}
.bar{display:grid;grid-template-columns:88px minmax(0,1fr) 54px;gap:8px;align-items:center;font-size:13px}
.bar .tr{height:14px;background:var(--rail);border-radius:4px;position:relative;overflow:hidden}
.bar .fl{position:absolute;inset:0 auto 0 0;border-radius:0 4px 4px 0;background:var(--c,var(--gold))}
.bar .ref{position:absolute;top:0;bottom:0;width:2px;background:var(--ink);opacity:.6}
.bar .v{font-family:var(--mono);font-size:12px;text-align:right}
.prog{height:10px;background:var(--rail);border-radius:5px;overflow:hidden}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--cta));width:0}
.verdict{display:flex;flex-direction:column;gap:8px}
.verdict div{display:flex;gap:10px;align-items:flex-start;font-size:14px}

/* online */
.codechip{font-family:var(--mono);font-weight:600;font-size:12px;letter-spacing:.06em;border-radius:8px;padding:4px 9px;background:rgb(63 224 143 / .14);color:var(--cta);box-shadow:inset 0 0 0 1px rgb(63 224 143 / .45);white-space:nowrap}
.codebox{display:flex;align-items:center;gap:12px;flex-wrap:wrap;border-radius:18px;padding:12px 16px;background:rgb(7 8 24 / .5);box-shadow:inset 0 0 0 2px rgb(63 224 143 / .45)}
.codebox .label{flex:1 0 100%}
.codebox b{font-family:var(--mono);font-size:clamp(26px,8vw,36px);letter-spacing:.06em;color:var(--cta);flex:1;min-width:0;white-space:nowrap}
.roster{display:flex;flex-direction:column;gap:6px}
.rosterrow{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:14px;background:rgb(7 8 24 / .35);flex-wrap:wrap}
.rosterrow.cpu{opacity:.75}
.joinbox{display:flex;flex-direction:column;gap:8px;border-radius:18px;padding:14px;background:rgb(7 8 24 / .4);box-shadow:inset 0 0 0 1px var(--line)}
.joinbox b{font-family:var(--display);font-weight:400;font-size:18px}
.inp{width:100%;padding:10px 12px;min-height:46px;border:1px solid var(--line);border-radius:12px;background:var(--rail);color:var(--ink);font:inherit;font-size:16px}
#jcode{font-family:var(--mono);letter-spacing:.06em}
.waitbox{display:flex;align-items:center;gap:14px;padding:12px 14px;border-radius:18px;background:rgb(7 8 24 / .4);box-shadow:inset 0 0 0 1px var(--line)}
.waitbox b{font-family:var(--display);font-weight:400;font-size:18px}
.emotes{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.emotes button{border:0;background:rgb(7 8 24 / .45);border-radius:999px;width:42px;height:42px;font-size:20px;box-shadow:inset 0 0 0 1px var(--line);transition:transform .1s}
.emotes button:active{transform:scale(.88)}
.emo{position:absolute;left:50%;top:-6px;font-size:30px;pointer-events:none;animation:emo 1.8s ease-out both;z-index:3}
@keyframes emo{0%{transform:translate(-50%,10px) scale(.4)}20%{transform:translate(-50%,-14px) scale(1.25)}100%{transform:translate(-50%,-46px) scale(1);opacity:0}}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);z-index:40;max-width:min(92vw,460px);padding:10px 16px;border-radius:14px;background:var(--ink);color:var(--night);font-weight:800;font-size:14px;box-shadow:0 12px 30px -8px #000;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s}
#toast.on{opacity:1;transform:translate(-50%,0)}
.dlrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(260px,100%),1fr));gap:10px}
.dl{display:flex;align-items:center;gap:14px;text-align:left;border:0;border-radius:18px;padding:14px 16px;min-height:72px;background:linear-gradient(150deg,var(--panel2),var(--panel));box-shadow:0 5px 0 var(--rail),inset 0 0 0 1px var(--line);color:var(--ink);transition:transform .12s}
.dl:hover{transform:translateY(-2px)} .dl:active{transform:translateY(3px)}
.dl b{display:block;font-size:16px}
.dl.hist{background:linear-gradient(150deg,var(--paper),var(--paper2));color:var(--paper-ink);box-shadow:0 5px 0 #8a6a2a}
.dl.hist .note{color:#6a5634}
.dl.long{background:linear-gradient(130deg,#2b0f4f,#7a1f74 60%,#d6336c);color:#fff;box-shadow:0 5px 0 #1c0833} .dl.long .note{color:#ffc4e6} .dl.long .dlic{background:#ffc83a;color:#2b0f4f}
.dlic{flex:0 0 auto;width:44px;height:54px;border-radius:6px;background:#e2412f;color:#fff;display:grid;place-items:end center;padding-bottom:6px;font-family:var(--display);font-size:12px;clip-path:polygon(0 0,72% 0,100% 22%,100% 100%,0 100%)}

/* app shell: nav, sheets, tutorial */
.topnav{display:flex;gap:4px;background:rgb(7 8 24 / .45);border-radius:14px;padding:4px;box-shadow:inset 0 0 0 1px var(--line)}
.topnav button{border:0;background:transparent;color:var(--muted);font-weight:800;font-size:14px;padding:8px 14px;border-radius:10px}
.topnav button.on{background:var(--gold);color:#2a1a00}
.topnav button:hover:not(.on){color:var(--ink)}
.tabbar{display:none}
.sheet-bg{position:fixed;inset:0;z-index:35;background:rgb(5 6 18 / .7);animation:fadein .2s ease both}
@keyframes fadein{from{opacity:0}}
#sheet .sheet{position:fixed;z-index:36;left:50%;top:50%;transform:translate(-50%,-50%);width:min(560px,calc(100vw - 32px));max-height:calc(100dvh - 48px);overflow:auto;border-radius:24px;padding:22px 20px 20px;background:linear-gradient(180deg,var(--panel2),var(--panel));box-shadow:0 30px 80px -20px #000,inset 0 0 0 1px var(--line);display:flex;flex-direction:column;gap:14px;animation:sheetin .25s cubic-bezier(.2,.9,.3,1.2) both}
@keyframes sheetin{from{transform:translate(-50%,-46%) scale(.97)}}
.sheet-x{position:absolute;top:12px;right:12px;width:38px;height:38px;border-radius:12px;border:0;background:rgb(7 8 24 / .5);color:var(--muted)}
.swrow{display:flex;justify-content:space-between;align-items:center;gap:12px;text-align:left;border:0;background:rgb(7 8 24 / .35);border-radius:16px;padding:12px 14px;color:var(--ink)}
.swrow b{display:block}
.sw{flex:0 0 auto;width:50px;height:30px;border-radius:15px;background:var(--rail);box-shadow:inset 0 0 0 1px var(--line);position:relative;transition:background .15s}
.sw i{position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:var(--muted);transition:transform .15s,background .15s}
.sw.on{background:var(--cta)} .sw.on i{transform:translateX(20px);background:#fff}
.tut-art{min-height:190px;display:grid;place-items:center;border-radius:18px;background:radial-gradient(circle at 50% 40%,rgb(255 200 58 / .18),rgb(7 8 24 / .4) 70%);padding:14px;overflow:hidden}
.tut-fan{display:flex;justify-content:center;align-items:flex-end}
.tut-fan .card{width:68px;margin-inline:-6px}
.tut-paper{background:linear-gradient(170deg,var(--paper),var(--paper2));color:var(--paper-ink);border-radius:14px;padding:10px 12px;width:100%;max-width:440px;display:flex;flex-direction:column;gap:6px}
.tut-paper h2{font-family:var(--serif);font-size:24px}
.tut-paper .pay .v{font-size:16px} .tut-paper .pay .n{font-size:9px}
.tut-row{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap}
.tut-arrow{font-family:var(--display);font-size:26px;color:var(--gold)}
.tut-lanes{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;max-width:360px}
.tut-fut{display:flex;flex-direction:column;gap:4px;padding:10px 14px;border-radius:14px;box-shadow:inset 0 0 0 2px var(--cyan);background:rgb(79 227 255 / .08)}
.tut-fut b{font-family:var(--display);font-weight:400;color:var(--cyan);letter-spacing:.12em}
.tut-big{font-family:var(--display);font-weight:400;font-size:64px;color:var(--gold);text-shadow:0 6px 0 var(--rail)}
.tut-dots{display:flex;gap:6px;justify-content:center}
.tut-dots i{width:8px;height:8px;border-radius:4px;background:var(--line);transition:width .2s}
.tut-dots i.on{width:22px;background:var(--gold)}
/* home */
.stats{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.stats div{border-radius:14px;padding:8px 12px;background:rgb(7 8 24 / .45);box-shadow:inset 0 0 0 1px var(--line);display:flex;flex-direction:column;min-width:70px}
.stats b{font-family:var(--display);font-weight:400;font-size:22px;line-height:1.1;color:var(--gold)}
.stats span{font-size:11px;color:var(--muted);font-weight:800}
.modecards{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.mcard,.wide{position:relative;text-align:left;border:0;border-radius:24px;padding:20px 22px;min-height:170px;display:flex;flex-direction:column;justify-content:flex-end;gap:4px;overflow:hidden;color:#fff;transition:transform .15s}
.mcard:hover,.wide:hover{transform:translateY(-3px)} .mcard:active,.wide:active{transform:translateY(2px)}
.mcard b,.wide b{font-family:var(--display);font-weight:400;font-size:28px;line-height:1.1;position:relative}
.mcard .desc,.wide .desc{font-size:13px;opacity:.9;max-width:42ch;position:relative}
.mcard .go,.wide .go{font-weight:800;font-size:13px;margin-top:6px;position:relative}
.mcard .label,.wide .label{position:relative;color:inherit;opacity:.75}
.mcard.classic{background:radial-gradient(circle at 85% 20%,rgb(255 200 58 / .35),transparent 45%),linear-gradient(150deg,#2b318a,#151843);box-shadow:0 6px 0 var(--rail),inset 0 0 0 1px var(--line)}
.mcard.classic::after{content:"";position:absolute;right:-30px;top:-20px;width:200px;height:200px;background:conic-gradient(var(--i0) 0 60deg,var(--i1) 0 120deg,var(--i2) 0 180deg,var(--i3) 0 240deg,var(--i4) 0 300deg,var(--i5) 0);border-radius:30px;transform:rotate(18deg);opacity:.35;filter:blur(1px)}
.mcard.history{background:linear-gradient(160deg,var(--paper),var(--paper2));color:var(--paper-ink);box-shadow:0 6px 0 #8a6a2a}
.mcard.history b{font-family:var(--serif)}
.mcard.history::after{content:"1964\A 2022";white-space:pre;position:absolute;right:16px;top:10px;font-family:var(--serif);font-size:44px;line-height:.95;color:var(--paper-red);opacity:.25;text-align:right}
.mcard .new{position:absolute;top:16px;left:20px;background:var(--paper-red);color:#fff;font-weight:800;font-size:11px;letter-spacing:.12em;border-radius:5px;padding:1px 8px}
.mcard.history .label{margin-top:22px}
.wide.online{background:radial-gradient(circle at 90% 10%,rgb(255 255 255 / .2),transparent 40%),linear-gradient(150deg,#22c47e,#0f7a5a);color:#03200f;box-shadow:0 6px 0 #0d5c42}
/* play / rules */
.step{display:flex;align-items:center;gap:8px;margin-top:4px}
.step .sn{width:24px;height:24px;border-radius:50%;background:var(--gold);color:#2a1a00;display:grid;place-items:center;font-family:var(--display);font-size:12px}
.seg.wide{display:flex;width:100%} .seg.wide button{flex:1 1 0;min-height:42px}
.subtabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-inline:-16px;padding-inline:16px}
.subtabs::-webkit-scrollbar{display:none}
.subtabs button{flex:0 0 auto;border:0;border-radius:999px;padding:9px 16px;font-weight:800;font-size:14px;background:rgb(7 8 24 / .45);color:var(--muted);box-shadow:inset 0 0 0 1px var(--line)}
.subtabs button.on{background:var(--gold);color:#2a1a00;box-shadow:none}
body.calm *{animation:none!important;transition:none!important}

/* progression: profile chip, level, achievements */
.pchip{display:flex;align-items:center;gap:9px;border:0;background:rgb(7 8 24 / .5);border-radius:999px;padding:4px 14px 4px 4px;box-shadow:inset 0 0 0 1px var(--line);color:var(--ink);text-align:left}
.pchip:hover{box-shadow:inset 0 0 0 1px var(--gold)}
.pmeta{display:flex;flex-direction:column;gap:2px;min-width:0}
.pmeta b{font-size:13px;line-height:1.1;max-width:9em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lvrow{display:flex;align-items:center;gap:6px}
.lv{font-family:var(--display);font-size:11px;color:var(--gold);white-space:nowrap}
.xpbar{position:relative;display:block;width:64px;height:6px;border-radius:3px;background:var(--rail);overflow:hidden;box-shadow:inset 0 0 0 1px var(--line)}
.xpbar i{position:absolute;inset:0 auto 0 0;border-radius:3px;background:linear-gradient(90deg,var(--gold),#fff1b8)}
.xpbar.big{flex:1;width:auto;height:12px;border-radius:6px} .xpbar.big i{border-radius:6px}
.xpbar i.fill{animation:xpfill 1.4s cubic-bezier(.2,.8,.2,1) .5s both}
@keyframes xpfill{from{width:var(--from)}}
.profile{display:grid;grid-template-columns:auto minmax(0,1fr);gap:18px;align-items:center;border-radius:24px;padding:20px;background:radial-gradient(circle at 10% 0%,rgb(255 200 58 / .22),transparent 50%),linear-gradient(150deg,var(--panel2),var(--panel));box-shadow:0 16px 40px -20px #000,inset 0 0 0 1px var(--line)}
.ava.big{width:88px;height:88px;font-size:36px;box-shadow:0 0 0 4px var(--rail),0 0 0 7px var(--s),0 0 30px -4px var(--s)}
.pinfo{display:flex;flex-direction:column;gap:6px;min-width:0}
.lvline{display:flex;align-items:center;gap:10px}
.lvbadge{font-family:var(--display);font-size:16px;color:#2a1a00;background:var(--gold);border-radius:10px;padding:2px 10px;box-shadow:0 3px 0 var(--gold-deep);white-space:nowrap}
.lvbadge.up{animation:lvpop .7s cubic-bezier(.2,.9,.3,1.6) 1.6s both}
@keyframes lvpop{from{transform:scale(.4)}}
.colors{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:4px}
.colors button{width:30px;height:30px;border-radius:50%;border:0;background:var(--c);box-shadow:0 0 0 2px var(--rail)}
.colors button.on{box-shadow:0 0 0 2px var(--rail),0 0 0 4px var(--c)}
.colors .btn{width:auto;height:auto;border-radius:12px;flex:0 0 auto;white-space:nowrap;background:linear-gradient(180deg,color-mix(in srgb,var(--b) 88%,#fff),var(--b));margin-left:4px}
.statgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.statgrid div{border-radius:18px;padding:12px 14px;background:linear-gradient(180deg,rgb(37 42 106 / .9),rgb(26 30 79 / .9));box-shadow:inset 0 0 0 1px var(--line);display:flex;flex-direction:column}
.statgrid b{font-family:var(--display);font-weight:400;font-size:26px;line-height:1.1;color:var(--gold)}
.statgrid span{font-size:12px;color:var(--muted);font-weight:800}
.achgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(240px,100%),1fr));gap:8px}
.ach{display:flex;align-items:center;gap:12px;border-radius:16px;padding:10px 12px;background:rgb(7 8 24 / .4);box-shadow:inset 0 0 0 1px var(--line);opacity:.55}
.ach b{display:block;font-size:14px}
.ach.on{opacity:1;box-shadow:inset 0 0 0 1px rgb(255 200 58 / .5)}
.ach.new{animation:achin .6s cubic-bezier(.2,.9,.3,1.3) 1.9s both;box-shadow:inset 0 0 0 2px var(--gold),0 0 24px -6px var(--gold)}
@keyframes achin{from{transform:translateY(12px) scale(.94)}}
.aic{flex:0 0 auto;width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-size:20px;font-weight:800;background:var(--rail);color:var(--dim)}
.ach.on .aic{background:radial-gradient(circle at 35% 30%,#fff1b8,var(--gold));color:#2a1a00;box-shadow:0 3px 0 var(--gold-deep)}
.reward{background:radial-gradient(circle at 90% 0%,rgb(255 200 58 / .2),transparent 50%),linear-gradient(180deg,var(--panel2),var(--panel))}
.xpgain{font-family:var(--display);font-weight:400;font-size:24px;color:var(--gold)}
.lvup{font-family:var(--display);font-size:clamp(28px,7vw,42px);text-align:center;color:var(--gold);text-shadow:0 5px 0 var(--rail),0 0 30px rgb(255 200 58 / .6);animation:bang .7s cubic-bezier(.2,.9,.3,1.5) 1.8s both;display:flex;flex-direction:column;align-items:center}
.lvup span{font-family:var(--body);font-size:14px;color:var(--ink);text-shadow:none;font-weight:800}
.wide.lab{background:radial-gradient(circle at 90% 10%,rgb(79 227 255 / .25),transparent 45%),linear-gradient(150deg,#1d4f8a,#162152);box-shadow:0 6px 0 var(--rail),inset 0 0 0 1px var(--line)}
/* motion */
.screen.in{animation:screenin .32s cubic-bezier(.2,.8,.2,1) both}
@keyframes screenin{from{transform:translateY(10px)}}
.mcard{transform-style:preserve-3d}
.mcard:hover{transform:perspective(900px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg)) translateY(-3px)}
.splash{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:radial-gradient(circle at 50% 40%,var(--felt2),var(--night) 70%);transition:opacity .4s}
.splash.out{opacity:0}
.sp-in{display:flex;flex-direction:column;align-items:center;gap:4px;animation:bang .7s cubic-bezier(.2,.9,.3,1.4) both}
.sp-in .mk{width:64px;height:64px;border-radius:18px;margin-bottom:10px;background:conic-gradient(var(--i0) 0 60deg,var(--i1) 0 120deg,var(--i2) 0 180deg,var(--i3) 0 240deg,var(--i4) 0 300deg,var(--i5) 0);box-shadow:inset 0 0 0 5px var(--night),0 0 40px rgb(255 200 58 / .5);animation:spin 1.3s ease-in-out both}
@keyframes spin{from{transform:rotate(-180deg) scale(.5)}}
.sp-in b{font-family:var(--display);font-weight:400;font-size:clamp(40px,11vw,64px);line-height:.95;letter-spacing:.02em}
.sp-in b.m{color:var(--gold)}
.sp-in .note{margin-top:10px}

/* daily challenge, banner, deal */
.daily{position:relative;display:flex;flex-direction:column;gap:4px;border-radius:24px;padding:18px 20px;overflow:hidden;background:radial-gradient(circle at 92% 0%,rgb(255 255 255 / .22),transparent 40%),linear-gradient(135deg,#ff8a3d,#e0457b 55%,#7d3cff);color:#fff;box-shadow:0 6px 0 #4a1d7a,0 20px 40px -18px #000}
.daily.hist{background:radial-gradient(circle at 92% 0%,rgb(255 255 255 / .35),transparent 40%),linear-gradient(135deg,#c2261b,#8a1f3d 55%,#3b1f6b)}
.daily::after{content:"";position:absolute;right:-40px;bottom:-60px;width:220px;height:220px;border-radius:50%;border:30px solid rgb(255 255 255 / .1)}
.daily b{font-family:var(--display);font-weight:400;font-size:28px;line-height:1.1;position:relative}
.daily .desc{font-size:13px;opacity:.92;max-width:52ch;position:relative}
.daily .label{color:#fff;opacity:.85}
.dhead{display:flex;justify-content:space-between;align-items:center;gap:8px;position:relative}
.streak{font-weight:800;font-size:12px;border-radius:999px;padding:2px 10px;background:rgb(0 0 0 / .25)}
.drec{display:flex;flex-direction:column;position:relative}
.drec b{font-size:20px}
.drec .grid{font-size:18px;letter-spacing:2px}
.daily .row{position:relative}
.banner{align-self:center;font-family:var(--display);font-size:clamp(26px,6vw,40px);letter-spacing:.06em;padding:4px 26px;border-radius:12px;background:var(--rail);color:var(--muted);box-shadow:inset 0 0 0 2px var(--line);transform:rotate(-2deg);animation:bang .6s cubic-bezier(.2,.9,.3,1.5) .2s both}
.banner span{color:var(--ink);font-size:1.2em}
.banner.win{background:linear-gradient(135deg,#ffd769,#f29a12);color:#2a1a00;box-shadow:0 5px 0 var(--gold-deep),0 0 40px -6px var(--gold)}
.fan.deal .card{animation:dealc .55s cubic-bezier(.2,.9,.3,1.25) both;animation-delay:calc(var(--i,0) * 70ms)}
@keyframes dealc{from{translate:0 180px;rotate:-24deg;scale:.7}}

/* ---------- tablet ---------- */
@media (max-width:880px){
  .hero{grid-template-columns:minmax(0,1fr)} .grid2{grid-template-columns:minmax(0,1fr)}
  .stage{grid-template-columns:minmax(0,1fr)} .tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
}
/* ---------- phone: thumb-first layout ---------- */
@media (max-width:640px){
  body{font-size:14px;padding-block-end:0}
  body.has-tabbar{padding-block-end:calc(84px + env(safe-area-inset-bottom,0px))}
  .tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:20;justify-content:space-around;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));background:rgb(10 12 34 / .96);box-shadow:0 -1px 0 var(--line),0 -14px 30px -12px #000;transform:translateZ(0)}
  .tabbar button{flex:1 1 0;border:0;background:transparent;color:var(--dim);display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;min-height:52px;font-size:10.5px;font-weight:800;border-radius:12px}
  .tabbar svg{width:23px;height:23px}
  .tabbar button.on{color:var(--gold)} .tabbar button.on svg{filter:drop-shadow(0 0 6px rgb(255 200 58 / .6))}
  #sheet .sheet{left:0;right:0;top:auto;bottom:0;transform:none;width:auto;max-height:88dvh;border-radius:24px 24px 0 0;padding:22px 16px calc(18px + env(safe-area-inset-bottom,0px));animation:sheetup .28s cubic-bezier(.2,.9,.3,1.1) both}
  @keyframes sheetup{from{transform:translateY(40%)}}
  .modecards{grid-template-columns:1fr} .mcard,.wide{min-height:140px;padding:16px 18px} .mcard b,.wide b{font-size:24px}
  .tut-art{min-height:160px} .tut-fan .card{width:48px}
  .stats b{font-size:18px}
  .pchip{padding:3px 10px 3px 3px;gap:6px} .pchip .ava{width:30px!important;height:30px!important;font-size:12px!important} .pmeta b{display:none} .xpbar{width:44px}
  .statgrid{grid-template-columns:repeat(2,minmax(0,1fr))} .statgrid b{font-size:22px}
  .profile{grid-template-columns:1fr;justify-items:center;text-align:center} .pinfo{align-items:center;width:100%} .lvline{width:100%} .colors{justify-content:center}
  .ava.big{width:76px;height:76px;font-size:30px}
  .wrap{gap:12px}
  .hide-sm{display:none!important}
  .hud{padding-top:10px;gap:8px}
  .logo{font-size:16px} .logo .mk{width:24px;height:24px;border-radius:7px}
  .pips i{width:16px;height:8px}
  .btn.icon{padding:6px 10px;min-height:38px}

.goals{display:flex;flex-direction:column;gap:6px;margin:10px 0}
.goal{display:flex;align-items:center;gap:10px;border-radius:12px;padding:8px 12px;background:rgb(7 8 24 / .4);box-shadow:inset 0 0 0 1px var(--line);font-weight:800;font-size:14px;color:var(--muted)}
.goal i{font-style:normal;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--rail);color:var(--dim);flex:0 0 auto}
.goal.on{color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--gold)} .goal.on i{background:var(--gold);color:#2a1a00}
.chalres{text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px;background:radial-gradient(circle at 50% 0%,rgb(255 200 58 / .22),transparent 60%),linear-gradient(180deg,var(--panel2),var(--panel))}
.chalres .goals{width:100%;text-align:left}
.chalbig{font-family:var(--display);font-size:clamp(40px,10vw,60px);line-height:1;color:var(--muted);text-shadow:0 5px 0 var(--rail);animation:bang .6s cubic-bezier(.2,.9,.3,1.5) .3s both}
.chalres.clear .chalbig{color:var(--gold);text-shadow:0 5px 0 var(--rail),0 0 40px rgb(255 200 58 / .6)}
.chalcard{position:relative;display:flex;align-items:center;gap:16px;border:0;border-radius:24px;padding:16px 18px;text-align:left;color:#fff;overflow:hidden;background:radial-gradient(circle at 15% 50%,rgb(255 255 255 / .2),transparent 40%),linear-gradient(120deg,#b97f0c,#e0730f 50%,#c2261b);box-shadow:0 6px 0 #5a2a06,0 20px 40px -18px #000;transition:transform .15s ease}
.chalcard:hover{transform:translateY(-3px)}
.chalcard .cstars{font-size:46px;line-height:1;color:#fff1b8;text-shadow:0 3px 0 rgb(0 0 0 / .3),0 0 20px rgb(255 241 184 / .7);animation:pulse 2s ease-in-out infinite}
.chalcard .ctx{flex:1;min-width:0;display:flex;flex-direction:column}
.chalcard .ctx .label{color:#ffe7b0} .chalcard .ctx b{font-family:var(--display);font-weight:400;font-size:26px;line-height:1.1} .chalcard .desc{font-size:13px;opacity:.95}
.chalcard .cnum{display:flex;flex-direction:column;align-items:center;border-radius:16px;padding:6px 12px;background:rgb(0 0 0 / .25)}
.chalcard .cnum b{font-family:var(--display);font-weight:400;font-size:28px;line-height:1} .chalcard .cnum small{font-size:11px;font-weight:800;opacity:.9}
/* ---- CPU speech bubbles ---- */
.say{position:absolute;left:50%;top:-8px;z-index:6;transform:translate(-50%,-100%);max-width:180px;white-space:nowrap;font-weight:800;font-size:12.5px;color:#1a1033;background:#fff;border-radius:14px;padding:5px 11px;box-shadow:0 6px 16px -6px #000,0 0 0 2px var(--rail);pointer-events:none;animation:say 2.6s cubic-bezier(.2,.9,.3,1.4) both}
.say::after{content:"";position:absolute;left:50%;bottom:-6px;width:12px;height:12px;background:#fff;transform:translateX(-50%) rotate(45deg);border-radius:2px}
@keyframes say{0%{opacity:0;transform:translate(-50%,-80%) scale(.6)}12%{opacity:1;transform:translate(-50%,-100%) scale(1)}85%{opacity:1;transform:translate(-50%,-100%)}100%{opacity:0;transform:translate(-50%,-115%)}}
@keyframes say2{0%{opacity:0;transform:translate(-50%,20%) scale(.6)}12%{opacity:1;transform:translate(-50%,0) scale(1)}85%{opacity:1}100%{opacity:0;transform:translate(-50%,-20%)}}
/* ---- match history ---- */
.hlist{display:flex;flex-direction:column;gap:6px}
.hrow{display:flex;align-items:center;gap:12px;border-radius:14px;padding:8px 12px;background:rgb(7 8 24 / .4);box-shadow:inset 0 0 0 1px var(--line)}
.hplace{flex:0 0 auto;width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-family:var(--display);font-size:22px;line-height:1;background:var(--panel2);color:var(--muted)}
.hplace small{font-size:10px;margin-top:-6px;opacity:.7}
.hplace.p1{background:radial-gradient(circle at 35% 30%,#fff1b8,var(--gold));color:#2a1a00;box-shadow:0 3px 0 var(--gold-deep)}
.hplace.p2{background:linear-gradient(160deg,#eef2ff,#9aa3cf);color:#20244f} .hplace.p3{background:linear-gradient(160deg,#ffd2b0,#b5713e);color:#3a1d06}
.hmeta{flex:1;min-width:0;display:flex;flex-direction:column} .hmeta b{font-size:14px}
.htag{display:inline-block;font-size:10px;font-weight:800;border-radius:6px;padding:0 6px;vertical-align:2px;background:var(--panel2);color:var(--muted)}
.htag.long{background:#ff7ad1;color:#2b0f4f} .htag.cy{color:var(--cyan)}
.hgrid{font-size:12px;letter-spacing:1px;white-space:nowrap;overflow:hidden;max-width:40%}
.hs{font-family:var(--display);font-weight:400;font-size:20px;min-width:52px;text-align:right} .hs small{font-size:11px;color:var(--muted);margin-left:2px}
@media (max-width:560px){ .hgrid{display:none} }
/* ---- long guide ---- */
.lsteps{display:flex;flex-direction:column;gap:10px;margin:8px 0 14px}
.lstep{display:flex;align-items:center;gap:12px;border-radius:16px;padding:12px;background:rgb(7 8 24 / .4);box-shadow:inset 0 0 0 1px var(--line)}
.lstep > div{flex:1;min-width:0} .lstep b{font-size:15px}
.ln{flex:0 0 auto;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);background:#ff7ad1;color:#2b0f4f}
.lstep .mkt{flex:0 0 auto;width:92px;padding:8px 6px;gap:2px;border-radius:14px} .lstep .mkt .mic{width:36px;height:36px;font-size:20px} .lstep .mkt .mn{font-size:15px} .lstep .mkt .md,.lstep .mkt .men{display:none} .lstep .mkt .mlab{font-size:8px}
/* ---- mode themes: the same world, re-lit per mode ---- */
body[data-theme="hist"]{--night:#140c07;--felt:#2a1910;--felt2:#55331b;--rail:#0c0704;--panel:#2f1f14;--panel2:#3f2a1a;--line:#5e4129;--muted:#d6c1a2;--dim:#9c8467}
body[data-theme="long"]{--night:#11052a;--felt:#230a40;--felt2:#53146a;--rail:#09021a;--panel:#2a0f4c;--panel2:#3b1663;--line:#5c2b86;--muted:#dcbcec;--dim:#9d7abd}
body[data-theme="hist"] #bg{filter:sepia(.9) hue-rotate(-12deg)}
body[data-theme="long"] #bg{filter:hue-rotate(55deg) saturate(1.3)}
body{transition:background-color .5s ease}
/* ---- market cards (long only) ---- */
.mkt{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;color:#fff;border-radius:20px;padding:16px 14px 14px;overflow:hidden;
  background:radial-gradient(circle at 50% 28%,rgb(255 255 255 / .35),transparent 45%),linear-gradient(165deg,var(--m1),var(--m2) 70%,color-mix(in srgb,var(--m2) 60%,#000));
  box-shadow:0 0 0 3px var(--rail),0 0 0 5px color-mix(in srgb,var(--m1) 70%,#fff),0 18px 30px -14px #000}
.mkt::before{content:"";position:absolute;inset:8px;border-radius:14px;border:1.5px solid rgb(255 255 255 / .45);pointer-events:none}
.mkt::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(135deg,rgb(255 255 255 / .07) 0 6px,transparent 6px 14px);pointer-events:none}
.mkt .mlab{font-size:10px;font-weight:800;letter-spacing:.24em;opacity:.9;position:relative}
.mkt .mic{position:relative;width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font-size:34px;line-height:1;background:rgb(0 0 0 / .22);box-shadow:inset 0 0 0 2px rgb(255 255 255 / .5),0 4px 0 rgb(0 0 0 / .25);text-shadow:0 2px 0 rgb(0 0 0 / .3)}
.mkt .mn{position:relative;font-family:var(--display);font-weight:400;font-size:28px;line-height:1.1;text-shadow:0 3px 0 rgb(0 0 0 / .3)}
.mkt .men{position:relative;font-family:var(--display);font-size:10px;letter-spacing:.3em;opacity:.8}
.mkt .md{position:relative;font-weight:800;font-size:14px;border-radius:12px;padding:6px 10px;background:rgb(0 0 0 / .3);margin-top:4px}
.mkt .mtip{position:relative;font-size:12px;opacity:.95;max-width:26ch;line-height:1.5}
.mkt.big{width:min(260px,72vw);padding:20px 16px 18px}
.mkt.big .mic{width:84px;height:84px;font-size:46px} .mkt.big .mn{font-size:36px}
.mkt.flip{animation:mktflip .8s cubic-bezier(.2,.9,.3,1.2) .35s both}
@keyframes mktflip{0%{transform:perspective(800px) rotateY(180deg) scale(.7);filter:brightness(.3)}60%{filter:brightness(1.4)}100%{transform:none;filter:none}}
.mkt.wide{flex-direction:row;flex-wrap:wrap;justify-content:flex-start;text-align:left;gap:4px 12px;padding:12px 14px;border-radius:16px}
.mkt.wide .mlab,.mkt.wide .men{display:none}
.mkt.wide .mic{width:44px;height:44px;font-size:24px} .mkt.wide .mn{font-size:22px} .mkt.wide .md{flex-basis:100%;font-size:13px;margin:0}
.mktwrap{display:flex;flex-direction:column;align-items:center;gap:8px;margin-top:6px}
.mktchip{display:inline-flex;align-items:center;gap:4px;font-weight:800;font-size:12px;border-radius:999px;padding:3px 10px;color:#fff;background:linear-gradient(135deg,var(--m1),var(--m2));box-shadow:0 2px 0 rgb(0 0 0 / .35);white-space:nowrap;text-shadow:0 1px 0 rgb(0 0 0 / .3)}
.snext .mkt{margin:8px 0 2px}
@media (max-width:560px){ .mkt.big{width:min(220px,64vw)} .mkt.big .mic{width:64px;height:64px;font-size:34px} .mkt.big .mn{font-size:28px} .overlay.intro .box{gap:10px} }
/* ---- rank emblem ---- */
.emb{position:relative;display:inline-grid;place-items:center;flex:0 0 auto;width:var(--z);height:calc(var(--z)*1.12);vertical-align:middle;filter:drop-shadow(0 calc(var(--z)*.06) 0 rgb(0 0 0 / .45))}
.emb::before,.emb::after{content:"";position:absolute;clip-path:polygon(50% 0,100% 24%,100% 70%,50% 100%,0 70%,0 24%)}
.emb::before{inset:0;background:linear-gradient(160deg,#fff 0%,var(--e1) 30%,var(--e2) 100%)}
.emb::after{inset:13%;background:radial-gradient(circle at 40% 25%,rgb(255 255 255 / .55),transparent 45%),linear-gradient(200deg,var(--e2),color-mix(in srgb,var(--e2) 55%,#000))}
.emb i{position:relative;z-index:1;font-style:normal;font-weight:800;color:var(--e1);font-size:calc(var(--z)*.26);letter-spacing:-.05em;line-height:1;text-shadow:0 1px 0 rgb(0 0 0 / .5)}
.emb.t-diamond,.emb.t-master{filter:drop-shadow(0 calc(var(--z)*.06) 0 rgb(0 0 0 / .45)) drop-shadow(0 0 calc(var(--z)*.25) var(--e1))}
.emb.t-master::before{background:conic-gradient(from 0deg,#ff5c9a,#ffc83a,#5cf0a2,#4fe3ff,#a77bff,#ff5c9a)}
.lvrow .emb{margin-right:2px}
.vsn span .emb{margin-right:2px;vertical-align:-3px}
.rankcard{display:flex;align-items:center;gap:18px;border-radius:24px;padding:18px 20px;background:radial-gradient(circle at 8% 50%,color-mix(in srgb,var(--e1) 30%,transparent),transparent 45%),linear-gradient(180deg,var(--panel2),var(--panel));box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--e1) 45%,var(--line))}
.rinfo{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.rname{font-family:var(--display);font-weight:400;font-size:28px;line-height:1.05;color:var(--e1)}
.rrate{font-size:14px;color:var(--muted);font-weight:800}
.rbar{display:block;height:10px;border-radius:5px;background:var(--rail);overflow:hidden;box-shadow:inset 0 0 0 1px var(--line);margin:4px 0}
.rbar i{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,var(--e2),var(--e1))}
.rdelta{display:flex;align-items:center;gap:14px;border-radius:18px;padding:10px 14px;background:linear-gradient(90deg,color-mix(in srgb,var(--e1) 18%,transparent),rgb(7 8 24 / .35));box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--e1) 50%,var(--line));animation:achin .55s cubic-bezier(.2,.9,.3,1.3) .9s both}
.rtx{flex:1;display:flex;flex-direction:column;min-width:0} .rtx b{font-size:17px}
.rd{font-family:var(--display);font-weight:400;font-size:28px}
.rd.up{color:var(--up)} .rd.down{color:var(--down)}
.rdelta.promo{box-shadow:inset 0 0 0 2px var(--e1),0 0 30px -6px var(--e1)}
.rdelta.promo .emb{animation:lvpop .8s cubic-bezier(.2,.9,.3,1.6) 1.4s both}
.promo-t{font-family:var(--display);font-size:15px;color:var(--e1);letter-spacing:.04em}
/* ---- VS screen ---- */
.overlay.vs{cursor:pointer;overflow:hidden;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:22px;background:#07081a}
.vsbg{position:absolute;inset:-20%;background:linear-gradient(105deg,#3a1d6e 0 49.6%,transparent 49.6% 50.4%,#0e3a5c 50.4%);animation:vsbg .5s cubic-bezier(.2,.8,.2,1) both}
.vsbg::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(105deg,rgb(255 255 255 / .05) 0 2px,transparent 2px 26px),radial-gradient(circle at 50% 50%,rgb(255 200 58 / .35),transparent 40%)}
@keyframes vsbg{from{transform:scale(1.4) rotate(-4deg);opacity:0}}
.vsmode{position:relative;font-family:var(--display);letter-spacing:.24em;font-size:clamp(13px,3.2vw,18px);color:var(--gold);padding:5px 18px;border-radius:999px;background:rgb(7 8 24 / .6);box-shadow:inset 0 0 0 1.5px var(--gold-deep);animation:slidein .5s ease both}
.vsrow{position:relative;width:min(900px,100%);display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:clamp(8px,3vw,28px)}
.vsside{display:flex;flex-direction:column;gap:10px}
.vsside.l{align-items:flex-end} .vsside.r{align-items:flex-start}
.vsp{display:flex;align-items:center;gap:10px;padding:8px 14px 8px 8px;border-radius:18px;background:linear-gradient(90deg,rgb(7 8 24 / .75),rgb(7 8 24 / .45));box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--s) 70%,transparent),0 10px 24px -12px #000;max-width:100%}
.vsp.l{flex-direction:row-reverse;padding:8px 8px 8px 14px;text-align:right;animation:vsl .55s cubic-bezier(.2,.9,.3,1.25) both}
.vsp.r{animation:vsr .55s cubic-bezier(.2,.9,.3,1.25) both}
@keyframes vsl{from{transform:translateX(-120vw)}} @keyframes vsr{from{transform:translateX(120vw)}}
.vsp .ava{width:46px;height:46px;font-size:19px;flex:0 0 auto}
.vsside.l .vsp:only-child .ava{width:72px;height:72px;font-size:30px}
.vsside.l .vsp:only-child .vsn b{font-size:clamp(18px,4.5vw,28px)}
.vsn{display:flex;flex-direction:column;min-width:0} .vsn b{font-family:var(--display);font-weight:400;font-size:clamp(14px,3.6vw,18px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vsn span{font-size:11px;color:var(--muted);font-weight:800}
.vsmark{font-family:var(--display);font-size:clamp(56px,15vw,120px);line-height:1;color:#fff;font-style:italic;text-shadow:0 0 0 transparent,-4px 0 0 var(--red),4px 0 0 var(--cyan),0 8px 0 var(--rail),0 0 60px rgb(255 200 58 / .8);animation:vsmark .6s cubic-bezier(.2,.9,.3,1.6) .45s both}
@keyframes vsmark{from{transform:scale(3.2) rotate(-14deg);opacity:0}}
.vsfoot{position:relative;font-weight:800;font-size:13px;color:var(--ink);padding:6px 14px;border-radius:12px;background:rgb(7 8 24 / .55);animation:slidein .5s ease .7s both}
.overlay.vs > .note{position:relative}
@media (max-width:560px){
  .vsrow{grid-template-columns:1fr;justify-items:center;gap:10px}
  .vsside.l,.vsside.r{align-items:center}
  .vsside.r{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:100%}
  .vsside.r .vsp{padding:6px 10px 6px 6px} .vsside.r .vsp .ava{width:36px;height:36px;font-size:15px}
  .vsmark{font-size:64px}
}
.rcard{display:block;width:100%;max-width:420px;margin:0 auto;border-radius:18px;box-shadow:0 0 0 1px var(--line),0 20px 40px -16px #000}
/* ---- cut-in ---- */
.cutin{position:fixed;inset:0;z-index:29;pointer-events:none;display:grid;place-items:center;overflow:hidden}
.cutin .band{width:140vw;transform:rotate(-8deg);padding:14px 0;display:flex;align-items:baseline;justify-content:center;gap:16px;background:linear-gradient(90deg,transparent,var(--gold) 12%,#ffe08a 50%,var(--gold) 88%,transparent);box-shadow:0 0 0 4px var(--rail),0 0 60px rgb(255 200 58 / .7);animation:cutin 1.45s cubic-bezier(.2,.8,.2,1) both}
.cutin b{font-family:var(--display);font-weight:400;font-size:clamp(44px,11vw,84px);line-height:1;color:#2a1a00;text-shadow:0 4px 0 rgb(255 255 255 / .5)}
.cutin span{font-family:var(--display);font-size:clamp(18px,4.5vw,30px);color:#5a3a00}
.cutin.big .band{background:linear-gradient(90deg,transparent,var(--cta) 12%,#b6ffd6 50%,var(--cta) 88%,transparent);box-shadow:0 0 0 4px var(--rail),0 0 60px rgb(63 224 143 / .7)}
.cutin.big b{color:#04220f} .cutin.big span{color:#0d4a2a}
@keyframes cutin{0%{transform:rotate(-8deg) translateX(110%)}18%{transform:rotate(-8deg) translateX(0)}78%{transform:rotate(-8deg) translateX(-3%);opacity:1}100%{transform:rotate(-8deg) translateX(-110%);opacity:0}}
/* ---- card skins ---- */
.card.sk-gold{box-shadow:0 0 0 2px var(--rail),0 0 0 4.5px var(--gold),0 0 0 6px var(--rail),0 0 0 7.5px var(--gold-deep),0 16px 26px -12px #000}
.card.sk-gold .ban{background:linear-gradient(180deg,var(--gold2),var(--gold) 55%,var(--gold-deep));color:#2a1a00}
.card.sk-gold .art .disc{box-shadow:0 0 0 3px var(--gold),0 0 0 5px rgb(0 0 0 / .25),inset 0 -6px 12px rgb(0 0 0 / .2)}
.back.sk-gold{background:linear-gradient(135deg,#ffe08a,#c98e12);box-shadow:0 0 0 2px var(--rail),0 0 0 3.5px var(--gold2),0 6px 10px -4px #000}

.card.sk-neon::before{background:repeating-linear-gradient(0deg,rgb(255 255 255 / .04) 0 1px,transparent 1px 4px)}

.card.sk-neon .ban{background:rgb(0 0 0 / .45);color:color-mix(in srgb,var(--c) 45%,#fff);text-shadow:0 0 8px var(--c);border-top:1px solid color-mix(in srgb,var(--c) 60%,transparent)}
.card.sk-neon .wm{opacity:.1;color:var(--c)}
.back.sk-neon{background:#06071a;box-shadow:0 0 0 2px var(--cyan),0 0 12px var(--cyan),0 6px 10px -4px #000}

.card.sk-washi{color:var(--paper-ink);background:radial-gradient(circle at 18% 22%,#e7c160 0 2px,transparent 3px),radial-gradient(circle at 78% 14%,#e7c160 0 3px,transparent 4px),radial-gradient(circle at 70% 70%,#e7c160 0 2px,transparent 3px),radial-gradient(circle at 30% 82%,#d9ae45 0 1.5px,transparent 2.5px),radial-gradient(circle at 88% 50%,#e7c160 0 1.5px,transparent 2.5px),linear-gradient(170deg,#fffaf0,var(--paper) 50%,var(--paper2));box-shadow:0 0 0 3px var(--rail),0 0 0 5px #c9a24a,0 16px 26px -12px #000}
.card.sk-washi::before{background:repeating-linear-gradient(90deg,rgb(36 24 10 / .035) 0 1px,transparent 1px 5px),linear-gradient(180deg,rgb(255 255 255 / .5),transparent 25%)}
.card.sk-washi .art .disc{background:radial-gradient(circle at 35% 30%,color-mix(in srgb,var(--c) 70%,#fff),var(--c));box-shadow:0 0 0 2px #c9a24a,0 4px 0 color-mix(in srgb,var(--c) 55%,#000)}
.card.sk-washi .art svg{color:#fff}
.card.sk-washi .ban{background:var(--c);color:#fff;font-family:var(--serif);font-weight:800;border-top:2px solid #c9a24a}

.card.sk-washi .no{color:var(--paper-red)} .card.sk-washi .pt:not(.up):not(.down),.card.sk-washi .nx{color:#fff}
.back.sk-washi{background:radial-gradient(circle at 30% 30%,#e7c160 0 1.5px,transparent 2.5px),radial-gradient(circle at 70% 65%,#e7c160 0 2px,transparent 3px),linear-gradient(170deg,#fffaf0,var(--paper2));box-shadow:0 0 0 2px var(--rail),0 0 0 3.5px #c9a24a,0 6px 10px -4px #000}
.back.sk-washi::after{content:"麻";color:var(--paper-red);font-family:var(--serif);font-weight:800}

const B2 = [[3,-1,-2,-1,-3,0],[0,3,2,1,0,1],[2,1,3,0,2,-1],[0,2,1,3,1,2],[1,0,-1,2,3,1],[-1,1,0,1,-1,3]];

const HIST = [
