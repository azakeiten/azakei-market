.gd-bub{position:relative;margin:0;flex:1;min-width:0;padding:10px 14px;border-radius:4px 18px 18px 18px;background:#fff;color:#2a2140;font-size:15px;font-weight:700;line-height:1.6;box-shadow:0 4px 0 rgb(0 0 0 / .18)}
.gd-bub b{display:block;font-size:11px;color:#d14d93;letter-spacing:.06em}
.gd-pt{display:flex;gap:8px;align-items:baseline;margin:10px 0 4px;font-size:13.5px;font-weight:700;color:var(--muted)}
.gd-pt b{flex:none;font-size:11px;font-weight:900;padding:2px 8px;border-radius:999px;background:var(--gold);color:#2a1a00}
.gd-talk[data-k] .gd-bub{animation:gdPop .35s cubic-bezier(.2,1.4,.4,1) both}
@keyframes gdPop{from{opacity:0;transform:translateY(6px) scale(.96)}}
.nb-card{display:flex;flex-direction:column;gap:12px;padding:16px;border-radius:24px;background:linear-gradient(160deg,rgb(255 154 217 / .2),var(--panel) 60%);box-shadow:inset 0 0 0 2px rgb(255 154 217 / .5),0 10px 30px -16px #ff9ad9}
.nb-steps{display:flex;flex-direction:column;gap:8px}
.nb-step{position:relative;display:flex;align-items:center;gap:12px;min-height:60px;padding:10px 14px;border:0;border-radius:16px;cursor:pointer;text-align:left;font:inherit;color:var(--ink);background:var(--panel2);box-shadow:inset 0 0 0 1px var(--line)}
.nb-step i{flex:none;font-style:normal;display:grid;place-items:center;width:34px;height:34px;border-radius:50%;font-family:var(--display);font-size:16px;background:var(--rail);box-shadow:inset 0 0 0 2px var(--line)}
.nb-step span{display:flex;flex-direction:column;min-width:0}.nb-step b{font-size:16px}.nb-step small{font-size:12.5px;color:var(--muted)}
.nb-step.done{opacity:.75}.nb-step.done i{background:var(--cta);color:#06331b;box-shadow:none}
.nb-step.now{background:linear-gradient(100deg,#ffd769,#f6a821);color:#2a1a00;box-shadow:0 5px 0 var(--gold-deep),0 0 24px -6px var(--gold)}
.nb-step.now i{background:#fff;color:#2a1a00;box-shadow:none}.nb-step.now small{color:#5a3c00}
.nb-step em{margin-left:auto;font-style:normal;font-size:12px;font-weight:900;padding:3px 10px;border-radius:999px;background:#2a1a00;color:#ffd769;animation:nbBob 1.4s ease-in-out infinite}
@keyframes nbBob{50%{transform:translateX(-4px)}}
.nb-prog{height:8px;border-radius:4px;background:var(--rail);overflow:hidden}.nb-prog span{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,#ff9ad9,#ffc83a);transition:width .6s}
.nb-card .linkbtn{align-self:center;font-size:12.5px}
.nb-lock{display:flex;gap:12px;align-items:center;padding:14px 16px;border-radius:20px;background:var(--panel);box-shadow:inset 0 0 0 1.5px dashed var(--line);border:2px dashed var(--line)}
.nb-lock-ic{font-size:30px}.nb-lock b{display:block;font-size:15px}
.nb-open{display:flex;flex-direction:column;gap:10px;padding:16px;border-radius:24px;background:linear-gradient(160deg,rgb(255 200 58 / .2),var(--panel));box-shadow:inset 0 0 0 2px rgb(255 200 58 / .5);animation:achin .5s cubic-bezier(.2,.9,.3,1.3) both}
.nb-open .btn{align-self:flex-end}
@media (prefers-reduced-motion:reduce){.nb-step em,.gd-talk[data-k] .gd-bub{animation:none}}
.mio-turn{margin:0 0 10px}
.mio-turn .gd-ava{width:40px;height:40px;font-size:20px}.mio-turn .gd-bub{font-size:14px}
.mio-final{display:flex;flex-direction:column;gap:10px;padding:16px;border-radius:24px;background:linear-gradient(160deg,rgb(255 154 217 / .18),var(--panel) 60%);box-shadow:inset 0 0 0 2px rgb(255 154 217 / .45)}
.mio-tip{display:flex;gap:10px;align-items:baseline;margin:0;padding:10px 12px;border-radius:14px;background:var(--rail);font-size:14px;font-weight:700;line-height:1.6}
.mio-tip span{flex:none;font-size:11px;font-weight:900;padding:2px 9px;border-radius:999px;background:#ff9ad9;color:#3a0f2a}
.opp-row{display:flex;flex-direction:column;gap:6px}
.opp-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:6px}
.opp{display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 8px;border:0;border-radius:16px;cursor:pointer;font:inherit;color:var(--ink);text-align:center;background:var(--panel2);box-shadow:inset 0 0 0 1px var(--line)}
.opp .ava{width:42px;height:42px;font-size:20px}.opp b{font-size:14px}.opp small{font-size:11px;color:var(--muted);line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.adv-box{border-radius:16px;background:rgb(7 8 24 / .35);box-shadow:inset 0 0 0 1px var(--line);padding:0 12px}
.adv-box>summary{list-style:none;cursor:pointer;display:flex;flex-direction:column;gap:1px;padding:12px 28px 12px 2px;position:relative;min-height:48px}
.adv-box>summary::-webkit-details-marker{display:none}
.adv-box>summary::after{content:"›";position:absolute;right:4px;top:50%;translate:0 -50%;font-size:22px;font-weight:900;color:var(--muted);transition:rotate .2s}
.adv-box[open]>summary::after{rotate:90deg}
.adv-box>summary span{font-weight:800;font-size:15px}.adv-box>summary small{font-size:12px;color:var(--muted)}
.adv-box[open]{padding-bottom:12px}.adv-box[open]>*:not(summary){margin-top:10px}
.stbar{position:sticky;bottom:12px;z-index:5;display:flex;flex-direction:column;gap:6px;margin-top:6px;padding:10px;border-radius:20px;background:rgb(10 12 34 / .92);backdrop-filter:blur(6px);box-shadow:0 0 0 1px var(--line),0 10px 30px -10px #000}
.stbar-sum{font-size:12.5px;font-weight:800;color:var(--muted);text-align:center}
.stbar .btn{width:100%}
@media (max-width:640px){.stbar{bottom:calc(74px + env(safe-area-inset-bottom,0px))}}
.hlp-b{font-weight:900;font-size:18px}
.hlp-list{margin:12px 0 14px;padding:0;list-style:none;counter-reset:hl;display:flex;flex-direction:column;gap:8px}
.hlp-list li{counter-increment:hl;display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:14px;background:var(--panel2);box-shadow:inset 0 0 0 1px var(--line);font-size:14.5px;font-weight:700;line-height:1.6}
.hlp-list li::before{content:counter(hl);flex:none;display:grid;place-items:center;width:26px;height:26px;border-radius:50%;background:#ff9ad9;color:#3a0f2a;font-family:var(--display);font-size:13px}

.chalbig{font-family:var(--display);font-size:clamp(40px,10vw,60px);line-height:1;color:var(--muted);text-shadow:0 5px 0 var(--rail);animation:bang .6s cubic-bezier(.2,.9,.3,1.5) .3s both}
.chalres.clear .chalbig{color:var(--gold-t);text-shadow:0 5px 0 var(--rail),0 0 40px rgb(255 200 58 / .6)}
.chalcard{position:relative;display:flex;align-items:center;gap:16px;border:0;border-radius:24px;padding:16px 18px;text-align:left;color:#fff;overflow:hidden;background:radial-gradient(circle at 15% 50%,rgb(255 255 255 / .2),transparent 40%),linear-gradient(120deg,#b97f0c,#e0730f 50%,#c2261b);box-shadow:0 6px 0 #5a2a06,0 20px 40px -18px #000;transition:transform .15s ease}
.chalcard:hover{transform:translateY(-3px)}
.chalcard .cstars{font-size:46px;line-height:1;color:#fff1b8;text-shadow:0 3px 0 rgb(0 0 0 / .3),0 0 20px rgb(255 241 184 / .7);animation:pulse 2s ease-in-out infinite}
.chalcard .ctx{flex:1;min-width:0;display:flex;flex-direction:column}
.chalcard .ctx .label{color:#ffe7b0} .chalcard .ctx b{font-family:var(--display);font-weight:400;font-size:26px;line-height:1.1} .chalcard .desc{font-size:13px;opacity:.95}
.chalcard .cnum{display:flex;flex-direction:column;align-items:center;border-radius:16px;padding:6px 12px;background:rgb(0 0 0 / .25)}
.chalcard .cnum b{font-family:var(--display);font-weight:400;font-size:28px;line-height:1} .chalcard .cnum small{font-size:11px;font-weight:800;opacity:.9}
/* ---- CPU speech bubbles ---- */
.say{position:absolute;left:50%;top:-8px;z-index:6;transform:translate(-50%,-100%);max-width:180px;white-space:nowrap;font-weight:800;font-size:12.5px;color:#1a1033;background:#fff;border-radius:14px;padding:5px 11px;box-shadow:0 6px 16px -6px #000,0 0 0 2px var(--rail);pointer-events:none;animation:say 2.6s cubic-bezier(.2,.9,.3,1.4) both}
.say{border:2px solid var(--rc,transparent)}
.say::after{content:"";position:absolute;left:50%;bottom:-6px;width:12px;height:12px;background:#fff;transform:translateX(-50%) rotate(45deg);border-radius:2px}
@keyframes say{0%{opacity:0;transform:translate(-50%,-80%) scale(.6)}12%{opacity:1;transform:translate(-50%,-100%) scale(1)}85%{opacity:1;transform:translate(-50%,-100%)}100%{opacity:0;transform:translate(-50%,-115%)}}
@keyframes say2{0%{opacity:0;transform:translate(-50%,20%) scale(.6)}12%{opacity:1;transform:translate(-50%,0) scale(1)}85%{opacity:1}100%{opacity:0;transform:translate(-50%,-20%)}}
/* ---- match history ---- */
.hlist{display:flex;flex-direction:column;gap:6px}
.hrow{display:flex;align-items:center;gap:12px;border-radius:14px;padding:8px 12px;background:rgb(7 8 24 / .4);box-shadow:inset 0 0 0 1px var(--line)}
.hplace{flex:0 0 auto;width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-family:var(--display);font-size:22px;line-height:1;background:var(--panel2);color:var(--muted)}
.hplace small{font-size:11px;margin-top:-6px;opacity:.7}
.hplace.p1{background:radial-gradient(circle at 35% 30%,#fff1b8,var(--gold));color:#2a1a00;box-shadow:0 3px 0 var(--gold-deep)}
.hplace.p2{background:linear-gradient(160deg,#eef2ff,#9aa3cf);color:#20244f} .hplace.p3{background:linear-gradient(160deg,#ffd2b0,#b5713e);color:#3a1d06}
.hmeta{flex:1;min-width:0;display:flex;flex-direction:column} .hmeta b{font-size:14px}
.htag{display:inline-block;font-size:11px;font-weight:800;border-radius:6px;padding:0 6px;vertical-align:2px;background:var(--panel2);color:var(--muted)}
.htag.long{background:#ff7ad1;color:#2b0f4f} .htag.cy{color:var(--cyan-tx)}
.hgrid{font-size:12px;letter-spacing:1px;white-space:nowrap;overflow:hidden;max-width:40%}
.hs{font-family:var(--display);font-weight:400;font-size:20px;min-width:52px;text-align:right} .hs small{font-size:11px;color:var(--muted);margin-left:2px}
@media (max-width:560px){ .hgrid{display:none} }
/* ---- long guide ---- */
.lsteps{display:flex;flex-direction:column;gap:10px;margin:8px 0 14px}
.lstep{display:flex;align-items:center;gap:12px;border-radius:16px;padding:12px;background:rgb(7 8 24 / .4);box-shadow:inset 0 0 0 1px var(--line)}
.lstep > div{flex:1;min-width:0} .lstep b{font-size:15px}
.ln{flex:0 0 auto;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);background:#ff7ad1;color:#2b0f4f}
.lstep .mkt{flex:0 0 auto;width:92px;padding:8px 6px;gap:2px;border-radius:14px} .lstep .mkt .mic{width:36px;height:36px;font-size:20px} .lstep .mkt .mn{font-size:15px} .lstep .mkt .md,.lstep .mkt .men{display:none} .lstep .mkt .mlab{font-size:11px}
/* ---- mode themes: the same world, re-lit per mode ---- */
body[data-theme="hist"]{--night:#140c07;--felt:#2a1910;--felt2:#55331b;--rail:#0c0704;--panel:#2f1f14;--panel2:#3f2a1a;--line:#5e4129;--muted:#d6c1a2;--dim:#9c8467}
body[data-theme="long"]{--night:#11052a;--felt:#230a40;--felt2:#53146a;--rail:#09021a;--panel:#2a0f4c;--panel2:#3b1663;--line:#5c2b86;--muted:#dcbcec;--dim:#9d7abd}
body[data-theme="hist"] #bg{filter:sepia(.9) hue-rotate(-12deg)}
body[data-theme="long"] #bg{filter:hue-rotate(55deg) saturate(1.3)}
body{transition:background-color .5s ease}
/* ---- market cards (long only) ---- */
.mkt{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;color:#fff;border-radius:20px;padding:16px 14px 14px;overflow:hidden;
  background:radial-gradient(circle at 50% 28%,rgb(255 255 255 / .35),transparent 45%),linear-gradient(165deg,var(--m1),var(--m2) 70%,color-mix(in srgb,var(--m2) 60%,#000));
  box-shadow:0 0 0 3px var(--rail),0 0 0 5px color-mix(in srgb,var(--m1) 70%,#fff),0 18px 30px -14px #000}
.mkt::before{content:"";position:absolute;inset:8px;border-radius:14px;border:1.5px solid rgb(255 255 255 / .45);pointer-events:none}
.mkt::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(135deg,rgb(255 255 255 / .07) 0 6px,transparent 6px 14px);pointer-events:none}
.mkt .mlab{font-size:11px;font-weight:800;letter-spacing:.24em;opacity:.9;position:relative}
.mkt .mic{position:relative;width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font-size:34px;line-height:1;background:rgb(0 0 0 / .22);box-shadow:inset 0 0 0 2px rgb(255 255 255 / .5),0 4px 0 rgb(0 0 0 / .25);text-shadow:0 2px 0 rgb(0 0 0 / .3)}
.mkt .mn{position:relative;font-family:var(--display);font-weight:400;font-size:28px;line-height:1.1;text-shadow:0 3px 0 rgb(0 0 0 / .3)}
.mkt .men{position:relative;font-family:var(--display);font-size:11px;letter-spacing:.3em;opacity:.8}
.mkt .md{position:relative;font-weight:800;font-size:14px;border-radius:12px;padding:6px 10px;background:rgb(0 0 0 / .3);margin-top:4px}
.mkt .mtip{position:relative;font-size:12px;opacity:.95;max-width:26ch;line-height:1.5}
.mkt.big{width:min(260px,72vw);padding:20px 16px 18px}
.mkt.big .mic{width:84px;height:84px;font-size:46px} .mkt.big .mn{font-size:36px}
.mkt.flip{animation:mktflip .8s cubic-bezier(.2,.9,.3,1.2) .35s both}
@keyframes mktflip{0%{transform:perspective(800px) rotateY(180deg) scale(.7);filter:brightness(.3)}60%{filter:brightness(1.4)}100%{transform:none;filter:none}}
.mkt.wide{flex-direction:row;flex-wrap:wrap;justify-content:flex-start;text-align:left;gap:4px 12px;padding:12px 14px;border-radius:16px}
.mkt.wide .mlab,.mkt.wide .men{display:none}
.mkt.wide .mic{width:44px;height:44px;font-size:24px} .mkt.wide .mn{font-size:22px} .mkt.wide .md{flex-basis:100%;font-size:13px;margin:0}
.mktwrap{display:flex;flex-direction:column;align-items:center;gap:8px;margin-top:6px}
.mktchip{display:inline-flex;align-items:center;gap:4px;font-weight:800;font-size:12px;border-radius:999px;padding:3px 10px;color:#fff;background:linear-gradient(135deg,var(--m1),var(--m2));box-shadow:0 2px 0 rgb(0 0 0 / .35);white-space:nowrap;text-shadow:0 1px 0 rgb(0 0 0 / .3)}
.snext .mkt{margin:8px 0 2px}
@media (max-width:560px){ .mkt.big{width:min(220px,64vw)} .mkt.big .mic{width:64px;height:64px;font-size:34px} .mkt.big .mn{font-size:28px} .overlay.intro .box{gap:10px} }
/* ---- rank emblem ---- */
.emb{position:relative;display:inline-grid;place-items:center;flex:0 0 auto;width:var(--z);height:calc(var(--z)*1.12);vertical-align:middle;filter:drop-shadow(0 calc(var(--z)*.06) 0 rgb(0 0 0 / .45))}
.emb::before,.emb::after{content:"";position:absolute;clip-path:polygon(50% 0,100% 24%,100% 70%,50% 100%,0 70%,0 24%)}
.emb::before{inset:0;background:linear-gradient(160deg,#fff 0%,var(--e1) 30%,var(--e2) 100%)}
.emb::after{inset:13%;background:radial-gradient(circle at 40% 25%,rgb(255 255 255 / .55),transparent 45%),linear-gradient(200deg,var(--e2),color-mix(in srgb,var(--e2) 55%,#000))}
.emb i{position:relative;z-index:1;font-style:normal;font-weight:800;color:var(--e1);font-size:calc(var(--z)*.26);letter-spacing:-.05em;line-height:1;text-shadow:0 1px 0 rgb(0 0 0 / .5)}
.emb.t-diamond,.emb.t-master{filter:drop-shadow(0 calc(var(--z)*.06) 0 rgb(0 0 0 / .45)) drop-shadow(0 0 calc(var(--z)*.25) var(--e1))}
.emb.t-master::before{background:conic-gradient(from 0deg,#ff5c9a,#ffc83a,#5cf0a2,#4fe3ff,#a77bff,#ff5c9a)}
.lvrow .emb{margin-right:2px}
.vsn span .emb{margin-right:2px;vertical-align:-3px}
.rankcard{display:flex;align-items:center;gap:18px;border-radius:24px;padding:18px 20px;background:radial-gradient(circle at 8% 50%,color-mix(in srgb,var(--e1) 30%,transparent),transparent 45%),linear-gradient(180deg,var(--panel2),var(--panel));box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--e1) 45%,var(--line))}
.rinfo{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.rname{font-family:var(--display);font-weight:400;font-size:28px;line-height:1.05;color:var(--e1)}
.rrate{font-size:14px;color:var(--muted);font-weight:800}
.rbar{display:block;height:10px;border-radius:5px;background:var(--rail);overflow:hidden;box-shadow:inset 0 0 0 1px var(--line);margin:4px 0}
.rbar i{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,var(--e2),var(--e1))}
.rdelta{display:flex;align-items:center;gap:14px;border-radius:18px;padding:10px 14px;background:linear-gradient(90deg,color-mix(in srgb,var(--e1) 18%,transparent),rgb(7 8 24 / .35));box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--e1) 50%,var(--line));animation:achin .55s cubic-bezier(.2,.9,.3,1.3) .9s both}
.rtx{flex:1;display:flex;flex-direction:column;min-width:0} .rtx b{font-size:17px}
.rd{font-family:var(--display);font-weight:400;font-size:28px}
.rd.up{color:var(--up)} .rd.down{color:var(--down)}
.rdelta.promo{box-shadow:inset 0 0 0 2px var(--e1),0 0 30px -6px var(--e1)}
.rdelta.promo .emb{animation:lvpop .8s cubic-bezier(.2,.9,.3,1.6) 1.4s both}
.promo-t{font-family:var(--display);font-size:15px;color:var(--e1);letter-spacing:.04em}
/* ---- VS screen ---- */
.overlay.vs{cursor:pointer;overflow:hidden;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:22px;background:#07081a}
.vsbg{position:absolute;inset:-20%;background:linear-gradient(105deg,#3a1d6e 0 49.6%,transparent 49.6% 50.4%,#0e3a5c 50.4%);animation:vsbg .5s cubic-bezier(.2,.8,.2,1) both}
.vsbg::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(105deg,rgb(255 255 255 / .05) 0 2px,transparent 2px 26px),radial-gradient(circle at 50% 50%,rgb(255 200 58 / .35),transparent 40%)}
@keyframes vsbg{from{transform:scale(1.4) rotate(-4deg);opacity:0}}
.vsmode{position:relative;font-family:var(--display);letter-spacing:.24em;font-size:clamp(13px,3.2vw,18px);color:var(--gold-t);padding:5px 18px;border-radius:999px;background:rgb(7 8 24 / .6);box-shadow:inset 0 0 0 1.5px var(--gold-deep);animation:slidein .5s ease both}
.vsrow{position:relative;width:min(900px,100%);display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:clamp(8px,3vw,28px)}
.vsside{display:flex;flex-direction:column;gap:10px}
.vsside.l{align-items:flex-end} .vsside.r{align-items:flex-start}
.vsp{display:flex;align-items:center;gap:10px;padding:8px 14px 8px 8px;border-radius:18px;background:linear-gradient(90deg,rgb(7 8 24 / .75),rgb(7 8 24 / .45));box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--s) 70%,transparent),0 10px 24px -12px #000;max-width:100%}
.vsp.l{flex-direction:row-reverse;padding:8px 8px 8px 14px;text-align:right;animation:vsl .55s cubic-bezier(.2,.9,.3,1.25) both}
.vsp.r{animation:vsr .55s cubic-bezier(.2,.9,.3,1.25) both}
@keyframes vsl{from{transform:translateX(-120vw)}} @keyframes vsr{from{transform:translateX(120vw)}}
.vsp .ava{width:46px;height:46px;font-size:19px;flex:0 0 auto}
.vsside.l .vsp:only-child .ava{width:72px;height:72px;font-size:30px}
.vsside.l .vsp:only-child .vsn b{font-size:clamp(18px,4.5vw,28px)}
.vsn{display:flex;flex-direction:column;min-width:0} .vsn b{font-family:var(--display);font-weight:400;font-size:clamp(14px,3.6vw,18px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vsn span{font-size:11px;color:var(--muted);font-weight:800}
.vsmark{font-family:var(--display);font-size:clamp(56px,15vw,120px);line-height:1;color:#fff;font-style:italic;text-shadow:0 0 0 transparent,-4px 0 0 var(--red),4px 0 0 var(--cyan),0 8px 0 var(--rail),0 0 60px rgb(255 200 58 / .8);animation:vsmark .6s cubic-bezier(.2,.9,.3,1.6) .45s both}
@keyframes vsmark{from{transform:scale(3.2) rotate(-14deg);opacity:0}}
.vsfoot{position:relative;font-weight:800;font-size:13px;color:var(--ink);padding:6px 14px;border-radius:12px;background:rgb(7 8 24 / .55);animation:slidein .5s ease .7s both}
.overlay.vs > .note{position:relative}
@media (max-width:560px){
  .vsrow{grid-template-columns:1fr;justify-items:center;gap:10px}
  .vsside.l,.vsside.r{align-items:center}

  .vsside.r .vsp{padding:6px 10px 6px 6px} .vsside.r .vsp .ava{width:36px;height:36px;font-size:15px}
  .vsmark{font-size:64px}
}
.rcard{display:block;width:100%;max-width:420px;margin:0 auto;border-radius:18px;box-shadow:0 0 0 1px var(--line),0 20px 40px -16px #000}
/* ---- cut-in ---- */
.cutin{position:fixed;inset:0;z-index:29;pointer-events:none;display:flex;align-items:center;justify-content:center;overflow:hidden}.cutin .band{flex:none}@media (max-width:480px){ body .cutin .band{flex-direction:column;align-items:center;gap:4px} }

.cutin.big b{color:#04220f} .cutin.big span{color:#0d4a2a}

@keyframes combo{50%{transform:translate(2px,-2px) scale(1.04)}}
.cutin.lead .band{background:linear-gradient(90deg,transparent,#a77bff 12%,#ffb3e6 50%,#a77bff 88%,transparent);box-shadow:0 0 0 4px var(--rail),0 0 70px rgb(167 123 255 / .8)}

@keyframes cutin{0%{transform:rotate(-8deg) translateX(110%)}18%{transform:rotate(-8deg) translateX(0)}78%{transform:rotate(-8deg) translateX(-3%);opacity:1}100%{transform:rotate(-8deg) translateX(-110%);opacity:0}}

.card.sk-washi .art .disc{background:radial-gradient(circle at 35% 30%,color-mix(in srgb,var(--c) 70%,#fff),var(--c));box-shadow:0 0 0 2px #c9a24a,0 4px 0 color-mix(in srgb,var(--c) 55%,#000)}
.card.sk-washi .art svg{color:#fff}
.card.sk-washi .ban{background:var(--c);color:#fff;font-family:var(--serif);font-weight:800;border-top:2px solid #c9a24a}
.card.sk-washi .wm{color:var(--c);opacity:.12}
.card.sk-washi .no{color:var(--paper-red)} .card.sk-washi .pt:not(.up):not(.down),.card.sk-washi .nx{color:#fff}
.back.sk-washi{background:radial-gradient(circle at 30% 30%,#e7c160 0 1.5px,transparent 2.5px),radial-gradient(circle at 70% 65%,#e7c160 0 2px,transparent 3px),linear-gradient(170deg,#fffaf0,var(--paper2));box-shadow:0 0 0 2px var(--rail),0 0 0 3.5px #c9a24a,0 6px 10px -4px #000}
.back.sk-washi::after{content:"麻";color:var(--paper-red);font-family:var(--serif);font-weight:800}
.card.sk-holo .holo{opacity:.85;animation:holo 3.2s linear infinite}
.card.sk-holo{box-shadow:0 0 0 2px var(--rail),0 0 0 4.5px #fff,0 0 18px rgb(79 227 255 / .6),0 16px 26px -12px #000}
.card.sk-holo .ban{background:linear-gradient(90deg,#ff5c9a,#ffc83a,#5cf0a2,#4fe3ff,#a77bff);color:#1a1033;text-shadow:0 1px 0 rgb(255 255 255 / .5)}
.back.sk-holo{background:linear-gradient(135deg,#ff5c9a,#ffc83a 30%,#5cf0a2 55%,#4fe3ff 75%,#a77bff);background-size:200% 200%;animation:holo 3.2s linear infinite;box-shadow:0 0 0 2px var(--rail),0 0 0 3.5px #fff,0 6px 10px -4px #000}
.back.sk-holo::after{color:#fff;text-shadow:0 2px 0 rgb(0 0 0 / .35)}
.card.pv{width:64px;border-radius:10px;pointer-events:none}
.card.pv .ban{font-size:11px;padding:2px 0 3px} .card.pv .wm{display:none} .card.pv .art .disc{width:66%}
.skins{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
.skin{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;padding:14px 8px 10px;border-radius:18px;border:0;background:rgb(7 8 24 / .4);box-shadow:inset 0 0 0 1px var(--line);text-align:center;transition:transform .15s ease,box-shadow .15s ease}
.skin b{font-size:13px} .skin .note{font-size:11px;line-height:1.35}
.skin .sprev{position:relative;display:grid;place-items:center;height:100px}
.skin:hover:not(.lock){transform:translateY(-3px)}
.skin.on{box-shadow:inset 0 0 0 2px var(--gold),0 0 24px -8px var(--gold);background:radial-gradient(circle at 50% 0%,rgb(255 200 58 / .18),transparent 70%),rgb(7 8 24 / .4)}
.skin.on::after{content:"使用中";position:absolute;top:6px;right:6px;font-size:11px;font-weight:800;border-radius:999px;padding:1px 7px;background:var(--gold);color:#2a1a00}
.skin.lock .card{filter:grayscale(1) brightness(.45)}
.skin.lock{cursor:not-allowed}
.skin .lk{position:absolute;inset:auto 0 50% 0;transform:translateY(50%);font-family:var(--display);font-size:13px;color:var(--ink);text-shadow:0 2px 0 var(--rail)}
.newskin{display:flex;align-items:center;gap:14px;border-radius:18px;padding:10px 14px;background:linear-gradient(90deg,rgb(255 200 58 / .16),transparent);box-shadow:inset 0 0 0 2px var(--gold);animation:achin .6s cubic-bezier(.2,.9,.3,1.3) 2.2s both}
.newskin > span:nth-child(2){flex:1;display:flex;flex-direction:column} .newskin b{font-size:16px}

.missions{background:radial-gradient(circle at 100% 0%,rgb(79 227 255 / .14),transparent 45%),linear-gradient(180deg,var(--panel2),var(--panel))}
.mlist,.mclear{display:flex;flex-direction:column;gap:8px}
.mis{display:flex;align-items:center;gap:12px;border-radius:16px;padding:10px 12px;background:rgb(7 8 24 / .45);box-shadow:inset 0 0 0 1px var(--line)}
.mic{flex:0 0 auto;width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-size:18px;font-weight:800;background:var(--panel2);color:var(--cyan-tx);box-shadow:0 3px 0 var(--rail)}

.mxp small{font-size:11px;color:var(--gold-t)}

.mis.ok .mbar i{background:linear-gradient(90deg,var(--cta),var(--up))}
.mis.ok .mxp{font-family:var(--display);font-weight:400;color:var(--up);letter-spacing:.04em}

.mbonus{display:flex;align-items:center;gap:10px;margin-top:4px;font-size:13px;color:var(--muted)}

/* 名前のことばから3つ。足りなければ、そのNEWSでいちばん上がる産業の部品で埋める */
function newsMotifs(name,row){
  const out=[];
  for(const [re,k] of MOTIF_KEYS){ if(out.length>=3) break; if(re.test(name) && !out.includes(k)) out.push(k); }
  if(row){ const ord=row.map((v,c)=>[v,c]).sort((a,b)=>b[0]-a[0]); for(const [,c] of ord){ if(out.length>=3) break; const k=IND_MOTIF[c]; if(!out.includes(k)) out.push(k); } }
  while(out.length<3) out.push(['coin','chart','globe'][out.length]);
  return out;
}
function newsArtAuto(name,row){
  const m=newsMotifs(String(name||''),row), arrow=m.findIndex(k=>/^arrow/.test(k));
  if(arrow>0){ const a=m.splice(arrow,1)[0]; m.push(a); }   /* 矢印はいつも右はし */
  const slot=[[4,22,1.35,'sc-bob'],[54,34,1.0,'sc-bob2'],[88,40,.88,m[2]&&/^arrow/.test(m[2])?'sc-rise':'sc-twinkle']];
  return `<svg class="nart" viewBox="0 0 120 80" aria-hidden="true"><path d="M0 72 H120" stroke="currentColor" stroke-width="1.5" opacity=".35"/>${m.map((k,i)=>{ const [x,y,s,a]=slot[i]; return `<g transform="translate(${x} ${y}) scale(${s})"><g class="${a}">${MOTIF[k]}</g></g>`; }).join('')}</svg>`;
}

function gain(cfg,b,k){
  let r;
  if(k===1) r=b+cfg.bonus;
  else if(cfg.collide==='minus') r = b>0 ? Math.max(0,b-(k-1)) : b;
  else if(cfg.collide==='split') r = b>0 ? Math.floor(b/k) : b;
  else r=b;
  if(k>1 && cfg.hitPen) r-=cfg.hitPen;          // 市況「規制強化」
  if(r<0 && cfg.negMul) r*=cfg.negMul;          // 市況「不況」
  if(cfg.ai){ if(cfg.ai.hit3 && k>=3) r+=cfg.ai.hit3; if(cfg.ai.low && k===1 && b<=2) r+=cfg.ai.low; if(cfg.ai.mono && k===1) r+=cfg.ai.mono; }   /* 投資家カードの読み（CPUとコーチの判断だけで使う。得点計算には入れない） */
  return r;
}

function buildDeck(cfg,rnd){

  if(cfg.my) return shuffle([...Array(cfg.table.length).keys()],rnd);   // マイNEWS：自分で作った4〜6枚
  if(cfg.hist) return shuffle(cfg.pool.slice(),rnd).slice(0,TURNS).sort((a,b)=>yearOf(a)-yearOf(b));

function shuffle(a,rnd){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(rnd()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function futureCost(T,hand,c,fut,left,known){
  if(left<=0 || !fut.length) return 0;
  const others=hand.filter(x=>x!==c); if(!others.length) return 0;
  let g=0;
  for(const u of fut){ let bo=-99; for(const x of others) bo=Math.max(bo,T[u][x]); g+=Math.max(0,T[u][c]-bo); }
  let cost=g/fut.length;
  if(!known) cost*=Math.min(1,left/fut.length);
  return cost;
}
function oppDist(T,o,news,pool,left){
  const d=[0,0,0,0,0,0], sc={}; let mx=-1e9, z=0;
  for(const x of o.hand){ const s=T[news][x]-futureCost(T,o.hand,x,pool,left,false); sc[x]=s; if(s>mx) mx=s; }
  for(const x of o.hand){ d[x]=Math.exp((sc[x]-mx)/0.9); z+=d[x]; }
  for(let i=0;i<6;i++) d[i]/=z;

function cardValues(cfg,p,players,deck,t,row,known,adj){

  const vals={};
  for(const c of p.hand){
    let dist=[1];
    for(const od of opp){ const q=od[c], nd=new Array(dist.length+1).fill(0); for(let k=0;k<dist.length;k++){ nd[k]+=dist[k]*(1-q); nd[k+1]+=dist[k]*q; } dist=nd; }
    const b0=(adj?adj(T[row][c],cfg):T[row][c])+(p.brand===c?1:0);
    let ev=0; for(let k=0;k<dist.length;k++) ev+=dist[k]*gain(cfg,b0,k+1);
    let carry=0;
    if(cfg.fore==='dividend' && left>0 && fut.length){ if(known) carry=divOf(cfg,T[deck[t+1]][c]); else { for(const u of pool) carry+=divOf(cfg,T[u][c]); carry/=pool.length; } }
    vals[c]=ev+carry-futureCost(T,p.hand,c,fut,left,known);
  }
  return vals;
}
const maxOf = o => Math.max(...Object.values(o));
function cpuForesight(cfg,p,players,deck,t,rnd){
  const left=TURNS-1-t;
  if(p.foreUsed || left<=0 || (p.type!=='read' && p.type!=='pro') || p.fore==='never') return;
  let use=false;
  if(p.fore==='early') use = t===0;
  else {
    if(cfg.fore==='futures'){
      // 先物は得になるときだけ使う（暴落が来るターンに使うと損をするため、使い切りの強制はしない）
      const a=cardValues(cfg,p,players,deck,t,deck[t],false), b=cardValues(cfg,p,players,deck,t,deck[t+1],true,futBase);
      use = maxOf(b)-maxOf(a) >= (t===TURNS-2 ? 0.3 : 1.2);
    } else use = t===TURNS-2 || (t===0 && rnd()<0.6);
  }
  if(use){ p.foreUsed=true; p.foreTurn=t; if(cfg.fore==='futures') p.fut=true; }
}
function cpuPick(p,players,deck,turn,cfg,rnd){
  const T=cfg.table, news=deck[turn];
  if(p.type==='random') return p.hand[Math.floor(rnd()*p.hand.length)];
  if(p.type==='naive'){ const mx=Math.max(...p.hand.map(c=>T[news][c])); const cs=p.hand.filter(c=>T[news][c]===mx); return cs[Math.floor(rnd()*cs.length)]; }
  cpuForesight(cfg,p,players,deck,turn,rnd);
  const known=p.foreUsed && p.foreTurn===turn;
  if(p.type==='pro') return proPick(p,players,deck,turn,cfg,rnd,known);
  const v=cardValues(cfg,p,players,deck,turn,rowFor(p,deck,turn),known,p.fut?futBase:null);
  let best=p.hand[0], bv=-1e9;
  for(const c of p.hand){ const x=v[c]+rnd()*0.5; if(x>bv){ bv=x; best=c; } }
  return best;
}
// 達人：相手それぞれの考え方をまねして「何を出しそうか」を見積もってから選ぶ。極秘契約も狙う
function proPick(p,players,deck,turn,cfg,rnd,known){
  const T=cfg.table, left=TURNS-1-turn, pool=unseen(cfg,deck,turn), fut=known?[deck[turn+1]]:pool;
  const opp=players.filter(o=>o!==p).map(o=>{
    if(o.type==='human' || o.type==='random') return oppDist(T,o,deck[turn],pool,left);
    const vals={}; if(o.type==='naive') o.hand.forEach(c=>vals[c]=T[deck[turn]][c]*3);
    else Object.assign(vals, cardValues(cfg,o,players,deck,turn,deck[turn],false,null));
    const d=[0,0,0,0,0,0]; const mx=Math.max(...o.hand.map(c=>vals[c])); let z=0;
    o.hand.forEach(c=>{ d[c]=Math.exp((vals[c]-mx)/0.3); z+=d[c]; });
    return d.map(x=>x/z);
  });
  const row=rowFor(p,deck,turn), ct=p.contract;
  let best=p.hand[0], bv=-1e9;
  for(const c of p.hand){
    let dist=[1];
    for(const od of opp){ const q=od[c], nd=new Array(dist.length+1).fill(0); for(let k=0;k<dist.length;k++){ nd[k]+=dist[k]*(1-q); nd[k+1]+=dist[k]*q; } dist=nd; }
    const b0=(p.fut?futBase(T[row][c],cfg):T[row][c])+(p.brand===c?1:0);
    let ev=0; for(let k=0;k<dist.length;k++) ev+=dist[k]*gain(cfg,b0,k+1);
    let x=ev-futureCost(T,p.hand,c,fut,left,known)+rnd()*0.1;
    if(ct && ct.id==='mono' && ct.x===c) x+=dist[0]*contractVal(ct)*.6;   // 独占できそうなら契約ぶんも上乗せ
    if(ct && ct.id==='clean' && ev<0) x-=1;
    if(x>bv){ bv=x; best=c; }
  }
  return best;
}
function ranking(players,cfg){
  const key=p=>cfg.tiebreak ? p.score*100+p.uniq : p.score*100;
  const s=players.map((p,i)=>({p,i,k:key(p)})).sort((a,b)=>b.k-a.k);
  let r=0, prev=null; s.forEach((x,j)=>{ if(x.k!==prev){ r=j+1; prev=x.k; } x.rank=r; });
  return s;
}

const BGM={on:false, timer:null, bar:0, next:0, master:null};

function bgmNote(f,t,d,type,v){
  const a=ac(); if(!a || !BGM.master) return;
  const o=a.createOscillator(), g=a.createGain();
  o.type=type; o.frequency.setValueAtTime(f,t);
  g.gain.setValueAtTime(0.0001,t); g.gain.linearRampToValueAtTime(v,t+.02); g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(g).connect(BGM.master); o.start(t); o.stop(t+d+.05);
}
const BGM_STYLES={
  classic:{bpm:104, bass:"triangle", lead:"sine", lv:.035, arp:[0,1,2,1,0,2,1,2], prog:BGM_PROG},
  hist:{bpm:84, bass:"sine", lead:"triangle", lv:.03, arp:[0,2,1,2,0,2,1,2], prog:[[220,261.63,329.63],[174.61,220,261.63],[261.63,329.63,392],[196,246.94,293.66]]},          // Am-F-C-G、ゆったり
  future:{bpm:122, bass:"sawtooth", lead:"square", lv:.014, arp:[0,1,2,1,2,1,0,1,2,1,0,2,1,2,1,2], prog:[[164.81,196,246.94],[130.81,164.81,196],[196,246.94,293.66],[146.83,185,220]]},   // Em-C-G-D、速めの電子音
  long:{bpm:96, bass:"triangle", lead:"sine", lv:.035, arp:[0,1,2,1,0,1,2,1], prog:[[146.83,174.61,220],[116.54,146.83,174.61],[174.61,220,261.63],[130.81,164.81,196]]}   // Dm-B♭-F-C、少しドラマチック
};
function bgmTick(){
  const a=ac(); if(!a || !BGM.on) return;
  if(document.hidden){ BGM.next=0; return; }
  const st=BGM_STYLES[document.body.dataset.theme]||BGM_STYLES.classic;   // モードごとに曲の雰囲気を変える
  const beat=60/st.bpm, barLen=beat*4;
  if(!BGM.next || BGM.next<a.currentTime) BGM.next=a.currentTime+.08;
  while(BGM.next < a.currentTime+1.2){            // 少し先まで予約しておく
    const ch=st.prog[BGM.bar%st.prog.length], t0=BGM.next;
    bgmNote(ch[0]/2,t0,barLen*.9,st.bass,.09);                       // ベース
    st.arp.forEach((k,i)=>bgmNote(ch[k]*(i%4===3?2:1),t0+i*beat*4/st.arp.length,beat*4/st.arp.length*.9,st.lead,st.lv));   // アルペジオ

function bgmStart(){
  const a=ac(); if(!a) return;

  const c=document.getElementById('fx'); if(!c) return; const x=c.getContext('2d');
  FX.run=true;
  const step=()=>{
    x.clearRect(0,0,innerWidth,innerHeight);

    for(const p of FX.p){ p.vy+=p.g; p.x+=p.vx; p.y+=p.vy; p.vx*=.99; p.r+=p.vr; p.life--;
      x.save(); x.translate(p.x,p.y); x.rotate(p.r); x.globalAlpha=Math.min(1,p.life/30); x.fillStyle=p.c;

/* ブランド：期の決算で、その期にいちばん独占した産業が自分のブランドになり、以後その産業は毎回+1 */
function brandOf(us, prev){

const CONTRACTS={

  clean:  {v:3, n:()=>'この期、マイナス点を1回も取らない'},
  mono3:  {v:4, n:()=>'この期に独占を3回以上する'},
  big:    {v:3, n:()=>'+4以上を2回取る'},
  fut:    {v:3, n:()=>'先物取引で+3以上を取る', fut:true},

function contractDone(c, us){
  if(!c) return false;
  switch(c.id){
    case 'mono':  return us.some(u=>u.ind===c.x && u.k===1);
    case 'clean': return us.length>0 && us.every(u=>u.total>=0);
    case 'mono3': return us.filter(u=>u.k===1).length>=3;
    case 'big':   return us.filter(u=>u.total>=4).length>=2;
    case 'fut':   return us.some(u=>u.fut && u.total>=3);
    case 'last':  { const u=us[us.length-1]; return !!u && u.k===1; }
  }
  return false;
}

const NET={avail:null, lobby:null, room:null, code:null, host:false, myPeer:null, peers:[], st:null, unsubs:[], hb:null, ver:0, fxKey:'', counting:false, pending:null, introUntil:0, cpus:2, name:(load('azakei-name')||''), joinCode:'', busy:false, msg:''};

const PEER_PREFIX='azakei-market-';

let QZ=null;
const QUIZ_REWARD_MAX=3;
function shuf(a){ return shuffle(a.slice(),Math.random); }
function makeQuiz(){
  const real=HIST.map((h,i)=>i).filter(i=>!HIST[i].f), all=HIST.map((h,i)=>i);
  const uniqTop=i=>{ const r=HIST[i].r, mx=Math.max(...r); return r.filter(v=>v===mx).length===1; };
  const qs=[], used=new Set();
  const gens=[
    ()=>{ const i=shuf(real).find(x=>!used.has('y'+x)); used.add('y'+i); const opts=shuf([i,...shuf(real.filter(x=>x!==i)).slice(0,3)]); return {q:`${HIST[i].y}年に起きたのは？`, opts:opts.map(x=>HIST[x].n), a:opts.indexOf(i), exp:HIST[i].d}; },
    ()=>{ const i=shuf(all).find(x=>!used.has('n'+x)); used.add('n'+i); const ys=shuf([HIST[i].y,...shuf(all.filter(x=>x!==i)).slice(0,3).map(x=>HIST[x].y)]); return {q:`「${HIST[i].n}」は何年？${HIST[i].f?'（未来編）':''}`, opts:ys.map(String), a:ys.indexOf(HIST[i].y), exp:HIST[i].d}; },
    ()=>{ const i=shuf(all.filter(uniqTop)).find(x=>!used.has('t'+x)); used.add('t'+i); const r=HIST[i].r, top=r.indexOf(Math.max(...r)); const opts=shuf([top,...shuf([0,1,2,3,4,5].filter(x=>x!==top)).slice(0,3)]); return {q:`「${HIST[i].n}」でいちばん点が高い産業は？`, opts:opts.map(x=>IND[x]), a:opts.indexOf(top), exp:`${IND.map((d,k)=>d+' '+sgn(r[k])).join(' / ')}`}; },
    ()=>{ const n=Math.floor(Math.random()*6), r=T2[n], mx=Math.max(...r), tops=r.map((v,k)=>v===mx?k:-1).filter(k=>k>=0), top=tops[0], wrong=shuf([0,1,2,3,4,5].filter(x=>!tops.includes(x))).slice(0,3), opts=shuf([top,...wrong]); return {q:`クラシックの「${NEWS[n]}」で${tops.length>1?'+3がつく産業のひとつ':'いちばん点が高い産業'}は？`, opts:opts.map(x=>IND[x]), a:opts.indexOf(top), exp:`${IND.map((d,k)=>d+' '+sgn(r[k])).join(' / ')}`}; }
  ];
  const order=shuf([0,1,2,3,0,1,2,2]).slice(0,5);
  order.forEach(g=>{ try{ qs.push(gens[g]()); }catch(e){ qs.push(gens[0]()); } });
  return {qs, i:0, score:0, picked:null, done:false};
}
function quizLeft(){ const P=S.prof, k=todayKey(); return P.quiz&&P.quiz.day===k ? Math.max(0,QUIZ_REWARD_MAX-P.quiz.n) : QUIZ_REWARD_MAX; }
function startQuiz(){ QZ=makeQuiz(); openSheet('quiz'); sfx('open'); }
function quizPick(k){
  if(!QZ || QZ.picked!==null) return;
  const q=QZ.qs[QZ.i]; QZ.picked=k;

}

  QZ.done=true;
  const P=S.prof, k=todayKey(); P.quiz = P.quiz&&P.quiz.day===k ? P.quiz : {day:k,n:0};
  QZ.reward=null;
  if(P.quiz.n<QUIZ_REWARD_MAX){ const c=QZ.score*6+(QZ.score===5?10:0), x=QZ.score*5; P.quiz.n++; P.coin=(P.coin||0)+c; P.xp+=x; QZ.reward={c,x}; }

const XF_PREFIX='AZK1:';
function xferKeys(){ const out={}; for(let i=0;i<localStorage.length;i++){ const k=localStorage.key(i); if(k && k.startsWith('azakei-')) out[k]=localStorage.getItem(k); } return out; }
const b64u = bytes => { let s=''; bytes.forEach(b=>s+=String.fromCharCode(b)); return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''); };
const ub64u = str => { const s=atob(str.replace(/-/g,'+').replace(/_/g,'/')); return Uint8Array.from(s, c=>c.charCodeAt(0)); };
async function gz(data, dir){ const cs=dir==='c'?new CompressionStream('gzip'):new DecompressionStream('gzip'); return new Uint8Array(await new Response(new Blob([data]).stream().pipeThrough(cs)).arrayBuffer()); }
async function xferMake(){
  saveProfile(); const json=JSON.stringify({v:1, t:Date.now(), d:xferKeys()}), raw=new TextEncoder().encode(json);
  let code; try{ code=XF_PREFIX+'z'+b64u(await gz(raw,'c')); }catch(e){ code=XF_PREFIX+'p'+b64u(raw); }   // 圧縮できないブラウザはそのまま
  return code;
}
async function xferRead(code){

function recordBests(p, me, won){

const FURI_MAP=Object.fromEntries(FURI), FURI_RE=new RegExp(FURI.map(x=>x[0]).join('|'),'g');
let FURI_OBS=null;
function furiApply(root){
  if(!S.furi || !root) return;
  if(root.nodeType===3) root=root.parentElement; if(!root || !root.closest) return;
  if(root.closest('ruby,script,style,textarea,input,svg,canvas,title,[data-nofuri]')) return;
  const w=document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {acceptNode:n=>{ const p=n.parentElement; if(!p || p.closest('ruby,script,style,textarea,input,svg,canvas,title,[data-nofuri]')) return NodeFilter.FILTER_REJECT; FURI_RE.lastIndex=0; return FURI_RE.test(n.nodeValue)?NodeFilter.FILTER_ACCEPT:NodeFilter.FILTER_SKIP; }});
  const nodes=[]; while(w.nextNode()) nodes.push(w.currentNode);
  nodes.forEach(n=>{ const t=n.nodeValue, frag=document.createDocumentFragment(); let last=0, m; FURI_RE.lastIndex=0;
    while((m=FURI_RE.exec(t))){ if(m.index>last) frag.appendChild(document.createTextNode(t.slice(last,m.index)));
      const r=document.createElement('ruby'); r.appendChild(document.createTextNode(m[0])); const rt=document.createElement('rt'); rt.textContent=FURI_MAP[m[0]]; r.appendChild(rt); frag.appendChild(r); last=m.index+m[0].length; }
    if(last<t.length) frag.appendChild(document.createTextNode(t.slice(last)));
    if(n.parentNode) n.parentNode.replaceChild(frag,n); });
}
function furiArm(){       /* 描き直されたところだけ、表示の前（マイクロタスク）にルビをふる */

  if(!S.furi || typeof MutationObserver==='undefined') return;
  const opts={childList:true, subtree:true};
  FURI_OBS=new MutationObserver(ms=>{ FURI_OBS.disconnect(); ms.forEach(m=>m.addedNodes.forEach(n=>furiApply(n))); FURI_OBS.observe(document.body,opts); });
  furiApply(document.body); FURI_OBS.observe(document.body,opts);
}

const bondHearts = (lv, sz) => `<span class="nk-hearts${sz?' '+sz:''}" role="img" aria-label="なかよし度 Lv${lv}">${[1,2,3,4,5].map(i=>`<i class="${i<=lv?'on':''}">♥</i>`).join('')}</span>`;
function bondBox(k){
  const r=(S.prof.riv||{})[k], g=r?r.w+r.l+r.d:0, lv=bondLv(r), eps=BOND_EP[k]||[], c=CHARS[k];
  const next=BOND_AT[lv]; const left=next!=null?next-g:0;
  return `<section class="nk-box" style="--rc:${c.c}"><div class="row spread"><span class="label">なかよし度</span>${bondHearts(lv)}</div>
    <p class="note">${lv>=5?'なかよし度 MAX！ ぜんぶのエピソードを読んだよ。':`あと${left}回いっしょに遊ぶと、次のエピソードが読めるよ。`}</p>

}
function bondUpPanel(){
  const u=G&&G.bondUps; if(!u||!u.length) return '';
  return `<section class="panel nk-up"><span class="label">💗 なかよし度アップ！</span>${u.map(({k,lv})=>{ const c=CHARS[k];
    return `<button class="nk-row" style="--rc:${c.c}" onclick="openSheet('char:${k}')"><span class="rva">${chIc(c)}</span><span class="nk-rt"><b>${k}と Lv${lv} ${bondHearts(lv,'sm')}</b><span class="nk-say">「${(BOND_EP[k]||[])[lv-1]||''}」</span></span><span class="nk-go">›</span></button>`; }).join('')}
    <p class="note">タップすると、キャラのエピソードをまとめて読めるよ。</p></section>`;
}

function lessonStart(i){ LSN={i, p:0, pick:null, ord:shuffle([0,1,2],Math.random)}; sfx('click'); openSheet('lesson'); }
function lessonGo(d){ if(!LSN) return; LSN.p=Math.max(0,LSN.p+d); sfx('click'); renderSheet(); }
function lessonPick(k){
  if(!LSN || LSN.pick!=null) return; const L=LESSONS[LSN.i]; LSN.pick=k; const ok=k===L.q.a;
  if(ok){ sfx('coin'); haptic(20); const P=S.prof; P.lsn=P.lsn||{}; if(!P.lsn[L.id]){ P.lsn[L.id]=Date.now(); P.coin=(P.coin||0)+LSN_COIN; LSN.got=LSN_COIN; saveProfile(); } achCheck(); }
  else { sfx('buzz'); haptic(30); }
  renderSheet();
}

  if(!LSN) return lessonsBody();

/* ---- CPUの考え：結果のあと、CPUがなぜそのカードを出したかを、キャラのふきだしで説明する ---- */
function cpuWhy(){
  if(!G || !G.last || G.demo) return '';
  const C=G.cfg, row=C.table[G.deck[G.turn]], nextRow=G.deck[G.turn+1]!=null?C.table[G.deck[G.turn+1]]:null;
  const cpus=G.players.map((p,i)=>({p,i})).filter(x=>!isHuman(x.p) && G.last[x.i]);
  if(!cpus.length) return '';
  const items=cpus.map(({p,i})=>{
    const r=G.last[i], c=r.ind, hand=p.hand.concat([c]), val=k=>row[k];
    const best=hand.slice().sort((a,b)=>val(b)-val(a))[0];
    let t;
    if(r.fut && nextRow) t=`先物取引で次のNEWSを先に見て、「${IND[c]}」にかけた`;
    else if(val(c)<0) t=`マイナスの「${IND[c]}」を、今のうちに使っておく作戦`;
    else if(val(c)>=val(best)){ const ties=hand.filter(k=>val(k)===val(c)).length; t = ties>1 ? `${sgn(val(c))}のカードが${ties}枚。そのうち${p.type==='naive'?'':'、ほかの人と被らなそうだと読んで'}「${IND[c]}」を選んだ` : `手札でいちばん点が高い「${IND[c]}」（${sgn(val(c))}）を選んだ`; }
    else t=`「${IND[best]}」はみんなが出しそうだから、あえて「${IND[c]}」（${sgn(val(c))}）でひとりじめをねらった`;
    const res = r.k===1 ? `<em class="cw-ok">→ 独占成功 ${sgn(r.total)}</em>` : `<em class="cw-ng">→ ${r.k}人で被り ${sgn(r.total)}</em>`;
    const ch=CHARS[charKey(p)];
    return `<div class="cw-row"><span class="ava" style="--s:${ch?ch.c:`var(--s${p.seat%6})`}">${avHTML(p)}</span><span class="cw-bub"><b>${esc(String(p.name).replace(/^CPU\s*/,''))}</b>${t} ${res}</span></div>`;
  }).join('');
  const open = S.cwOpen!=null ? S.cwOpen : stepsOn();
  return `<details class="cw-box"${open?' open':''} ontoggle="S.cwOpen=this.open"><summary>🧠 CPUはなぜそれを出した？</summary><div class="cw-list">${items}</div></details>`;
}

/* ---- 今週のパズル：CPU3人の出すカードは公開。4ターンの自分の出し方を決めて、最高点をねらう。毎週かわる ---- */
const PUZ_COIN=50, PUZ_CPUS=['ミナト','アオイ','ソラ'];
let PZ=null;
function puzMake(wk){
  const C=presetCfg('rec');
  let fb=null;
  for(let v=0; v<40; v++){
    const rnd=mulberry(wk*97+v*13+5), deck=shuffle([0,1,2,3,4,5],rnd).slice(0,4);
    const pri=PUZ_CPUS.map(()=>shuffle([0,1,2,3,4,5],rnd));
    const hands=PUZ_CPUS.map(()=>[0,1,2,3,4,5]), plays=deck.map(()=>[]);
    deck.forEach((n,t)=>{ const row=C.table[n]; PUZ_CPUS.forEach((_,j)=>{ const h=hands[j]; const best=h.slice().sort((a,b)=>row[b]-row[a] || pri[j].indexOf(a)-pri[j].indexOf(b))[0]; plays[t].push(best); hands[j]=h.filter(x=>x!==best); }); });
    const score=seq=>seq.reduce((sum,c,t)=>{ const k=1+plays[t].filter(x=>x===c).length; return sum+gain(C,C.table[deck[t]][c],k); },0);
    let best=-99, bestSeq=null; const rec=(seq,used)=>{ if(seq.length===4){ const sc=score(seq); if(sc>best){ best=sc; bestSeq=seq.slice(); } return; } for(let c=0;c<6;c++) if(!used.includes(c)){ seq.push(c); rec(seq,used.concat([c])); seq.pop(); } }; rec([],[]);
    const gh=[0,1,2,3,4,5], greedy=deck.map((n,t)=>{ const row=C.table[n]; const c=gh.slice().sort((a,b)=>row[b]-row[a])[0]; gh.splice(gh.indexOf(c),1); return c; });
    const z={wk, C, deck, plays, best, bestSeq, greedy:score(greedy), score};
    if(best-z.greedy>=2) return z;   /* 「いつも一番高いカード」では★3に届かない週を選ぶ */
    if(!fb && best>z.greedy) fb=z; if(v===39) return fb||z;
  }
}

const MN_PREFIX='AZN1';

function mnClean(list){   /* 受け取ったデータをチェックして、正しい形だけ残す */

  const out=list.slice(0,MYN_MAX).map(x=>{ if(!x||typeof x.n!=='string'||!Array.isArray(x.v)||x.v.length!==6) return null;

}

  if(whoS.length===1 && bestMin>0) add('🛡️','安定感No.1',whoS,`いちばん低いターンでも ${sgn(bestMin)}`,'#3fe08f');
  const hits=P.map(p=>p.used.filter(u=>u.k>1).length), mh=Math.min(...hits), whoM=P.filter((p,i)=>hits[i]===mh);
  if(whoM.length===1) add('🎯','読み合い名人',whoM,mh===0?'一度も被らなかった':`被ったのは ${mh}回だけ`,'#a77bff');
  const rk=ranking(P,G.cfg), w=rk.filter(x=>x.rank===1);

    for(let t=1;t<N-1;t++){ const s=P.map(p=>p.hist[t]); if(s[wi]===Math.min(...s) && s.some(v=>v>s[wi])) wasLast=true; }

function fbRate(f){

  const me=myIndex(), rk=me>=0?ranking(G.players,G.cfg).find(x=>x.i===me):null;
  P.fb.push({t:Date.now(), m:modeName(G.cfg), n:G.players.length, h:G.players.filter(isHuman).length, b4:!!G.b4, pw:!!G.pw, on:!!G.online, r:rk?rk.rank:0, f, tags:[], say:''});

}
function fbTag(t){ const r=G&&G.fbIdx!=null&&(S.prof.fb||[])[G.fbIdx]; if(!r) return; const i=r.tags.indexOf(t); if(i>=0) r.tags.splice(i,1); else r.tags.push(t); saveProfile(); sfx('click'); render(); }
function fbSay(v){ const r=G&&G.fbIdx!=null&&(S.prof.fb||[])[G.fbIdx]; if(!r) return; r.say=String(v).replace(/[<>&"'`]/g,'').slice(0,60); saveProfile(); toast('ひとことを記録しました'); }
function fbStats(){
  const L=S.prof.fb||[], n=L.length, avg=a=>a.length?Math.round(a.reduce((s,x)=>s+x.f,0)/a.length*10)/10:null;
  const tag={}; FB_TAGS.forEach(t=>tag[t]=L.filter(x=>x.tags.includes(t)).length);
  const dist=[1,2,3,4,5].map(v=>L.filter(x=>x.f===v).length);
  const grp=(name,fn)=>{ const a=L.filter(fn); return {name, n:a.length, avg:avg(a)}; };
  return {n, avg:avg(L), dist, tag, again:n?Math.round(tag['もう1回やりたい']/n*100):0,
    groups:[grp('β4ルール',x=>x.b4),grp('β3ルール',x=>!x.b4),grp('投資家カードあり',x=>x.pw),grp('人どうし（2人以上）',x=>x.h>=2||x.on),grp('CPUと1人',x=>x.h<2&&!x.on)].filter(g=>g.n),
    says:L.filter(x=>x.say).slice(-8).reverse()};
}

  const n=(S.prof.fb||[]).length; if(!n) return '';

}

function fbCopy(){

function setYomi(on){ S.yomi=!!on; save('azakei-yomi',S.yomi); sfx('click'); render(); if(on) toast('🔮 人気予想：カードを出すとき、いちばん人気の産業も予想しよう（当たれば +1）'); }
function yomiRow(p){
  if(!G || !G.yomi || G.phase!=='choose' || G.active<0) return '';
  return `<div class="ymr"><span class="ymr-l">🔮 いちばん人気は？<small>当たれば +1</small></span><div class="ymr-c">${IND.map((n,c)=>`<button class="${p.guess===c?'on':''}" style="--c:var(--i${c})" onclick="yomiPick(${c})" aria-label="${n}が人気と予想">${svg(c,2.4)}</button>`).join('')}</div></div>`;
}
function yomiPick(c){ if(!G||G.phase!=='choose'||G.active<0) return; const p=G.players[G.active]; p.guess = p.guess===c ? null : c; sfx('click'); haptic(6); render(); }
function yomiCpu(cnt){
  if(!G.yomi) return;
  const T=G.cfg.table, t=G.turn, news=G.deck[t], pool=unseen(G.cfg,G.deck,t), left=TURNS-1-t;
  G.players.forEach((p,i)=>{
    if(isHuman(p) || p.guess!=null) return;
    if(p.type==='naive' || p.type==='random'){ const r=T[news]; p.guess=[0,1,2,3,4,5].reduce((a,c)=>r[c]>r[a]?c:a,0); return; }
    const exp=[0,0,0,0,0,0]; exp[p.pick]+=1;
    G.players.forEach((q,j)=>{ if(j===i) return; const d=oppDist(T,q,news,pool,left); for(let c=0;c<6;c++) exp[c]+=d[c]; });
    p.guess=exp.indexOf(Math.max(...exp));
  });
}
function yomiFx(){
  if(!G || !G.yomi || !G.last || reduced()) return;
  G.last.forEach((r,i)=>{ if(!r.yomi) return;

      const b=document.createElement('span'); b.className='pwpop'; b.style.setProperty('--pc','#a77bff'); b.style.top='34px';
      b.innerHTML='<i>🔮</i>読み的中！ +1'; el.appendChild(b); setTimeout(()=>b.remove(),2400);
      if(i===myIndex()){ sfx('coin'); haptic(12); } }, 2100+i*160); });
}

  ['冬のボーナス','ボーナスで投資と買い物が活発に','FR',{}],
  ['年末の帰省ラッシュ','新幹線と飛行機が満席に','TE',{}],
  ['年末の配送ピーク','お歳暮とネット通販で、工場と物流がフル稼働','MT',{R:1}],
  ['紅白と年末特番','大みそかのテレビとネット配信が最高視聴率','DM',{}],
  ['寒波と灯油の値上がり','暖房の需要が増え、燃料の価格が上がる','EF',{T:-1}]]]
];
/* ---- 今月のNEWS：12か月ぶんのパック。どのNEWSも +3 が2つ、どの産業も +3 が2回（基本の6枚と同じ決まり）。毎月1日に自動で入れかわる ---- */
const MONTH_PACKS = MONTH_SRC.map(([mon,theme,rows])=>{ const K={E:0,F:1,M:2,R:3,T:4,D:5};
  return {mon, theme, names:rows.map(r=>r[0]), descs:rows.map(r=>r[1]), table:rows.map(([n,d,hi,oth])=>{ const r=[0,0,0,0,0,0]; for(const ch of hi) r[K[ch]]=3; for(const [k,v] of Object.entries(oth)) r[K[k]]=v; return r; })}; });
const monthPack = (d=new Date()) => MONTH_PACKS[d.getMonth()];
/* ---- 進行役モード（教室・体験会・大人数）：アプリがNEWSの発表・相談タイマー・得点計算をする。プレイヤーは紙のカードや手で答え、
   進行役が各チームの産業を入力する。最大10チーム。チームで相談するので、会話がいちばん生まれる遊び方 ---- */
let GM=null, GM_T=null;
const GM_SEAT=['#e2463a','#2f6fe0','#18a06a','#d4318a','#d99a00','#7a4fe0'];   /* 体験版カードの A〜F の色 */
const GM_ANI=['🦊','🐼','🐸','🐙','🦁','🐧','🐳','🦉','🐯','🐨'];
const GM_COL=['#ff7a3d','#4fa0ff','#3fd0a0','#ff5c9a','#ffc83a','#a77bff','#20c6d1','#c9a46b','#8bd450','#ff8fa6'];
function gmOpen(u){ if(G && !G.online && G.phase==='final') G=null; if(G){ toast('試合が終わってから開いてね'); return; } clearInterval(GM_T); const pl=u==='player'; GM={phase:'setup', unit:pl?'player':'team', n:4, mode:'classic', b4:true, talk:pl?0:60, names:(S.prof[pl?'gmP':'gmN']||[]).slice(0,10)}; S.screen='gm'; render(); scrollTo(0,0); }
const gu = () => GM && GM.unit==='player' ? 'プレイヤー' : 'チーム';
const gn = () => GM && GM.unit==='player' ? '人' : 'チーム';
function gmUnit(u){ if(GM.unit===u) return; const n=GM.n; gmOpen(u); GM.n=u==='player'?Math.min(6,n):n; render(); }
function tableFromUrl(){ try{ if(!new URLSearchParams(location.search).get('table')) return; history.replaceState(null,'',location.pathname); setTimeout(()=>{ gmOpen('player'); toast('テーブルモード：紙のカードで遊ぶ相棒です'); },400); }catch(e){} }
function gmSet(k,v){ GM[k]=v; sfx('click'); render(); }
function gmStart(){
  const cfg=cfgFor(GM.mode==='month'?'month':'classic'); TURNS=4;
  GM.cfg=cfg; GM.deck=buildDeck(cfg,Math.random); GM.turn=0; GM.osp=null;
  GM.teams=Array.from({length:GM.n},(_,i)=>({name:mnSafe(GM.names[i]||'').trim().slice(0,10)||`${gu()}${i+1}`, a:GM.unit==='player'?'ABCDEF'[i]:GM_ANI[i], c:GM.unit==='player'?GM_SEAT[i]:GM_COL[i], hand:[0,1,2,3,4,5], score:0, uniq:0, pick:null, hist:[0]}));
  GM.log=[]; S.prof[GM.unit==='player'?'gmP':'gmN']=(GM.names||[]).map(x=>mnSafe(x).slice(0,10)); saveProfile();
  sfx('select'); gmNews();
}
const gmNm = n => GM.cfg.names[n];
const gmDesc = n => GM.cfg.my ? (GM.cfg.descs&&GM.cfg.descs[n]||'') : (WHY[n]?WHY[n].s:'');
const gmFinal = () => GM.turn===TURNS-1;
function gmNews(){
  GM.teams.forEach(t=>t.pick=null);
  GM.hidden = GM.b4 && gmFinal() ? GM.deck.slice(GM.turn) : null;   /* 大引けサプライズ：最後は伏せたまま */
  GM.phase='news'; sfx('open'); try{ if(!GM.hidden) newsFxSfx(GM.deck[GM.turn]); }catch(e){} render(); scrollTo(0,0);
}
function gmTalk(){ GM.phase='talk'; GM.end=Date.now()+GM.talk*1000; clearInterval(GM_T); GM_T=setInterval(gmTick,250); sfx('click'); render(); }
function gmTick(){
  if(!GM || GM.phase!=='talk'){ clearInterval(GM_T); return; }
  const left=Math.max(0,Math.ceil((GM.end-Date.now())/1000)), el=document.getElementById('gm-t'), ring=document.getElementById('gm-ring');
  if(el) el.textContent=left; if(ring) ring.style.setProperty('--p', (left/GM.talk*100)+'%');
  if(left<=5 && left>0 && GM.lastBeep!==left){ GM.lastBeep=left; sfx('tick'); }
  if(left===0){ clearInterval(GM_T); sfx('slam'); gmInput(); }
}
function gmInput(){ clearInterval(GM_T); GM.phase='input'; render(); }
function gmPick(i,c){ const t=GM.teams[i]; if(!t || !t.hand.includes(c)) return; t.pick = t.pick===c ? null : c; sfx('click'); render(); }
function gmOpenUp(){
  if(GM.teams.some(t=>t.pick==null)) return;
  if(GM.hidden){ GM.phase='announce'; sfx('slam'); haptic(40); render(); return; }
  gmResolve();
}
function gmResolve(){
  const C=GM.cfg, n=GM.deck[GM.turn], cnt=[0,0,0,0,0,0]; GM.teams.forEach(t=>cnt[t.pick]++);
  const x2 = GM.b4 && gmFinal() ? 2 : 1;
  GM.last=GM.teams.map(t=>{ const b=C.table[n][t.pick], k=cnt[t.pick], v=gain(C,b,k)*x2; t.score+=v; if(k===1) t.uniq++; t.hand=t.hand.filter(c=>c!==t.pick); t.hist.push(t.score); return {c:t.pick,k,v}; });
  GM.log.push({n, x2, res:GM.last.slice(), cnt:cnt.slice()});
  GM.cnt=cnt; GM.phase='reveal'; sfx('open'); setTimeout(()=>{ if(GM&&GM.phase==='reveal'){ sfx(cnt.some(k=>k===1)?'coin':'buzz'); } },500); render(); scrollTo(0,0);
}
function gmNext(){ if(gmFinal()){ GM.phase='final'; sfx('fanfare'); setTimeout(()=>{ try{ confetti(); }catch(e){} },200); render(); scrollTo(0,0); return; } GM.turn++; gmNews(); }
function gmQuit(){ clearInterval(GM_T); GM=null; go('home'); }
function gmRank(){ const s=GM.teams.map((t,i)=>({t,i})).sort((a,b)=>b.t.score-a.t.score||b.t.uniq-a.t.uniq); s.forEach((x,j)=>{ x.r = j && s[j-1].t.score===x.t.score && s[j-1].t.uniq===x.t.uniq ? s[j-1].r : j+1; }); return s; }
function gmPayout(n){ const r=GM.cfg.table[n], mx=Math.max(...r); return `<div class="gm-pay">${IND.map((d,c)=>`<div class="${r[c]===mx?'top':''}${r[c]<0?' neg':''}" style="--c:var(--i${c})"><span class="ic">${svg(c,2.2)}</span><b>${sgn(r[c])}</b><small>${d}</small></div>`).join('')}</div>`; }
function gmBoard(){
  const rv=GM.phase==='reveal', prev=rv?gmRankAt(GM.turn):null;
  return `<div class="gm-score">${gmRank().map(({t,i,r},j)=>{ const mv=rv?prev[i]-r:0, g=rv?GM.last[i].v:null;
    return `<div style="--tc:${t.c};--d:${rv?900+j*70:0}ms" class="${rv?'gm-rise':''}"><span class="gm-rk">${r}</span><span class="gm-ani">${t.a}</span><b>${esc(t.name)}</b>${mv>0?`<span class="gm-mv up">▲${mv}</span>`:mv<0?`<span class="gm-mv dn">▼${-mv}</span>`:''}${g!=null?`<span class="gm-gain ${g>0?'p':g<0?'n':''}">${sgn(g)}</span>`:''}<span class="gm-pt">${t.score}<small>pt</small></span></div>`; }).join('')}</div>`; }
/* k ターン目が終わった時点の順位（hist[k]で比べる） */
function gmRankAt(k){ const v=GM.teams.map(t=>t.hist[Math.min(k,t.hist.length-1)]); return v.map(x=>1+v.filter(y=>y>x).length); }
/* のこりの手札：全チームに公開。「あのチームはもう金融を出せない」と読めるのが相談のタネ */
function gmHands(){ return `<section class="panel gm-hand"><div class="row spread"><h3>🃏 のこりの手札</h3><span class="note">使った産業はもう出せない</span></div>
  ${GM.teams.map(t=>`<div class="gm-hrow" style="--tc:${t.c}"><span class="gm-ani">${t.a}</span><b>${esc(t.name)}</b><div>${IND.map((d,c)=>`<i class="${t.hand.includes(c)?'':'used'}" style="--c:var(--i${c})" title="${d}">${svg(c,2.2)}</i>`).join('')}</div></div>`).join('')}</section>`; }
const GM_HINT=['+3 の産業はどこ？ でも、みんなもそう思っているかも…','ほかの人の「のこりの手札」を見てみよう','あえて +1 で独占をねらう手もある','1位の人は、どこに出しそう？','この産業は、なぜ上がる（下がる）んだろう？','最後のために、強いカードを残しておく？'];
function gmFull(){ try{ const d=document; if(d.fullscreenElement){ d.exitFullscreen(); return; } const p=d.documentElement.requestFullscreen&&d.documentElement.requestFullscreen(); if(p&&p.catch) p.catch(()=>toast('この画面では全画面にできません')); }catch(e){ toast('この画面では全画面にできません'); } }
/* 試合のまとめ：名場面・グラフ・ふりかえりの問い・コピー用テキスト */
function gmMoments(){
  const out=[], T=GM.teams; let best=null;
  GM.log.forEach((L,k)=>L.res.forEach((r,i)=>{ if(!best||r.v>best.v) best={v:r.v,i,k}; }));
  if(best&&best.v>0) out.push(['💥','いちばんの大当たり',`${T[best.i].a} ${esc(T[best.i].name)}：T${best.k+1}「${esc(gmNm(GM.log[best.k].n))}」で ${sgn(best.v)}`]);
  const mu=Math.max(...T.map(t=>t.uniq)); if(mu>0) out.push(['👑','独占王',`${T.filter(t=>t.uniq===mu).map(t=>t.a+' '+esc(t.name)).join('・')}（${mu}回）`]);
  const L=GM.log.length, pr=gmRankAt(L-1), fr=gmRankAt(L), cb=T.map((t,i)=>({t,d:pr[i]-fr[i]})).sort((a,b)=>b.d-a.d)[0];
  if(L>1&&cb&&cb.d>0) out.push(['🔥','最終ターンの大逆転',`${cb.t.a} ${esc(cb.t.name)}が ${pr[T.indexOf(cb.t)]}位 → ${fr[T.indexOf(cb.t)]}位`]);
  let crowd=null; GM.log.forEach((L2,k)=>L2.cnt.forEach((c,ind)=>{ if(!crowd||c>crowd.c) crowd={c,ind,k}; }));
  if(crowd&&crowd.c>=3) out.push(['🧲','いちばんの大渋滞',`T${crowd.k+1}の${IND[crowd.ind]}に ${crowd.c}${gn()}が集中`]);
  return out;
}
function gmChart(){
  const W=560,H=200,L=30,R=12,Tp=12,B=24, T=GM.teams, all=T.flatMap(t=>t.hist), lo=Math.min(0,...all), hi=Math.max(1,...all), N=GM.log.length;
  const x=k=>L+k*(W-L-R)/Math.max(1,N), y=v=>Tp+(hi-v)*(H-Tp-B)/(hi-lo||1);
  const ax=Array.from({length:N+1},(_,k)=>`<text x="${x(k)}" y="${H-6}" text-anchor="middle">${k?'T'+k:'開始'}</text>`).join('')+`<line x1="${L}" x2="${W-R}" y1="${y(0)}" y2="${y(0)}" stroke="var(--line)"/>`;
  return `<svg class="gm-chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${gu()}ごとの点数の推移">${ax}${T.map(t=>`<polyline points="${t.hist.map((v,k)=>`${x(k)},${y(v)}`).join(' ')}" fill="none" stroke="${t.c}" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>${t.hist.map((v,k)=>`<circle cx="${x(k)}" cy="${y(v)}" r="4.5" fill="${t.c}" stroke="var(--panel)" stroke-width="2"><title>${esc(t.name)} ${k?'T'+k:'開始'}: ${v}pt</title></circle>`).join('')}`).join('')}</svg>`;
}
function gmQs(){ return GM.log.map((L,k)=>{ const r=GM.cfg.table[L.n], mx=Math.max(...r), up=IND.filter((d,c)=>r[c]===mx), dn=IND.filter((d,c)=>r[c]<0);
  return `<details class="gm-q"><summary><b>Q${k+1}.</b> 「${esc(gmNm(L.n))}」で、なぜ<b>${up.join('と')}</b>が上がる？${dn.length?`（${dn.join('・')}は下がる）`:''}</summary><p>${esc(gmDesc(L.n))||'みんなで理由を話し合ってみよう。'}</p></details>`; }).join(''); }
function gmCopy(){
  const R=gmRank(), lines=[`AZAKEI MARKET ${GM.unit==='player'?'テーブルモード':'進行役モード'}（${GM.teams.length}${gn()}・${GM.mode==='month'?'今月のNEWS':'クラシック'}）`, 'NEWS：'+GM.log.map(L=>gmNm(L.n)).join(' → '), ...R.map(({t,r})=>`${r}位 ${t.a}${t.name} ${t.score}pt（独占${t.uniq}回）`), ...gmMoments().map(m=>`${m[0]}${m[1]}：${m[2].replace(/&[a-z#0-9]+;/g,'')}`)];
  copyText(lines.join('\n'));
}
function gmName(i,v){ GM.names[i]=String(v||'').slice(0,10); }
function gmView(){
  if(!GM) gmOpen();
  const top=`<div class="gm-top"><span class="label">${GM.unit==='player'?'🃏 テーブルモード':'📺 進行役モード'}</span>${GM.phase!=='setup'?`<span class="gm-turn">TURN ${GM.turn+1}/${TURNS}${GM.b4&&gmFinal()?' · 大引け':''}</span>`:''}${document.fullscreenEnabled?'<button class="btn ghost gm-fs" onclick="gmFull()" aria-label="全画面">⛶<span> 全画面</span></button>':''}<button class="btn ghost gm-quit" onclick="gmQuit()">やめる</button></div>`;
  if(GM.phase==='setup') return `<div class="col gm">${top}
    <section class="panel"><h2 class="ttl">${GM.unit==='player'?'紙のカードで遊ぶ（テーブルモード）':'みんなで遊ぶ（教室・体験会・大人数）'}</h2>
      <div class="gm-unit"><button class="${GM.unit==='player'?'on':''}" onclick="gmUnit('player')"><i>🃏</i><b>紙のカードで遊ぶ</b><small>テーブルモード · 2〜6人</small></button><button class="${GM.unit!=='player'?'on':''}" onclick="gmUnit('team')"><i>📺</i><b>チーム対抗</b><small>進行役モード · 2〜10チーム</small></button></div>
      <p class="note">${GM.unit==='player'?'印刷した体験版や製品版のカードで遊ぶときの相棒です。アプリが<b>NEWSの発表・大引けの伏せ札・点数の計算</b>をします。みんながOPENしたら、出した産業をタップするだけ。山札もメモもいりません。':'アプリが<b>NEWSの発表・相談タイマー・点数の計算</b>をします。各チームは紙のカードか、指で産業を決めて、進行役が入力してください。1チームの人数は何人でもOK。大きな画面やプロジェクターに映すと盛り上がります。'}</p>
      <span class="label">${gu()}の数</span><div class="gm-chips">${(GM.unit==='player'?[2,3,4,5,6]:[2,3,4,5,6,7,8,9,10]).map(v=>`<button class="${GM.n===v?'on':''}" onclick="gmSet('n',${v})">${v}</button>`).join('')}</div>
      <span class="label">${gu()}の名前（空欄なら「${gu()}1」…）</span><div class="gm-names">${Array.from({length:GM.n},(_,i)=>`<label style="--tc:${GM.unit==='player'?GM_SEAT[i]:GM_COL[i]}"><span class="gm-ani">${GM.unit==='player'?'ABCDEF'[i]:GM_ANI[i]}</span><input maxlength="10" placeholder="${gu()}${i+1}" value="${esc(GM.names[i]||'')}" oninput="gmName(${i},this.value)" aria-label="${gu()}${i+1}の名前"></label>`).join('')}</div>
      <span class="label">NEWS</span><div class="gm-chips"><button class="${GM.mode==='classic'?'on':''}" onclick="gmSet('mode','classic')">クラシック</button><button class="${GM.mode==='month'?'on':''}" onclick="gmSet('mode','month')">今月のNEWS（${monthPack().mon}）</button></div>
      <span class="label">${GM.unit==='player'?'考える時間（タイマー）':'相談タイム'}</span><div class="gm-chips">${[0,30,60,90,120].map(v=>`<button class="${GM.talk===v?'on':''}" onclick="gmSet('talk',${v})">${v?v+'秒':'なし'}</button>`).join('')}</div>
      <label class="check" style="margin:8px 0"><input type="checkbox" ${GM.b4?'checked':''} onchange="gmSet('b4',this.checked)"> 最後は「大引けサプライズ」（NEWSを伏せて、点数2倍）</label>
      <button class="btn go huge" onclick="gmStart()">スタート！</button>
      ${GM.unit==='player'?'<p class="note">先物取引・投資家カードは、紙のルールどおりに遊んでください（アプリの点数には入りません）。</p>':''}<p class="note" style="${GM.unit==='player'?'display:none':''}">7チーム以上だと、同じ産業に集まりやすくなります。「みんなと被らない」読みがいっそう大事に。</p></section></div>`;
  const T=GM.teams, n=GM.deck[GM.turn];
  if(GM.phase==='news'||GM.phase==='talk'){
    const paper = GM.hidden ? `<section class="gm-news osp"><span class="gm-k"><i>大引け</i>FINAL NEWS</span><b class="gm-h">最後のNEWSは伏せたまま！</b><p>来るのはこのどれか。点数は<b>2倍</b>！</p><div class="gm-cands">${GM.hidden.map(x=>`<span>${esc(gmNm(x))}</span>`).join('')}</div></section>`
      : `<section class="gm-news"><span class="gm-k"><i>速報</i>ECONOMIC NEWS</span><figure class="nphoto gm-ph">${artFor(GM.cfg,n,gmNm(n),GM.cfg.table[n])}</figure><b class="gm-h">${esc(gmNm(n))}！</b><p>${esc(gmDesc(n))}</p>${gmPayout(n)}</section>`;
    const talk = GM.phase==='talk' ? `<div class="gm-timer"><div class="gm-ring" id="gm-ring" style="--p:100%"><b id="gm-t">${GM.talk}</b><small>秒</small></div><p>${GM.unit==='player'?'考えて、1枚選ぼう！ 相談・はったりも自由':'チームで相談！ どの産業を出す？'}</p><p class="gm-hint">💡 ${GM_HINT[(GM.turn*2+(GM.hidden?1:0))%GM_HINT.length]}</p><button class="btn gold big" onclick="gmInput()">相談おわり → 入力へ</button></div>`
      : GM.talk ? `<div class="row" style="justify-content:center;gap:8px"><button class="btn go huge" onclick="gmTalk()">⏱ ${GM.unit==='player'?'タイマー':'相談'}スタート（${GM.talk}秒）</button><button class="btn ghost" onclick="gmInput()">すぐ入力</button></div>`
      : `<div class="gm-timer"><p>${GM.hidden?'NEWSを伏せたまま':'みんな'}、産業カードを1枚、裏向きで出そう</p><button class="btn go huge" onclick="gmInput()">3・2・1… OPEN！ → 入力へ</button></div>`;
    return `<div class="col gm">${top}${paper}${talk}${gmBoard()}${GM.turn?gmHands():''}</div>`;
  }
  if(GM.phase==='input'){
    const all=T.every(t=>t.pick!=null);
    return `<div class="col gm">${top}<section class="panel"><div class="row spread"><h3>各${gu()}が出した産業を入力</h3><span class="note">${T.filter(t=>t.pick!=null).length}/${T.length}</span></div>
      <div class="gm-in">${T.map((t,i)=>`<div class="gm-row" style="--tc:${t.c}"><b><span class="gm-ani">${t.a}</span>${esc(t.name)}</b><div>${IND.map((d,c)=>`<button class="${t.pick===c?'on':''}" style="--c:var(--i${c})" ${t.hand.includes(c)?'':'disabled'} onclick="gmPick(${i},${c})" aria-label="${esc(t.name)} ${d}">${svg(c,2.2)}</button>`).join('')}</div></div>`).join('')}</div>

  if(GM.phase==='announce'){ GM.hidden=null; const real=GM.deck[GM.turn];
    return `<div class="col gm">${top}<section class="gm-news ann"><span class="gm-k"><i>🔔</i>15:30 大引け速報</span><b class="gm-h">${esc(gmNm(real))}！</b><p>${esc(gmDesc(real))}</p>${gmPayout(real)}</section><button class="btn go huge" onclick="gmResolve()">結果を見る（点数2倍）</button></div>`; }
  if(GM.phase==='reveal'){

const SPEED_SEC=15;

  if(!S.speed || !G || G.online || G.phase!=='choose' || G.ov) return '';

  if(!G || G.phase!=='choose' || !S.speed || G.online){ clearInterval(SPD.timer); return; }
  if(G.ov) { SPD.until+=200; return; }   // 交代画面などのあいだは止める
  const left=(SPD.until-Date.now())/1000, el=document.querySelector('.spd');
  if(el){ el.querySelector('i').style.width=Math.max(0,left/SPEED_SEC*100)+'%'; el.querySelector('b').textContent=Math.max(0,Math.ceil(left)); el.classList.toggle('hurry',left<=5); }

function liveLines(){

  const P=G.players, L=G.last, nm=i=>String(P[i].name).replace(/^CPU\s*/,''), out=[];
  const prev=P.map(p=>p.hist.length>1?p.hist[p.hist.length-2]:0), now=P.map(p=>p.score);
  const lead=a=>{ const m=Math.max(...a); const w=a.map((v,i)=>v===m?i:-1).filter(i=>i>=0); return w.length===1?w[0]:-1; };
  const cnt=[0,0,0,0,0,0]; L.forEach(r=>cnt[r.ind]++);
  const crowd=cnt.indexOf(Math.max(...cnt)), k=cnt[crowd];
  const monos=L.map((r,i)=>({r,i})).filter(x=>x.r.k===1).sort((a,b)=>b.r.total-a.r.total);
  const l0=lead(prev), l1=lead(now), last=G.turn===TURNS-1 && (!isLong() || (G.round||0)===G.rounds-1);
  if(monos[0] && monos[0].r.total>=4) out.push([5,`${nm(monos[0].i)}、${IND[monos[0].r.ind]}を独占して ${sgn(monos[0].r.total)}！ これは大きい！`]);
  if(k>=3) out.push([4,`${IND[crowd]}に${k}人が殺到！ 被って点が伸びません！`]);
  if(l1>=0 && l1!==l0 && P[0].hist.length>2) out.push([last?6:5,`${nm(l1)}がトップに${last?'立って、そのままゴール！':'浮上！'}`]);

  const so=now.slice().sort((a,b)=>b-a); if(so.length>1 && so[0]-so[1]<=1 && P[0].hist.length>2) out.push([3,last?'最後まで1点を争う大接戦でした！':'トップ争いは1点差の大接戦！']);
  if(!out.length && monos[0]) out.push([1,`${nm(monos[0].i)}が${IND[monos[0].r.ind]}を独占。堅実な一手です。`]);
  if(!out.length) out.push([1,'全員がだれかと被る、読み合いのターンでした。']);

  return G.live;
}

function lineChart(){
  const W=560,H=240,L=34,R=120,Tp=14,B=26;
  const all=G.players.flatMap(p=>p.hist), lo=Math.min(0,...all), hi=Math.max(1,...all);
  const NT=totalTurns(), LG=logDeck(), x=t=>L+t*(W-L-R)/NT, y=v=>Tp+(hi-v)*(H-Tp-B)/(hi-lo);
  const top=Math.max(...G.players.map(p=>p.score));
  let ticks=''; const step=Math.max(1,Math.ceil((hi-lo)/5));
  for(let v=Math.ceil(lo/step)*step; v<=hi; v+=step) ticks+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end">${v}</text>`;
  for(let t=0;t<=NT;t++){ if(isLong() && t%TURNS){ continue; } if(isLong() && t && t<NT) ticks+=`<line x1="${x(t)}" x2="${x(t)}" y1="${Tp}" y2="${H-B}" stroke="var(--gold)" stroke-opacity=".35" stroke-dasharray="4 4"/>`; ticks+=`<text x="${x(t)}" y="${H-6}" text-anchor="middle">${t===0?'開始':isLong()?termName(t/TURNS-1)+'末':(G.cfg.hist?yearOf(LG[t-1]):'T'+t)}</text>`; }
  const order=G.players.map((p,i)=>({p,i})).sort((a,b)=>b.p.score-a.p.score);
  let lastY=-99; const labY={};
  order.forEach(o=>{ let yy=y(o.p.score); if(yy<lastY+15) yy=lastY+15; labY[o.i]=yy; lastY=yy; });
  const lines=G.players.map((p,i)=>{ const win=p.score===top, col=win?'var(--gold)':'var(--dim)';
    return `<polyline points="${p.hist.map((v,t)=>`${x(t)},${y(v)}`).join(' ')}" fill="none" stroke="${col}" stroke-width="${win?3:1.6}" stroke-linejoin="round"/>
      ${p.hist.map((v,t)=>`<circle cx="${x(t)}" cy="${y(v)}" r="${win?4.5:3}" fill="${col}" stroke="var(--panel)" stroke-width="2"><title>${esc(p.name)} ${t===0?'開始':'T'+t}: ${v}pt</title></circle>`).join('')}
      <text class="lbl" x="${W-R+8}" y="${labY[i]+4}">${esc(p.name)} ${p.score}</text>`; }).join('');
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="各プレイヤーの累計POINTの推移">${ticks}${lines}</svg>`;
}

function recordResult(){
  if(!G || G.recorded) return; G.recorded=true;
  const me = G.online ? G.me : (G.players.filter(isHuman).length===1 ? G.players.findIndex(isHuman) : -1);
  if(me<0) return;
  const P=S.prof, st=P.st, p=G.players[me];
  const rk=ranking(G.players,G.cfg), mine=rk.find(x=>x.i===me), won=G.teams ? teamWon(me) : !!(mine && mine.rank===1);
  // 3ターン目終了時点の順位（逆転劇の判定）
  let lastAt3=false;
  if((G.rounds||1)===1 && TURNS>=4 && p.hist.length>3){ const s3=G.players.map(q=>q.hist[3]); lastAt3 = s3[me]===Math.min(...s3) && s3.some(v=>v>s3[me]); }
  const futBest=Math.max(-99,...p.used.filter(u=>u.fut).map(u=>u.total));
  P.ind=P.ind||[0,0,0,0,0,0]; P.indm=P.indm||[0,0,0,0,0,0]; P.indp=P.indp||[0,0,0,0,0,0]; P.indc=P.indc||[0,0,0,0,0,0]; p.used.forEach(u=>{ P.ind[u.ind]++; if(u.k===1) P.indm[u.ind]++; P.indp[u.ind]+=u.total; P.indc[u.ind]++; });   // indp・indc：平均点用（数えはじめてからの点と回数）
  G.recBroke=recordBests(p, me, won);
  st.games++; if(won) st.wins++; if(!G.closeX && !G.pw && !G.yomi) st.best=Math.max(st.best,p.score); st.mono+=p.uniq; if(p.used.some(u=>u.fut)) st.fut++; if(G.cfg.hist) st.hist++; if(G.online) st.online++;
  const xp = Math.round((20 + Math.max(0,p.score)*3 + p.uniq*5 + (won?40:0) + (G.online?15:0)) * (G.evt?1.5:1));   // 今週のイベント参加中はXP1.5倍
  const mis = progressMissions({p, won, rank:mine?mine.rank:9, hist:!!G.cfg.hist, daily:!!G.daily});
  const before=lvInfo(P.xp); P.xp+=xp+mis.xp; const after=lvInfo(P.xp);
  const skins=SKINS.filter(s=>s.lv>before.lv && s.lv<=after.lv);
  const got=[]; const unlock=id=>{ if(!P.ach[id]){ P.ach[id]=Date.now(); got.push(id); } };
  unlock('first');
  if(won) unlock('win1'); if(st.wins>=10) unlock('win10');
  if(won && G.cfg.fut) unlock('futwin');
  if(isLong()){ unlock('long1'); if(won) unlock('longwin');
    const mine2=G.settles.map(s=>s.rows[me]).filter(Boolean);
    st.ct=(st.ct||0)+mine2.filter(r=>r.done).length; if(st.ct>=5) unlock('ct5');
    if(mine2.length===G.rounds && mine2.every(r=>r.bonus>0)) unlock('sweep');
    P.mk=[...new Set([...(P.mk||[]),...(G.mkts||[])])]; if(P.mk.length>=Object.keys(MARKETS).length) unlock('mkall'); }
  if(won && G.players.some(q=>q.type==='pro')) unlock('beatpro');
  if(G.pw && G.pw[me]){ const k=G.pw[me]; P.pwSt=P.pwSt||{}; const r=P.pwSt[k]=P.pwSt[k]||{g:0,w:0}; r.g++; if(won){ r.w++; unlock('pw1'); } if(Object.keys(PWR).every(x=>P.pwSt[x]&&P.pwSt[x].w>0)) unlock('pwall'); }
  if(p.uniq>=3) unlock('mono3'); if(futBest>=4) unlock('fut4');
  if(won && G.cfg.hist) unlock('hist'); if(G.online) unlock('online');
  if(p.score>=15 && !G.closeX && !G.pw) unlock('big15'); if(won && lastAt3) unlock('comeback'); if(st.games>=20) unlock('games20');
  if(G.daily){ P.daily=P.daily||{}; if(!P.daily[G.daily]) P.daily[G.daily]={score:p.score, rank:mine?mine.rank:0, grid:resultGrid(p)};
    const ks=Object.keys(P.daily).sort(); while(ks.length>60) delete P.daily[ks.shift()];
    if(dailyStreak()>=3) unlock('daily3'); if(dailyStreak()>=7) unlock('daily7'); }
  P.log=(P.log||[]).concat([{t:Date.now(), m:G.cfg.fut?'f':G.cfg.hist?'h':'c', l:isLong()?1:0, o:G.online?1:0, d:G.daily?1:0, r:mine?mine.rank:0, n:G.players.length, s:p.score, g:resultGrid(p)}]).slice(-100);
  S.rec={games:st.games,wins:st.wins,best:st.best}; save('azakei-rec',S.rec);
  const r0=rateOf(), r1=(G.tac||(G.cfg.my&&!G.cfg.month)) ? r0 : Math.max(0, r0+rateDelta(mine?mine.rank:G.players.length, G.players.length, won)); P.rate=r1; if(r1>=1250) unlock('gold'); rsPeak(r1);   // 作戦カードありはレートに入れない

  let coin = 10 + (won?20:mine&&mine.rank===2?10:0) + p.uniq*2 + (mis.cleared.length*5) + (G.daily?10:0);   // ショップで使うコイン
  const cup=G.cup?cupResult(mine?mine.rank:9):null; if(cup && cup.champ){ coin+=cup.bonus; if(cup.id==='gold') unlock('cupgold'); }
  P.coin=(P.coin||0)+coin;
  const bsr=G.boss?bossResult(rk, me):null; if(bsr&&bsr.coin){ coin+=bsr.coin; P.coin+=bsr.coin; }
  const svr=G.surv!=null?survResult(mine?mine.rank:9):null; if(svr&&svr.coin){ coin+=svr.coin; P.coin+=svr.coin; } if(svr&&svr.lv+1>=5&&svr.pass) unlock('surv5');

  const sea=curSeason(); let spr=null;

  const sty=G.story?storyResult(rk, me):null; if(sty&&sty.bonus){ coin+=sty.bonus; P.coin+=sty.bonus; } if(STORIES.every(x=>(P.story||{})[x.k])) unlock('story9');
  const wm=progressWeekly({p, won, rank:mine?mine.rank:9, boss:!!(bsr&&bsr.win), special:!!(G.story||G.cup||G.surv!=null)});
  if(wm.coin){ coin+=wm.coin; P.coin+=wm.coin; }
  if(G.duel && G.duel.target!=null && p.score>G.duel.target) unlock('duelwin');

  { const RV=P.riv||{}, ks=Object.keys(CHARS); if(ks.every(k=>RV[k])) unlock('chars9'); if(ks.every(k=>RV[k]&&RV[k].w>0)) unlock('beat9'); }

function dailyStreak(){

  if(!D[todayKey(d)]) d.setDate(d.getDate()-1);          // 今日まだなら昨日から数える

}

/* ---- stats charts (My page): 得点の推移（1系列の折れ線）と、遊び方別の勝率（横棒） ---- */
function statsCharts(){
  const L=(S.prof.log||[]).slice(-20);
  if(L.length<2) return '';
  const W=560,H=150,pl=30,pr=10,pt=12,pb=22, hi=Math.max(10,...L.map(x=>x.s)), lo=Math.min(0,...L.map(x=>x.s));
  const x=i=>pl+i*(W-pl-pr)/(L.length-1), y=v=>pt+(hi-v)*(H-pt-pb)/(hi-lo||1);
  let grid=''; const step=Math.max(5,Math.ceil((hi-lo)/4/5)*5);
  for(let v=Math.ceil(lo/step)*step; v<=hi; v+=step) grid+=`<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${pl-6}" y="${y(v)+4}" text-anchor="end">${v}</text>`;
  const pts=L.map((g,i)=>`${x(i).toFixed(1)},${y(g.s).toFixed(1)}`).join(' ');
  const best=Math.max(...L.map(g=>g.s)), bi=L.map(g=>g.s).lastIndexOf(best);
  const dots=L.map((g,i)=>`<g class="pt"><circle cx="${x(i)}" cy="${y(g.s)}" r="12" fill="transparent"/><circle cx="${x(i)}" cy="${y(g.s)}" r="${g.r===1?5:4}" fill="${g.r===1?'var(--gold)':'var(--panel)'}" stroke="var(--gold)" stroke-width="2"/><title>${g.s}pt · ${g.r}位/${g.n}人 · ${g.m==='h'?'歴史':'クラシック'}${g.l?'ロング':''}</title></g>`).join('');
  const line=`<svg viewBox="0 0 ${W} ${H}" class="schart" role="img" aria-label="最近${L.length}戦の得点の推移。最高${best}点">${grid}<polyline points="${pts}" fill="none" stroke="var(--gold)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>${dots}<text x="${x(bi)}" y="${y(best)-10}" text-anchor="middle" class="lab">最高 ${best}</text><text x="${pl}" y="${H-4}">${L.length}戦前</text><text x="${W-pr}" y="${H-4}" text-anchor="end">最新</text></svg>`;
  const A=S.prof.log||[], cats=[['クラシック',g=>g.m==='c'&&!g.l&&!g.d&&!g.o],['歴史モード',g=>g.m==='h'&&!g.l&&!g.d&&!g.o],['未来編',g=>g.m==='f'&&!g.d&&!g.o],['ロング版',g=>g.l],['デイリー',g=>g.d],['オンライン',g=>g.o]];
  const bars=cats.map(([n,f])=>{ const gs=A.filter(f), w=gs.filter(g=>g.r===1).length, pct=gs.length?Math.round(w/gs.length*100):0;
    return `<div class="wrow" title="${n}：${gs.length}戦 ${w}勝"><span class="wn">${n}</span><span class="wbar"><i style="width:${pct}%"></i></span><b class="num">${gs.length?pct+'%':'—'}</b><span class="note">${gs.length}戦</span></div>`; }).join('');
  return `<section class="panel"><div class="row spread"><h3>最近の得点</h3><span class="note">金の点は1位の回</span></div>${line}
    <h3 style="margin-top:12px">遊び方ごとの1位率</h3><div class="wlist">${bars}</div><p class="note">最近30戦の記録から計算しています。</p></section>`;

/* ---- coach: 初心者向けに「おすすめ」と理由を出す（設定でオフにできる） ---- */
function coachHTML(p){
  if(!S.coach || !G || G.phase!=='choose') return '';
  try{
    const C=G.cfg, T=C.table, t=G.turn, known=p.foreUsed&&p.foreTurn===t, row=rowFor(p,G.deck,t);
    const vals=cardValues(aiCfg(G.players.indexOf(p)),p,G.players,G.deck,t,row,known,p.fut?futBase:null);
    const pool=unseen(C,G.deck,t), left=TURNS-1-t;
    const opp=G.players.filter(o=>o!==p).map(o=>oppDist(T,o,G.deck[t],pool,left));
    const pi=G.teams?G.players.findIndex((q,k)=>q!==p&&G.teams[k]===G.teams[G.players.indexOf(p)]):-1, pp=pi>=0&&!isHuman(G.players[pi])?G.players[pi].pick:null;   // チーム戦：相棒の予定カードは被る前提
    const wp=whaleNext(), alone=c=>c===pp||c===wp?0:Math.round(opp.reduce((a,d)=>a*(1-d[c]),1)*100);
    const base=c=>(p.fut?futBase(T[row][c],C):T[row][c])+(p.brand===c?1:0);
    const best=p.hand.slice().sort((a,b)=>(vals[b]-(b===pp?9:0))-(vals[a]-(a===pp?9:0)))[0];
    const top=p.hand.reduce((a,c)=>base(c)>base(a)?c:a,p.hand[0]);
    let tip;
    if(top!==best) tip=`いちばん点が高い${IND[top]}（${sgn(base(top))}）は、ほかの人も出しそう。独占できる確率は${alone(top)}%。`;
    else tip = alone(best)>=50 ? `点がいちばん高く、独占できる確率も${alone(best)}%。` : `いちばん高い点。被っても${sgn(base(best))}は入るので安全（独占できる確率は${alone(best)}%）。`;
    if(top!==best && futureCost(T,p.hand,top,known?[G.deck[t+1]]:pool,left,known)>1) tip+=`${IND[top]}はこの先のNEWSでも強いので、取っておくのもあり。`;
    if(ospPending()) tip+=` 最後のNEWSは伏せられているので、点数は候補${G.osp.cand.length}つの平均です。`;
    if(!p.foreUsed && t<TURNS-1 && C.fore==='futures'){ const nx=G.deck[t+1]; if(known===false && left>0) tip+=' 迷ったら「先物取引」で次のNEWSを見てから決めるのも手。'; }
    return `<div class="coach"><span class="ci">💡</span><span class="ct"><b>コーチのおすすめ：${IND[best]}</b><span class="cp">${sgn(base(best))} · 独占できそう ${alone(best)}%</span><span class="note">${tip}</span></span><button class="cx" onclick="toggleCoach()" aria-label="コーチを非表示">✕</button></div>`;
  }catch(e){ return ''; }
}

  {id:'allplus',n:'全ターンでプラス点を取る',    t:1, xp:60, ic:'↗', f:r=>r.p.used.length&&r.p.used.every(u=>u.total>0)?1:0},
  {id:'hist',   n:'歴史モードを1回遊ぶ',        t:1, xp:40, ic:'⌛', f:r=>r.hist?1:0},
  {id:'daily',  n:'デイリーに挑戦する',          t:1, xp:40, ic:'☀', f:r=>r.daily?1:0}
];
const MIS_BONUS=60;
function todayMissions(){
  const k=todayKey(), rnd=mulberry(k*7+3), pool=MISSIONS.slice(), out=[];
  while(out.length<3){ const m=pool.splice(Math.floor(rnd()*pool.length),1)[0];
    if(out.some(o=>o.id.slice(0,3)===m.id.slice(0,3))) continue;   // 似たお題は同じ日に出さない
    out.push(m); }
  const P=S.prof; if(!P.mis || P.mis.day!==k) P.mis={day:k, prog:{}, done:{}, bonus:false};
  return out;
}
function progressMissions(r){
  const list=todayMissions(), M=S.prof.mis, cleared=[];
  list.forEach(m=>{ if(M.done[m.id]) return; M.prog[m.id]=Math.min(m.t,(M.prog[m.id]||0)+m.f(r)); if(M.prog[m.id]>=m.t){ M.done[m.id]=1; cleared.push(m); } });
  let bonus=0; if(!M.bonus && list.every(m=>M.done[m.id])){ M.bonus=true; bonus=MIS_BONUS; }

const talkOf = p => (p.boss && G && G.boss && BOSSES.find(b=>b.id===G.boss).talk) || CPU_TALK[String(p.name).replace(/^CPU\s*/,'').replace(/（.*$/,'')] || CPU_TALK['ソラ'];
function cpuChatter(){
  if(!G || !G.last || reduced()) return;
  const top=Math.max(...G.players.map(p=>p.score));
  const lines=[];
  G.players.forEach((p,i)=>{
    if(isHuman(p) || i===G.rcutI) return;   /* カットインで話したキャラは吹き出しを出さない */
    const r=G.last[i], T=talkOf(p);
    const kind = r.k===1 ? 'mono' : r.total<0 ? 'neg' : r.total>=5 ? 'big' : (r.k>=2 && Math.random()<.6) ? 'hit' : (p.score===top && Math.random()<.5) ? 'lead' : null;
    if(kind && T[kind]) lines.push({i, text:T[kind][Math.floor(Math.random()*T[kind].length)], w:kind==='mono'||kind==='neg'?2:1});
  });
  lines.sort((a,b)=>b.w-a.w || Math.random()-.5).slice(0,2).forEach((l,j)=>setTimeout(()=>say(l.i,l.text),1100+j*700));
}
function say(i,text){

}

function setCell(r,c,v){ CFG.table[r][c]=Math.max(-9,Math.min(9,parseInt(v,10)||0)); CFG.preset='custom'; saveCfg(); LAB.result=null; render(); }
function setRule(k,v){ CFG[k]=v; TURNS=CFG.turns||4; CFG.preset='custom'; saveCfg(); LAB.result=null; sfx('click'); render(); }
