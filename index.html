@keyframes combo{50%{transform:translate(2px,-2px) scale(1.04)}}
.cutin.lead .band{background:linear-gradient(90deg,transparent,#a77bff 12%,#ffb3e6 50%,#a77bff 88%,transparent);box-shadow:0 0 0 4px var(--rail),0 0 70px rgb(167 123 255 / .8)}
.cutin.lead b{color:#22053d} .cutin.lead span{color:#4a1a6e}
.cutin.final .band{transform:none;background:linear-gradient(90deg,transparent,#c8102e 10%,#ff3d5a 50%,#c8102e 90%,transparent);box-shadow:0 0 0 4px #000,0 0 90px rgb(255 40 70 / .8);flex-direction:column;align-items:center;gap:6px;animation:finalcut 1.9s cubic-bezier(.2,.8,.2,1) both}
.cutin.final b{color:#fff;letter-spacing:.08em;text-shadow:0 5px 0 rgb(0 0 0 / .45)} .cutin.final span{color:#ffe3e8;font-family:var(--body);font-weight:800;font-size:clamp(14px,4vw,20px)}
@keyframes finalcut{0%{transform:scaleY(0);opacity:0}12%{transform:scaleY(1.15);opacity:1}20%{transform:scaleY(1)}82%{transform:scaleY(1);opacity:1}100%{transform:scaleY(0);opacity:0}}
body.lastturn::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:3;box-shadow:inset 0 0 90px 10px rgb(255 40 70 / .45);animation:lastpulse 1.1s ease-in-out infinite}
@keyframes lastpulse{0%,100%{opacity:.45}15%{opacity:1}30%{opacity:.6}45%{opacity:.95}}
@media (prefers-reduced-motion:reduce){body.lastturn::after{animation:none}}
@keyframes cutin{0%{transform:rotate(-8deg) translateX(110%)}18%{transform:rotate(-8deg) translateX(0)}78%{transform:rotate(-8deg) translateX(-3%);opacity:1}100%{transform:rotate(-8deg) translateX(-110%);opacity:0}}
/* ---- card skins ---- */
.card.sk-gold{box-shadow:0 0 0 2px var(--rail),0 0 0 4.5px var(--gold),0 0 0 6px var(--rail),0 0 0 7.5px var(--gold-deep),0 16px 26px -12px #000}
.card.sk-gold .ban{background:linear-gradient(180deg,var(--gold2),var(--gold) 55%,var(--gold-deep));color:#2a1a00}
.card.sk-gold .art .disc{box-shadow:0 0 0 3px var(--gold),0 0 0 5px rgb(0 0 0 / .25),inset 0 -6px 12px rgb(0 0 0 / .2)}
.back.sk-gold{background:linear-gradient(135deg,#ffe08a,#c98e12);box-shadow:0 0 0 2px var(--rail),0 0 0 3.5px var(--gold2),0 6px 10px -4px #000}
.back.sk-gold::after{color:#5a3a00}
.card.sk-neon{background:radial-gradient(circle at 50% 38%,color-mix(in srgb,var(--c) 30%,#0a0c22),#06071a 72%);box-shadow:0 0 0 2px var(--c),0 0 16px color-mix(in srgb,var(--c) 70%,transparent),inset 0 0 18px color-mix(in srgb,var(--c) 45%,transparent),0 16px 26px -12px #000}
.card.sk-neon::before{background:repeating-linear-gradient(0deg,rgb(255 255 255 / .04) 0 1px,transparent 1px 4px)}
.card.sk-neon .art .disc{background:none;box-shadow:0 0 0 2px var(--c),0 0 18px var(--c),inset 0 0 14px color-mix(in srgb,var(--c) 70%,transparent)}
.card.sk-neon .art svg{color:color-mix(in srgb,var(--c) 40%,#fff);filter:drop-shadow(0 0 6px var(--c))}
.card.sk-neon .ban{background:rgb(0 0 0 / .45);color:color-mix(in srgb,var(--c) 45%,#fff);text-shadow:0 0 8px var(--c);border-top:1px solid color-mix(in srgb,var(--c) 60%,transparent)}
.card.sk-neon .wm{opacity:.1;color:var(--c)}
.back.sk-neon{background:#06071a;box-shadow:0 0 0 2px var(--cyan),0 0 12px var(--cyan),0 6px 10px -4px #000}
.back.sk-neon::after{color:var(--cyan-tx);text-shadow:0 0 8px var(--cyan);background:repeating-linear-gradient(0deg,rgb(255 255 255 / .05) 0 1px,transparent 1px 4px)}
.card.sk-washi{color:var(--paper-ink);background:radial-gradient(circle at 18% 22%,#e7c160 0 2px,transparent 3px),radial-gradient(circle at 78% 14%,#e7c160 0 3px,transparent 4px),radial-gradient(circle at 70% 70%,#e7c160 0 2px,transparent 3px),radial-gradient(circle at 30% 82%,#d9ae45 0 1.5px,transparent 2.5px),radial-gradient(circle at 88% 50%,#e7c160 0 1.5px,transparent 2.5px),linear-gradient(170deg,#fffaf0,var(--paper) 50%,var(--paper2));box-shadow:0 0 0 3px var(--rail),0 0 0 5px #c9a24a,0 16px 26px -12px #000}
.card.sk-washi::before{background:repeating-linear-gradient(90deg,rgb(36 24 10 / .035) 0 1px,transparent 1px 5px),linear-gradient(180deg,rgb(255 255 255 / .5),transparent 25%)}
.card.sk-washi .art .disc{background:radial-gradient(circle at 35% 30%,color-mix(in srgb,var(--c) 70%,#fff),var(--c));box-shadow:0 0 0 2px #c9a24a,0 4px 0 color-mix(in srgb,var(--c) 55%,#000)}
.card.sk-washi .art svg{color:#fff}
.card.sk-washi .ban{background:var(--c);color:#fff;font-family:var(--serif);font-weight:800;border-top:2px solid #c9a24a}
.card.sk-washi .wm{color:var(--c);opacity:.12}
.card.sk-washi .no{color:var(--paper-red)} .card.sk-washi .pt:not(.up):not(.down),.card.sk-washi .nx{color:#fff}
.back.sk-washi{background:radial-gradient(circle at 30% 30%,#e7c160 0 1.5px,transparent 2.5px),radial-gradient(circle at 70% 65%,#e7c160 0 2px,transparent 3px),linear-gradient(170deg,#fffaf0,var(--paper2));box-shadow:0 0 0 2px var(--rail),0 0 0 3.5px #c9a24a,0 6px 10px -4px #000}
.back.sk-washi::after{content:"麻";color:var(--paper-red);font-family:var(--serif);font-weight:800}
.card.sk-holo .holo{opacity:.85;animation:holo 3.2s linear infinite}
.card.sk-holo{box-shadow:0 0 0 2px var(--rail),0 0 0 4.5px #fff,0 0 18px rgb(79 227 255 / .6),0 16px 26px -12px #000}
.card.sk-holo .ban{background:linear-gradient(90deg,#ff5c9a,#ffc83a,#5cf0a2,#4fe3ff,#a77bff);color:#1a1033;text-shadow:0 1px 0 rgb(255 255 255 / .5)}
.back.sk-holo{background:linear-gradient(135deg,#ff5c9a,#ffc83a 30%,#5cf0a2 55%,#4fe3ff 75%,#a77bff);background-size:200% 200%;animation:holo 3.2s linear infinite;box-shadow:0 0 0 2px var(--rail),0 0 0 3.5px #fff,0 6px 10px -4px #000}
.back.sk-holo::after{color:#fff;text-shadow:0 2px 0 rgb(0 0 0 / .35)}
.card.pv{width:64px;border-radius:10px;pointer-events:none}
.card.pv .ban{font-size:11px;padding:2px 0 3px} .card.pv .wm{display:none} .card.pv .art .disc{width:66%}
.skins{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
.skin{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;padding:14px 8px 10px;border-radius:18px;border:0;background:rgb(7 8 24 / .4);box-shadow:inset 0 0 0 1px var(--line);text-align:center;transition:transform .15s ease,box-shadow .15s ease}
.skin b{font-size:13px} .skin .note{font-size:11px;line-height:1.35}
.skin .sprev{position:relative;display:grid;place-items:center;height:100px}
.skin:hover:not(.lock){transform:translateY(-3px)}
.skin.on{box-shadow:inset 0 0 0 2px var(--gold),0 0 24px -8px var(--gold);background:radial-gradient(circle at 50% 0%,rgb(255 200 58 / .18),transparent 70%),rgb(7 8 24 / .4)}
.skin.on::after{content:"使用中";position:absolute;top:6px;right:6px;font-size:11px;font-weight:800;border-radius:999px;padding:1px 7px;background:var(--gold);color:#2a1a00}
.skin.lock .card{filter:grayscale(1) brightness(.45)}
.skin.lock{cursor:not-allowed}
.skin .lk{position:absolute;inset:auto 0 50% 0;transform:translateY(50%);font-family:var(--display);font-size:13px;color:var(--ink);text-shadow:0 2px 0 var(--rail)}
.newskin{display:flex;align-items:center;gap:14px;border-radius:18px;padding:10px 14px;background:linear-gradient(90deg,rgb(255 200 58 / .16),transparent);box-shadow:inset 0 0 0 2px var(--gold);animation:achin .6s cubic-bezier(.2,.9,.3,1.3) 2.2s both}
.newskin > span:nth-child(2){flex:1;display:flex;flex-direction:column} .newskin b{font-size:16px}

.missions{background:radial-gradient(circle at 100% 0%,rgb(79 227 255 / .14),transparent 45%),linear-gradient(180deg,var(--panel2),var(--panel))}
.mlist,.mclear{display:flex;flex-direction:column;gap:8px}
.mis{display:flex;align-items:center;gap:12px;border-radius:16px;padding:10px 12px;background:rgb(7 8 24 / .45);box-shadow:inset 0 0 0 1px var(--line)}
.mic{flex:0 0 auto;width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-size:18px;font-weight:800;background:var(--panel2);color:var(--cyan-tx);box-shadow:0 3px 0 var(--rail)}
.mtx{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px} .mtx b{font-size:14px}
.mbar{display:block;height:8px;border-radius:4px;background:var(--rail);overflow:hidden;box-shadow:inset 0 0 0 1px var(--line)}

.mxp{flex:0 0 auto;display:flex;flex-direction:column;align-items:flex-end;font-weight:800;font-size:14px;min-width:54px}
.mxp small{font-size:11px;color:var(--gold-t)}

.mis.ok .mbar i{background:linear-gradient(90deg,var(--cta),var(--up))}
.mis.ok .mxp{font-family:var(--display);font-weight:400;color:var(--up);letter-spacing:.04em}

.mis.pop .mxp{color:var(--gold-t);font-family:var(--display);font-weight:400;font-size:16px}
.mis.all{box-shadow:inset 0 0 0 2px var(--gold),0 0 24px -6px var(--gold);background:linear-gradient(90deg,rgb(255 200 58 / .2),rgb(7 8 24 / .4))}
.mis.all .mic{background:radial-gradient(circle at 35% 30%,#fff1b8,var(--gold));color:#2a1a00;box-shadow:0 3px 0 var(--gold-deep)}
.mbonus{display:flex;align-items:center;gap:10px;margin-top:4px;font-size:13px;color:var(--muted)}
.mbonus > span:first-child{flex:1} .mbonus b{color:var(--gold-t)}

.mbonus.ok{color:var(--up)}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

function save(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }
function loadCfg(){ const c=load(KEY); return (c && c.table && c.table.length===6 && c.fore) ? c : presetCfg('rec'); }
function saveCfg(){ save(KEY,CFG); }
// モードごとの実行用設定（NEWSの名前・得点表・歴史の年）
function cfgFor(mode,era){
  if(mode==='future') return {...CFG, table:HIST.map(h=>h.r), names:HIST.map(h=>h.n), hist:true, fut:true, pool:ERAS.future.ids.slice(), era:'future'};   // 未来編は歴史モードのしくみで、未来の出来事を使う
  if(mode==='history'){ const e=ERAS[era]||ERAS.all; return {...CFG, table:HIST.map(h=>h.r), names:HIST.map(h=>h.n), hist:true, pool:e.ids, era}; }
  if(mode==='ex') return {...CFG, table:CFG.table.concat(EXT_T), names:ALL_NEWS, hist:false, ex:true};
  return {...CFG, names:NEWS, hist:false};
}
const yearOf = i => HIST[i].y;
const modeName = c => c&&c.fut ? '未来編' : c&&c.hist ? '歴史モード' : c&&c.ex ? 'クラシックEX' : 'クラシック';

/* ================= engine（対戦と検証で共通） ================= */
function gain(cfg,b,k){
  let r;
  if(k===1) r=b+cfg.bonus;
  else if(cfg.collide==='minus') r = b>0 ? Math.max(0,b-(k-1)) : b;
  else if(cfg.collide==='split') r = b>0 ? Math.floor(b/k) : b;
  else r=b;
  if(k>1 && cfg.hitPen) r-=cfg.hitPen;          // 市況「規制強化」
  if(r<0 && cfg.negMul) r*=cfg.negMul;          // 市況「不況」
  return r;
}
const divOf = (cfg,v) => cfg.fore==='dividend' && v>=3 ? 1 : 0;
const rowFor = (p,deck,t) => p.fut ? deck[t+1] : deck[t];
// 先物は次のNEWSの点数から手数料1を引く（プラスのときだけ）
const futBase = (v,cfg) => v>0 ? v-(cfg && cfg.fee!=null ? cfg.fee : 1) : v;   // 市況「先物ブーム」では手数料0
const baseFor = (cfg,p,deck,t,c) => (p.fut ? futBase(cfg.table[deck[t+1]][c],cfg) : cfg.table[deck[t]][c]) + (p.brand===c?1:0);   // ロング版のブランドは+1
// まだ起こりうるNEWS（公開情報）。歴史モードでは「今より後の年の出来事」
function unseen(cfg,deck,t){
  if(cfg.hist){ const y=yearOf(deck[t]); return cfg.pool.filter(i=>yearOf(i)>y); }
  return deck.slice(t+1);
}
function buildDeck(cfg,rnd){
  if(cfg.ex) return shuffle([...Array(cfg.table.length).keys()],rnd).slice(0,6);   // EX：12種から毎回ちがう6種
  if(cfg.hist) return shuffle(cfg.pool.slice(),rnd).slice(0,TURNS).sort((a,b)=>yearOf(a)-yearOf(b));
  return shuffle([0,1,2,3,4,5],rnd);
}
function shuffle(a,rnd){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(rnd()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function futureCost(T,hand,c,fut,left,known){
  if(left<=0 || !fut.length) return 0;
  const others=hand.filter(x=>x!==c); if(!others.length) return 0;
  let g=0;
  for(const u of fut){ let bo=-99; for(const x of others) bo=Math.max(bo,T[u][x]); g+=Math.max(0,T[u][c]-bo); }
  let cost=g/fut.length;
  if(!known) cost*=Math.min(1,left/fut.length);
  return cost;
}
function oppDist(T,o,news,pool,left){
  const d=[0,0,0,0,0,0], sc={}; let mx=-1e9, z=0;
  for(const x of o.hand){ const s=T[news][x]-futureCost(T,o.hand,x,pool,left,false); sc[x]=s; if(s>mx) mx=s; }
  for(const x of o.hand){ d[x]=Math.exp((sc[x]-mx)/0.9); z+=d[x]; }
  for(let i=0;i<6;i++) d[i]/=z;
  return d;
}
function cardValues(cfg,p,players,deck,t,row,known,adj){
  const T=cfg.table, left=TURNS-1-t, pool=unseen(cfg,deck,t), fut=known?[deck[t+1]]:pool;
  const opp=players.filter(o=>o!==p).map(o=>oppDist(T,o,deck[t],pool,left));
  const vals={};
  for(const c of p.hand){
    let dist=[1];
    for(const od of opp){ const q=od[c], nd=new Array(dist.length+1).fill(0); for(let k=0;k<dist.length;k++){ nd[k]+=dist[k]*(1-q); nd[k+1]+=dist[k]*q; } dist=nd; }
    const b0=(adj?adj(T[row][c],cfg):T[row][c])+(p.brand===c?1:0);
    let ev=0; for(let k=0;k<dist.length;k++) ev+=dist[k]*gain(cfg,b0,k+1);
    let carry=0;
    if(cfg.fore==='dividend' && left>0 && fut.length){ if(known) carry=divOf(cfg,T[deck[t+1]][c]); else { for(const u of pool) carry+=divOf(cfg,T[u][c]); carry/=pool.length; } }
    vals[c]=ev+carry-futureCost(T,p.hand,c,fut,left,known);
  }
  return vals;
}
const maxOf = o => Math.max(...Object.values(o));
function cpuForesight(cfg,p,players,deck,t,rnd){
  const left=TURNS-1-t;
  if(p.foreUsed || left<=0 || (p.type!=='read' && p.type!=='pro') || p.fore==='never') return;
  let use=false;
  if(p.fore==='early') use = t===0;
  else {
    if(cfg.fore==='futures'){
      // 先物は得になるときだけ使う（暴落が来るターンに使うと損をするため、使い切りの強制はしない）
      const a=cardValues(cfg,p,players,deck,t,deck[t],false), b=cardValues(cfg,p,players,deck,t,deck[t+1],true,futBase);
      use = maxOf(b)-maxOf(a) >= (t===TURNS-2 ? 0.3 : 1.2);
    } else use = t===TURNS-2 || (t===0 && rnd()<0.6);
  }
  if(use){ p.foreUsed=true; p.foreTurn=t; if(cfg.fore==='futures') p.fut=true; }
}
function cpuPick(p,players,deck,turn,cfg,rnd){
  const T=cfg.table, news=deck[turn];
  if(p.type==='random') return p.hand[Math.floor(rnd()*p.hand.length)];
  if(p.type==='naive'){ const mx=Math.max(...p.hand.map(c=>T[news][c])); const cs=p.hand.filter(c=>T[news][c]===mx); return cs[Math.floor(rnd()*cs.length)]; }
  cpuForesight(cfg,p,players,deck,turn,rnd);
  const known=p.foreUsed && p.foreTurn===turn;
  if(p.type==='pro') return proPick(p,players,deck,turn,cfg,rnd,known);
  const v=cardValues(cfg,p,players,deck,turn,rowFor(p,deck,turn),known,p.fut?futBase:null);
  let best=p.hand[0], bv=-1e9;
  for(const c of p.hand){ const x=v[c]+rnd()*0.5; if(x>bv){ bv=x; best=c; } }
  return best;
}
// 達人：相手それぞれの考え方をまねして「何を出しそうか」を見積もってから選ぶ。極秘契約も狙う
function proPick(p,players,deck,turn,cfg,rnd,known){
  const T=cfg.table, left=TURNS-1-turn, pool=unseen(cfg,deck,turn), fut=known?[deck[turn+1]]:pool;
  const opp=players.filter(o=>o!==p).map(o=>{
    if(o.type==='human' || o.type==='random') return oppDist(T,o,deck[turn],pool,left);
    const vals={}; if(o.type==='naive') o.hand.forEach(c=>vals[c]=T[deck[turn]][c]*3);
    else Object.assign(vals, cardValues(cfg,o,players,deck,turn,deck[turn],false,null));
    const d=[0,0,0,0,0,0]; const mx=Math.max(...o.hand.map(c=>vals[c])); let z=0;
    o.hand.forEach(c=>{ d[c]=Math.exp((vals[c]-mx)/0.3); z+=d[c]; });
    return d.map(x=>x/z);
  });
  const row=rowFor(p,deck,turn), ct=p.contract;
  let best=p.hand[0], bv=-1e9;
  for(const c of p.hand){
    let dist=[1];
    for(const od of opp){ const q=od[c], nd=new Array(dist.length+1).fill(0); for(let k=0;k<dist.length;k++){ nd[k]+=dist[k]*(1-q); nd[k+1]+=dist[k]*q; } dist=nd; }
    const b0=(p.fut?futBase(T[row][c],cfg):T[row][c])+(p.brand===c?1:0);
    let ev=0; for(let k=0;k<dist.length;k++) ev+=dist[k]*gain(cfg,b0,k+1);
    let x=ev-futureCost(T,p.hand,c,fut,left,known)+rnd()*0.1;
    if(ct && ct.id==='mono' && ct.x===c) x+=dist[0]*contractVal(ct)*.6;   // 独占できそうなら契約ぶんも上乗せ
    if(ct && ct.id==='clean' && ev<0) x-=1;
    if(x>bv){ bv=x; best=c; }
  }
  return best;
}
function ranking(players,cfg){
  const key=p=>cfg.tiebreak ? p.score*100+p.uniq : p.score*100;
  const s=players.map((p,i)=>({p,i,k:key(p)})).sort((a,b)=>b.k-a.k);
  let r=0, prev=null; s.forEach((x,j)=>{ if(x.k!==prev){ r=j+1; prev=x.k; } x.rank=r; });
  return s;
}

let AC=null;
function ac(){ if(!AC){ try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ AC=null; } } return AC; }
function tone(f,d,type,v,delay,slide){
  if(!S || !S.sound) return;
  const a=ac(); if(!a) return;
  if(a.state==='suspended') a.resume().catch(()=>{});
  const t=a.currentTime+(delay||0), o=a.createOscillator(), g=a.createGain();
  o.type=type||'sine'; o.frequency.setValueAtTime(f,t); if(slide) o.frequency.exponentialRampToValueAtTime(slide,t+d);
  g.gain.setValueAtTime(v||.06,t); g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(g).connect(a.destination); o.start(t); o.stop(t+d+.03);
}

/* ---- BGM：WebAudioで鳴らす軽いループ（設定でオン・オフ、初期はオフ） ---- */
const BGM={on:false, timer:null, bar:0, next:0, master:null};
const BGM_PROG=[[261.63,329.63,392.00],[220.00,261.63,329.63],[174.61,220.00,261.63],[196.00,246.94,293.66]];   // C - Am - F - G
function bgmNote(f,t,d,type,v){
  const a=ac(); if(!a || !BGM.master) return;
  const o=a.createOscillator(), g=a.createGain();
  o.type=type; o.frequency.setValueAtTime(f,t);
  g.gain.setValueAtTime(0.0001,t); g.gain.linearRampToValueAtTime(v,t+.02); g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(g).connect(BGM.master); o.start(t); o.stop(t+d+.05);
}
const BGM_STYLES={
  classic:{bpm:104, bass:"triangle", lead:"sine", lv:.035, arp:[0,1,2,1,0,2,1,2], prog:BGM_PROG},
  hist:{bpm:84, bass:"sine", lead:"triangle", lv:.03, arp:[0,2,1,2,0,2,1,2], prog:[[220,261.63,329.63],[174.61,220,261.63],[261.63,329.63,392],[196,246.94,293.66]]},          // Am-F-C-G、ゆったり
  future:{bpm:122, bass:"sawtooth", lead:"square", lv:.014, arp:[0,1,2,1,2,1,0,1,2,1,0,2,1,2,1,2], prog:[[164.81,196,246.94],[130.81,164.81,196],[196,246.94,293.66],[146.83,185,220]]},   // Em-C-G-D、速めの電子音
  long:{bpm:96, bass:"triangle", lead:"sine", lv:.035, arp:[0,1,2,1,0,1,2,1], prog:[[146.83,174.61,220],[116.54,146.83,174.61],[174.61,220,261.63],[130.81,164.81,196]]}   // Dm-B♭-F-C、少しドラマチック
};
function bgmTick(){
  const a=ac(); if(!a || !BGM.on) return;
  if(document.hidden){ BGM.next=0; return; }
  const st=BGM_STYLES[document.body.dataset.theme]||BGM_STYLES.classic;   // モードごとに曲の雰囲気を変える
  const beat=60/st.bpm, barLen=beat*4;
  if(!BGM.next || BGM.next<a.currentTime) BGM.next=a.currentTime+.08;
  while(BGM.next < a.currentTime+1.2){            // 少し先まで予約しておく
    const ch=st.prog[BGM.bar%st.prog.length], t0=BGM.next;
    bgmNote(ch[0]/2,t0,barLen*.9,st.bass,.09);                       // ベース
    st.arp.forEach((k,i)=>bgmNote(ch[k]*(i%4===3?2:1),t0+i*beat*4/st.arp.length,beat*4/st.arp.length*.9,st.lead,st.lv));   // アルペジオ
    if(BGM.bar%2===1) bgmNote(ch[2]*2,t0+beat*3,beat*.9,'triangle',.025);
    BGM.next+=barLen; BGM.bar++;
  }
}
function bgmStart(){
  const a=ac(); if(!a) return;
  if(a.state==='suspended') a.resume().catch(()=>{});
  if(!BGM.master){ BGM.master=a.createGain(); BGM.master.gain.value=.55; BGM.master.connect(a.destination); }
  BGM.on=true; BGM.next=0; clearInterval(BGM.timer); BGM.timer=setInterval(bgmTick,400); bgmTick();
}
function bgmStop(){ BGM.on=false; clearInterval(BGM.timer); BGM.timer=null; }
function toggleBgm(){ S.bgm=!S.bgm; save('azakei-bgm',S.bgm); S.bgm?bgmStart():bgmStop(); renderSheet(); }
// ブラウザは最初のタップまで音を出せないので、BGMオンなら最初の操作で鳴らし始める
document.addEventListener('pointerdown',()=>{ if(S && S.bgm && !BGM.on) bgmStart(); },{passive:true});

const FX={p:[],run:false};
function fxSize(){ for(const id of ['fx','bg']){ const c=document.getElementById(id); if(!c) continue; const d=Math.min(2,devicePixelRatio||1); c.width=innerWidth*d; c.height=innerHeight*d; c.getContext('2d').setTransform(d,0,0,d,0,0); } }
function burst(x,y,colors,n){
  if(document.hidden || FX.p.length>1200) return;   // 裏にあるあいだは出さない・出しすぎない
  if(reduced()) return;
  for(let i=0;i<(n||40);i++){ const a=Math.random()*Math.PI*2, v=3+Math.random()*7; FX.p.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-3,g:.22,life:50+Math.random()*30,c:colors[i%colors.length],s:3+Math.random()*5,r:Math.random()*6,vr:(Math.random()-.5)*.4,sh:i%3}); }

}
function confetti(){
  if(document.hidden || FX.p.length>1200) return;
  if(reduced()) return;
  const cols=['#ffc83a','#ff7a3d','#5f86ff','#ff5c9a','#20c6d1','#a77bff','#3fe08f'];
  for(let i=0;i<(phone()?110:180);i++) FX.p.push({x:Math.random()*innerWidth,y:-20-Math.random()*innerHeight*.6,vx:(Math.random()-.5)*2,vy:2+Math.random()*3,g:.04,life:260,c:cols[i%cols.length],s:5+Math.random()*6,r:Math.random()*6,vr:(Math.random()-.5)*.3,sh:1+i%2});
  if(!FX.run) fxLoop();

function burstAt(el,colors,n){ if(!el) return; const r=el.getBoundingClientRect(); if(r.bottom<0||r.top>innerHeight) return; burst(r.left+r.width/2,r.top+r.height/2,colors,n); }
function fxLoop(){
  const c=document.getElementById('fx'); if(!c) return; const x=c.getContext('2d');
  FX.run=true;
  const step=()=>{
    x.clearRect(0,0,innerWidth,innerHeight);
    FX.p=FX.p.filter(p=>p.life>0 && p.y<innerHeight+40);
    for(const p of FX.p){ p.vy+=p.g; p.x+=p.vx; p.y+=p.vy; p.vx*=.99; p.r+=p.vr; p.life--;
      x.save(); x.translate(p.x,p.y); x.rotate(p.r); x.globalAlpha=Math.min(1,p.life/30); x.fillStyle=p.c;
      if(p.sh===0){ x.beginPath(); x.arc(0,0,p.s/2,0,7); x.fill(); } else x.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);
      x.restore(); }
    if(FX.p.length) requestAnimationFrame(step); else { FX.run=false; x.clearRect(0,0,innerWidth,innerHeight); }
  };
  requestAnimationFrame(step);
}
// 背景：▲▼がゆっくり流れるマーケットの空気（スマホでは軽め）

function bgInit(){
  if(BG.on) return; BG.on=true;
  BG.g=Array.from({length:phone()?22:46},()=>({x:Math.random(),y:Math.random(),up:Math.random()<.55,s:8+Math.random()*16,v:.0002+Math.random()*.0006,a:.05+Math.random()*.09}));
  const draw=()=>{

    x.clearRect(0,0,W,H);
    x.strokeStyle='rgba(255,200,58,.07)'; x.lineWidth=2; x.beginPath();
    for(let i=0;i<=40;i++){ const px=i/40*W, py=H*.62+Math.sin(i*.55+BG.t*.6)*28+Math.sin(i*.17+BG.t*.25)*46; i?x.lineTo(px,py):x.moveTo(px,py); }
    x.stroke();
    for(const g of BG.g){ x.globalAlpha=g.a; x.fillStyle=g.up?'#5cf0a2':'#ff7f7f'; x.font=`${g.s}px sans-serif`; x.fillText(g.up?'▲':'▼',g.x*W,g.y*H); }
    x.globalAlpha=1;
  };
  const loop=()=>{ if(!document.hidden){ BG.t+=.016; for(const g of BG.g){ g.y+=g.up?-g.v:g.v; if(g.y<-.05) g.y=1.05; if(g.y>1.05) g.y=-.05; } draw(); } setTimeout(()=>requestAnimationFrame(loop),phone()?50:33); };
  draw(); if(!reduced()) loop();
}

/* ブランド：期の決算で、その期にいちばん独占した産業が自分のブランドになり、以後その産業は毎回+1 */

  const n=[0,0,0,0,0,0]; let lastMono=-1;

const CONTRACTS={

function contractDone(c, us){
  if(!c) return false;

    case 'mono':  return us.some(u=>u.ind===c.x && u.k===1);
    case 'clean': return us.length>0 && us.every(u=>u.total>=0);
    case 'mono3': return us.filter(u=>u.k===1).length>=3;
    case 'big':   return us.filter(u=>u.total>=4).length>=2;
    case 'fut':   return us.some(u=>u.fut && u.total>=3);
    case 'last':  { const u=us[us.length-1]; return !!u && u.k===1; }

}

- 期のはじめに市況カードを1枚めくり、その期だけルールが加わる（第1期は好景気か先物ブーム）
- 期の終わりに決算：その期に稼いだPOINTがいちばん多い人に+3（同点は全員）。最後の期も決算してから終了
- 極秘契約：期のはじめに1人1枚、自分だけのお題が配られる。期末に公開し、達成していれば+3〜+4
- ブランド：期にいちばん独占した産業が自分のブランドになり、以後その産業を出すと毎回+1

/* ---- 経済クイズ：出来事・年・いちばん得した産業を当てる5問。報酬は1日3セットまで ---- */
let QZ=null;
const QUIZ_REWARD_MAX=3;
function shuf(a){ return shuffle(a.slice(),Math.random); }
function makeQuiz(){
  const real=HIST.map((h,i)=>i).filter(i=>!HIST[i].f), all=HIST.map((h,i)=>i);
  const uniqTop=i=>{ const r=HIST[i].r, mx=Math.max(...r); return r.filter(v=>v===mx).length===1; };
  const qs=[], used=new Set();
  const gens=[
    ()=>{ const i=shuf(real).find(x=>!used.has('y'+x)); used.add('y'+i); const opts=shuf([i,...shuf(real.filter(x=>x!==i)).slice(0,3)]); return {q:`${HIST[i].y}年に起きたのは？`, opts:opts.map(x=>HIST[x].n), a:opts.indexOf(i), exp:HIST[i].d}; },
    ()=>{ const i=shuf(all).find(x=>!used.has('n'+x)); used.add('n'+i); const ys=shuf([HIST[i].y,...shuf(all.filter(x=>x!==i)).slice(0,3).map(x=>HIST[x].y)]); return {q:`「${HIST[i].n}」は何年？${HIST[i].f?'（未来編）':''}`, opts:ys.map(String), a:ys.indexOf(HIST[i].y), exp:HIST[i].d}; },
    ()=>{ const i=shuf(all.filter(uniqTop)).find(x=>!used.has('t'+x)); used.add('t'+i); const r=HIST[i].r, top=r.indexOf(Math.max(...r)); const opts=shuf([top,...shuf([0,1,2,3,4,5].filter(x=>x!==top)).slice(0,3)]); return {q:`「${HIST[i].n}」でいちばん点が高い産業は？`, opts:opts.map(x=>IND[x]), a:opts.indexOf(top), exp:`${IND.map((d,k)=>d+' '+sgn(r[k])).join(' / ')}`}; },
    ()=>{ const n=Math.floor(Math.random()*6), r=T2[n], mx=Math.max(...r), tops=r.map((v,k)=>v===mx?k:-1).filter(k=>k>=0), top=tops[0], wrong=shuf([0,1,2,3,4,5].filter(x=>!tops.includes(x))).slice(0,3), opts=shuf([top,...wrong]); return {q:`クラシックの「${NEWS[n]}」で${tops.length>1?'+3がつく産業のひとつ':'いちばん点が高い産業'}は？`, opts:opts.map(x=>IND[x]), a:opts.indexOf(top), exp:`${IND.map((d,k)=>d+' '+sgn(r[k])).join(' / ')}`}; }
  ];
  const order=shuf([0,1,2,3,0,1,2,2]).slice(0,5);
  order.forEach(g=>{ try{ qs.push(gens[g]()); }catch(e){ qs.push(gens[0]()); } });
  return {qs, i:0, score:0, picked:null, done:false};
}
function quizLeft(){ const P=S.prof, k=todayKey(); return P.quiz&&P.quiz.day===k ? Math.max(0,QUIZ_REWARD_MAX-P.quiz.n) : QUIZ_REWARD_MAX; }
function startQuiz(){ QZ=makeQuiz(); openSheet('quiz'); sfx('open'); }
function quizPick(k){
  if(!QZ || QZ.picked!==null) return;
  const q=QZ.qs[QZ.i]; QZ.picked=k;
  if(k===q.a){ QZ.score++; sfx('coin'); haptic(15); } else { sfx('buzz'); haptic([20,30,20]); }
  renderSheet();
}
function quizNext(){
  if(!QZ) return;
  if(QZ.i<QZ.qs.length-1){ QZ.i++; QZ.picked=null; sfx('click'); renderSheet(); return; }
  QZ.done=true;
  const P=S.prof, k=todayKey(); P.quiz = P.quiz&&P.quiz.day===k ? P.quiz : {day:k,n:0};
  QZ.reward=null;
  if(P.quiz.n<QUIZ_REWARD_MAX){ const c=QZ.score*6+(QZ.score===5?10:0), x=QZ.score*5; P.quiz.n++; P.coin=(P.coin||0)+c; P.xp+=x; QZ.reward={c,x}; }
  saveProfile(); sfx(QZ.score>=4?'fanfare':'open'); if(QZ.score===5) confetti(); renderSheet();
}

}

}

const GLOSS_RE=new RegExp(Object.keys(GLOSSARY).sort((a,b)=>b.length-a.length).map(k=>k.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|'),'g');
function gloss(text){
  const seen=new Set();
  return esc(String(text)).replace(GLOSS_RE, w=>{ if(seen.has(w)) return w; seen.add(w); return `<button class="gl" onclick="event.stopPropagation();showGloss(this,'${w}')">${w}</button>`; });
}
function showGloss(el, w){
  document.querySelectorAll('.glpop').forEach(x=>x.remove());
  const r=el.getBoundingClientRect(), p=document.createElement('div'); p.className='glpop';
  p.innerHTML=`<b>${w}</b><span>${GLOSSARY[w]||''}</span>`; document.body.appendChild(p);
  const pw=Math.min(300, innerWidth-24); p.style.width=pw+'px';
  p.style.left=Math.max(12, Math.min(innerWidth-pw-12, r.left+r.width/2-pw/2))+'px';
  const below=r.bottom+10+p.offsetHeight<innerHeight; p.style.top=(below? r.bottom+8 : r.top-p.offsetHeight-8)+'px'; p.classList.add(below?'dn':'up');
  sfx('click');
  setTimeout(()=>{ const off=e=>{ if(!p.contains(e.target)){ p.remove(); document.removeEventListener('pointerdown',off,true); } }; document.addEventListener('pointerdown',off,true); }, 0);
}
function glossPanel(){

const BOARD_MAX=20;
function boardLoad(){ const b=load('azakei-board'); return Array.isArray(b)?b:[]; }
function boardRecord(){
  if(!G || G.online || isLong() || G.boardDone || G.tac) return; G.boardDone=true;
  const b=boardLoad(), now=Date.now(), mode=G.cfg.fut?'未来編':G.cfg.hist?'歴史':'クラシック', added=[];
  G.players.forEach((p,i)=>{ if(!isHuman(p)) return; const e={n:String(p.name).slice(0,12), s:p.score, u:p.uniq, m:mode, t:now, k:now+'-'+i}; b.push(e); added.push(e.k); });

function boothTick(){
  if(!S || !S.booth) return;
  const idle=Date.now()-BOOTH_LAST;
  if(G && G.demo){   // デモ対戦をすすめる
    if(!G.ov && G.phase==='reveal'){ if(!G.revAt) G.revAt=Date.now(); if(Date.now()-G.revAt>3500){ G.revAt=0; nextTurn(); } }
    else if(!G.ov && G.phase==='final'){ if(!G.finAt) G.finAt=Date.now(); if(Date.now()-G.finAt>9000) startDemo(); }
    return;
  }
  if(G && G.phase==='final' && !G.online && idle>120000){ G=null; S.screen='home'; closeSheet(); render(); BOOTH_LAST=Date.now(); return; }
  if(!G && S.screen==='home' && idle>60000 && !document.querySelector('#sheet .sheet') && !document.querySelector('.stampfx')) startDemo();
}

/* ---- QRコード：公開版のURLをスマホで読みこめるように（ライブラリは使うときだけ読みこむ） ---- */
let QR_LIB=null;
function loadQR(){
  if(window.QRCode) return Promise.resolve(true);
  if(QR_LIB) return QR_LIB;
  QR_LIB=new Promise(res=>{ const sc=document.createElement('script'); sc.src='https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js'; sc.onload=()=>res(true); sc.onerror=()=>{ QR_LIB=null; res(false); }; document.head.appendChild(sc); });
  return QR_LIB;
}
async function fillQRs(){
  const els=[...document.querySelectorAll('[data-qr]:not([data-qrdone])')]; if(!els.length) return;
  const ok=await loadQR();
  els.forEach(el=>{ el.setAttribute('data-qrdone','1'); if(!ok || !window.QRCode){ el.innerHTML='<span class="note">QRコードを読みこめませんでした</span>'; return; }
    const size=+el.dataset.size||180; el.innerHTML='';
    try{ new QRCode(el,{text:el.dataset.qr, width:size, height:size, colorDark:'#0a0c22', colorLight:'#ffffff', correctLevel:QRCode.CorrectLevel.M}); }catch(e){ el.textContent=''; } });
}
function qrBody(){
  return `<div class="qrbig"><span class="label">SCAN TO PLAY</span><h3 class="ttl" style="font-size:26px">スマホで遊ぼう！</h3>

    <p><b>AZAKEI MARKET</b><br><span class="note">カメラで読みこむだけ。ログインもインストールも要りません</span></p>
    <span class="note" style="overflow-wrap:anywhere">${PUBLIC_URL}</span></div>`;
}
function boothQR(on){
  document.querySelectorAll('.boothqr').forEach(e=>e.remove());

}

const XF_PREFIX='AZK1:';
function xferKeys(){ const out={}; for(let i=0;i<localStorage.length;i++){ const k=localStorage.key(i); if(k && k.startsWith('azakei-')) out[k]=localStorage.getItem(k); } return out; }

const ub64u = str => { const s=atob(str.replace(/-/g,'+').replace(/_/g,'/')); return Uint8Array.from(s, c=>c.charCodeAt(0)); };

async function xferMake(){
  saveProfile(); const json=JSON.stringify({v:1, t:Date.now(), d:xferKeys()}), raw=new TextEncoder().encode(json);
  let code; try{ code=XF_PREFIX+'z'+b64u(await gz(raw,'c')); }catch(e){ code=XF_PREFIX+'p'+b64u(raw); }   // 圧縮できないブラウザはそのまま
  return code;
}
async function xferRead(code){
  code=String(code||'').trim().replace(/\s+/g,''); if(!code.startsWith(XF_PREFIX)) throw new Error('コードの形がちがいます');
  let obj; try{ const kind=code[XF_PREFIX.length], body=ub64u(code.slice(XF_PREFIX.length+1));
    const raw = kind==='z' ? await gz(body,'d') : body; obj=JSON.parse(new TextDecoder().decode(raw)); }catch(e){ throw new Error('コードが途中で切れているか、まちがっています'); }
  if(!obj || obj.v!==1 || !obj.d || typeof obj.d!=='object') throw new Error('コードが読めませんでした');
  const prof=obj.d['azakei-prof'] && JSON.parse(obj.d['azakei-prof']); if(!prof || typeof prof.xp!=='number') throw new Error('記録が入っていません');
  return obj;
}

const REC_DEF=[

  {k:'turn',     ic:'💥', n:'1ターン最高点',  u:'pt'},
  {k:'mono',     ic:'👑', n:'1試合の独占',    u:'回'},

  {k:'margin',   ic:'📏', n:'最大の点差勝ち', u:'点差'},

function recordBests(p, me, won){
  if(!G || isLong() || G.tac || G.demo) return [];     /* ロング版・作戦カード・デモは記録しない */
  const P=S.prof, st=P.st;
  if(!P.rec){ P.rec={}; if(st.best>0) P.rec.hi={v:st.best, d:0}; }   /* 前からの最高点は引き継ぐ */
  const others=G.players.filter((q,i)=>i!==me), so=others.map(q=>q.score);
  let streak=0, run=0; p.used.forEach(u=>{ run=u.k===1?run+1:0; streak=Math.max(streak,run); });
  const bt=p.used.slice().sort((a,b)=>b.total-a.total)[0];
  let def=0; p.hist.forEach((v,t)=>{ if(!others.length) return; const m=Math.max(...others.map(q=>q.hist[t]!=null?q.hist[t]:q.score)); def=Math.max(def,m-v); });
  const cand={hi:p.score, turn:bt?bt.total:null, mono:p.uniq, streak, margin:won&&so.length?p.score-Math.max(...so):null, comeback:won?def:null};
  const ext={turn:bt?{ind:bt.ind, news:String(nm(logDeck()[bt.turn])||'')}:{}};
  const out=[];
  REC_DEF.forEach(({k})=>{ const v=cand[k]; if(v==null || v<=0) return; const o=P.rec[k]; if(o && v<=o.v) return;
    P.rec[k]={v, d:Date.now(), ...(ext[k]||{})}; if(o) out.push({k, old:o.v, v}); });
  return out;
}

const nbNew = () => nbGames() < NB_GAMES;
function nbPath(){

    {t:'遊び方を見る', d:'1分でわかるルール', done:!!load('azakei-tut'), go:'openTutorial()'},

/* ---- ミオのひとこと：はじめのうち（操作ガイドがオンのあいだ）、毎ターンの結果と試合のあとに、やさしく声をかける ---- */
function mioTurn(){
  if(!G || G.practice || G.demo || !stepsOn()) return '';
  const me=myIndex(); if(me<0 || !G.last || !G.last[me]) return '';
  const r=G.last[me], p=G.players[me], C=G.cfg, row=C.table[G.deck[G.turn]];
  const cnt=[0,0,0,0,0,0]; G.players.forEach(q=>{ if(q.pick!=null && q.pick>=0) cnt[q.pick]++; });
  let t;
  if(r.k===1) t = r.total>=4 ? `やったね、独占！ ボーナスこみで ${sgn(r.total)}。この調子だよ！` : `独占できたね！ 点は少なめだけど、ボーナス +${C.bonus} はうれしいよね。`;
  else if(r.total<0) t = `マイナスになっちゃった… 点が低いカードは「どこで使うか」が大事。気にしないで次いこう！`;
  else if(r.total>=3) t = `${r.k}人で被っちゃったけど、${sgn(r.total)} はしっかりゲット！ ひとりだったら ${sgn(gain(C,row[r.ind],1))} だったね。`;
  else t = `${r.k}人で被っちゃった… みんなが選びそうな産業を、あえて外すのもコツだよ。`;
  if(r.k!==1){   /* だれも出さなかった、手札にあったおいしい産業を教える */
    const miss=p.hand.filter(c=>cnt[c]===0 && row[c]>=2).sort((a,b)=>row[b]-row[a])[0];
    if(miss!=null) t+=` ちなみに「${IND[miss]}」はだれも出してなかったよ（独占なら ${sgn(gain(C,row[miss],1))}）。`;
  }
  if(r.fut) t=`先物取引、使えたね！ `+t;
  return `<div class="gd-talk mio-turn" data-k="t${G.turn}">${guideAva()}<p class="gd-bub"><b>${GUIDE.n}</b>${t}</p></div>`;
}
function mioFinal(){
  if(!G || G.phase!=='final' || G.practice || G.demo || !stepsOn()) return '';
  const me=myIndex(); if(me<0) return '';
  const p=G.players[me], rk=ranking(G.players,G.cfg), mine=rk.find(x=>x.i===me), rank=mine?mine.rank:0, n=G.players.length;
  const best=p.used.slice().sort((a,b)=>b.total-a.total)[0], neg=p.used.filter(u=>u.total<0).length;
  const head = rank===1 ? 'すごい、優勝だよ！ おめでとう！' : rank===2 ? `おしい、${rank}位！ あと少しだったね。` : `${rank}位でゴール！ おつかれさま。`;
  const good = p.uniq>=2 ? `独占を${p.uniq}回も決めたのがよかったね。` : best ? `いちばん良かったのは、T${best.turn+1}の「${IND[best.ind]}」${sgn(best.total)}だよ。` : '';
  let tip;
  if(p.uniq===0) tip='次は「独占」をねらってみよう。みんなが出さなそうな産業がチャンス！';
  else if(G.cfg.fore==='futures' && !p.used.some(u=>u.fut)) tip='次は「先物取引」も使ってみて。次のニュースをこっそり見られる切り札だよ。';
  else if(neg>=2) tip='マイナスのカードは、ほかの人とぶつかりそうなターンに出すと、ダメージを小さくできるよ。';
  else if(rank===1 && G.players.filter(q=>!isHuman(q)).every(q=>q.type==='naive')) tip='CPUを「ふつう」にして、もっと手ごわい相手とも勝負してみる？';
  else tip='ニュースの新聞で、+3の産業がどこか最初に見ておくと、作戦が立てやすいよ。';
  return `<section class="mio-final"><div class="gd-talk">${guideAva()}<p class="gd-bub"><b>${GUIDE.n}のふりかえり</b>${head} ${good}</p></div>
    <p class="mio-tip"><span>次のヒント</span>${tip}</p></section>`;
}

function cpuWhy(){

  if(!cpus.length) return '';
  const items=cpus.map(({p,i})=>{
    const r=G.last[i], c=r.ind, hand=p.hand.concat([c]), val=k=>row[k];
    const best=hand.slice().sort((a,b)=>val(b)-val(a))[0];
    let t;
    if(r.fut && nextRow) t=`先物取引で次のNEWSを先に見て、「${IND[c]}」にかけた`;
    else if(val(c)<0) t=`マイナスの「${IND[c]}」を、今のうちに使っておく作戦`;
    else if(val(c)>=val(best)){ const ties=hand.filter(k=>val(k)===val(c)).length; t = ties>1 ? `${sgn(val(c))}のカードが${ties}枚。そのうち${p.type==='naive'?'':'、ほかの人と被らなそうだと読んで'}「${IND[c]}」を選んだ` : `手札でいちばん点が高い「${IND[c]}」（${sgn(val(c))}）を選んだ`; }
    else t=`「${IND[best]}」はみんなが出しそうだから、あえて「${IND[c]}」（${sgn(val(c))}）でひとりじめをねらった`;
    const res = r.k===1 ? `<em class="cw-ok">→ 独占成功 ${sgn(r.total)}</em>` : `<em class="cw-ng">→ ${r.k}人で被り ${sgn(r.total)}</em>`;
    const ch=CHARS[charKey(p)];
    return `<div class="cw-row"><span class="ava" style="--s:${ch?ch.c:`var(--s${p.seat%6})`}">${esc(avOf(p))}</span><span class="cw-bub"><b>${esc(String(p.name).replace(/^CPU\s*/,''))}</b>${t} ${res}</span></div>`;
  }).join('');
  const open = S.cwOpen!=null ? S.cwOpen : stepsOn();
  return `<details class="cw-box"${open?' open':''} ontoggle="S.cwOpen=this.open"><summary>🧠 CPUはなぜそれを出した？</summary><div class="cw-list">${items}</div></details>`;
}

function liveLines(){

}

function lineChart(){
  const W=560,H=240,L=34,R=120,Tp=14,B=26;
  const all=G.players.flatMap(p=>p.hist), lo=Math.min(0,...all), hi=Math.max(1,...all);
  const NT=totalTurns(), LG=logDeck(), x=t=>L+t*(W-L-R)/NT, y=v=>Tp+(hi-v)*(H-Tp-B)/(hi-lo);
  const top=Math.max(...G.players.map(p=>p.score));
  let ticks=''; const step=Math.max(1,Math.ceil((hi-lo)/5));
  for(let v=Math.ceil(lo/step)*step; v<=hi; v+=step) ticks+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end">${v}</text>`;
  for(let t=0;t<=NT;t++){ if(isLong() && t%TURNS){ continue; } if(isLong() && t && t<NT) ticks+=`<line x1="${x(t)}" x2="${x(t)}" y1="${Tp}" y2="${H-B}" stroke="var(--gold)" stroke-opacity=".35" stroke-dasharray="4 4"/>`; ticks+=`<text x="${x(t)}" y="${H-6}" text-anchor="middle">${t===0?'開始':isLong()?termName(t/TURNS-1)+'末':(G.cfg.hist?yearOf(LG[t-1]):'T'+t)}</text>`; }
  const order=G.players.map((p,i)=>({p,i})).sort((a,b)=>b.p.score-a.p.score);
  let lastY=-99; const labY={};
  order.forEach(o=>{ let yy=y(o.p.score); if(yy<lastY+15) yy=lastY+15; labY[o.i]=yy; lastY=yy; });
  const lines=G.players.map((p,i)=>{ const win=p.score===top, col=win?'var(--gold)':'var(--dim)';
    return `<polyline points="${p.hist.map((v,t)=>`${x(t)},${y(v)}`).join(' ')}" fill="none" stroke="${col}" stroke-width="${win?3:1.6}" stroke-linejoin="round"/>
      ${p.hist.map((v,t)=>`<circle cx="${x(t)}" cy="${y(v)}" r="${win?4.5:3}" fill="${col}" stroke="var(--panel)" stroke-width="2"><title>${esc(p.name)} ${t===0?'開始':'T'+t}: ${v}pt</title></circle>`).join('')}
      <text class="lbl" x="${W-R+8}" y="${labY[i]+4}">${esc(p.name)} ${p.score}</text>`; }).join('');
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="各プレイヤーの累計POINTの推移">${ticks}${lines}</svg>`;
}

function recordResult(){
  if(!G || G.recorded) return; G.recorded=true;
  const me = G.online ? G.me : (G.players.filter(isHuman).length===1 ? G.players.findIndex(isHuman) : -1);
  if(me<0) return;
  const P=S.prof, st=P.st, p=G.players[me];
  const rk=ranking(G.players,G.cfg), mine=rk.find(x=>x.i===me), won=G.teams ? teamWon(me) : !!(mine && mine.rank===1);
  // 3ターン目終了時点の順位（逆転劇の判定）
  let lastAt3=false;
  if((G.rounds||1)===1 && TURNS>=4 && p.hist.length>3){ const s3=G.players.map(q=>q.hist[3]); lastAt3 = s3[me]===Math.min(...s3) && s3.some(v=>v>s3[me]); }
  const futBest=Math.max(-99,...p.used.filter(u=>u.fut).map(u=>u.total));
  P.ind=P.ind||[0,0,0,0,0,0]; P.indm=P.indm||[0,0,0,0,0,0]; P.indp=P.indp||[0,0,0,0,0,0]; P.indc=P.indc||[0,0,0,0,0,0]; p.used.forEach(u=>{ P.ind[u.ind]++; if(u.k===1) P.indm[u.ind]++; P.indp[u.ind]+=u.total; P.indc[u.ind]++; });   // indp・indc：平均点用（数えはじめてからの点と回数）
  G.recBroke=recordBests(p, me, won);
  st.games++; if(won) st.wins++; st.best=Math.max(st.best,p.score); st.mono+=p.uniq; if(p.used.some(u=>u.fut)) st.fut++; if(G.cfg.hist) st.hist++; if(G.online) st.online++;
  const xp = Math.round((20 + Math.max(0,p.score)*3 + p.uniq*5 + (won?40:0) + (G.online?15:0)) * (G.evt?1.5:1));   // 今週のイベント参加中はXP1.5倍
  const mis = progressMissions({p, won, rank:mine?mine.rank:9, hist:!!G.cfg.hist, daily:!!G.daily});
  const before=lvInfo(P.xp); P.xp+=xp+mis.xp; const after=lvInfo(P.xp);
  const skins=SKINS.filter(s=>s.lv>before.lv && s.lv<=after.lv);
  const got=[]; const unlock=id=>{ if(!P.ach[id]){ P.ach[id]=Date.now(); got.push(id); } };
  unlock('first');
  if(won) unlock('win1'); if(st.wins>=10) unlock('win10');
  if(won && G.cfg.fut) unlock('futwin');
  if(isLong()){ unlock('long1'); if(won) unlock('longwin');
    const mine2=G.settles.map(s=>s.rows[me]).filter(Boolean);
    st.ct=(st.ct||0)+mine2.filter(r=>r.done).length; if(st.ct>=5) unlock('ct5');
    if(mine2.length===G.rounds && mine2.every(r=>r.bonus>0)) unlock('sweep');
    P.mk=[...new Set([...(P.mk||[]),...(G.mkts||[])])]; if(P.mk.length>=Object.keys(MARKETS).length) unlock('mkall'); }
  if(won && G.players.some(q=>q.type==='pro')) unlock('beatpro');
  if(p.uniq>=3) unlock('mono3'); if(futBest>=4) unlock('fut4');
  if(won && G.cfg.hist) unlock('hist'); if(G.online) unlock('online');
  if(p.score>=15) unlock('big15'); if(won && lastAt3) unlock('comeback'); if(st.games>=20) unlock('games20');
  if(G.daily){ P.daily=P.daily||{}; if(!P.daily[G.daily]) P.daily[G.daily]={score:p.score, rank:mine?mine.rank:0, grid:resultGrid(p)};
    const ks=Object.keys(P.daily).sort(); while(ks.length>60) delete P.daily[ks.shift()];
    if(dailyStreak()>=3) unlock('daily3'); if(dailyStreak()>=7) unlock('daily7'); }
  P.log=(P.log||[]).concat([{t:Date.now(), m:G.cfg.fut?'f':G.cfg.hist?'h':'c', l:isLong()?1:0, o:G.online?1:0, d:G.daily?1:0, r:mine?mine.rank:0, n:G.players.length, s:p.score, g:resultGrid(p)}]).slice(-100);
  S.rec={games:st.games,wins:st.wins,best:st.best}; save('azakei-rec',S.rec);
  const r0=rateOf(), r1=G.tac ? r0 : Math.max(0, r0+rateDelta(mine?mine.rank:G.players.length, G.players.length, won)); P.rate=r1; if(r1>=1250) unlock('gold'); rsPeak(r1);   // 作戦カードありはレートに入れない
  const dex=dexRecord(); if(dexCount()>=DEX_TOTAL()) unlock('dexall');
  const chal=G.chal?chalResult():null; if(chal && CHALLENGES.every(c=>chalStars(c.id)===3)) unlock('chal24');
  let coin = 10 + (won?20:mine&&mine.rank===2?10:0) + p.uniq*2 + (mis.cleared.length*5) + (G.daily?10:0);   // ショップで使うコイン
  const cup=G.cup?cupResult(mine?mine.rank:9):null; if(cup && cup.champ){ coin+=cup.bonus; if(cup.id==='gold') unlock('cupgold'); }
  P.coin=(P.coin||0)+coin;
  const bsr=G.boss?bossResult(rk, me):null; if(bsr&&bsr.coin){ coin+=bsr.coin; P.coin+=bsr.coin; }
  const svr=G.surv!=null?survResult(mine?mine.rank:9):null; if(svr&&svr.coin){ coin+=svr.coin; P.coin+=svr.coin; } if(svr&&svr.lv+1>=5&&svr.pass) unlock('surv5');
  let luck=null; { const li=luckyInd(); if(P.luckDay!==todayKey() && p.used.some(u=>u.ind===li && u.k===1)){ P.luckDay=todayKey(); luck={ind:li, coin:LUCK_COIN}; coin+=LUCK_COIN; P.coin+=LUCK_COIN; } }
  const sea=curSeason(); let spr=null;
  if(sea){ P.sp=P.sp||{}; const sk=sea.id+(todayKey()/10000|0); const n=P.sp[sk]=(P.sp[sk]||0)+1; spr={id:sea.id, n, bonus:n===SEASON_GOAL?SEASON_BONUS:0}; if(spr.bonus){ coin+=spr.bonus; P.coin+=spr.bonus; } }
  const sty=G.story?storyResult(rk, me):null; if(sty&&sty.bonus){ coin+=sty.bonus; P.coin+=sty.bonus; } if(STORIES.every(x=>(P.story||{})[x.k])) unlock('story9');
  const wm=progressWeekly({p, won, rank:mine?mine.rank:9, boss:!!(bsr&&bsr.win), special:!!(G.story||G.cup||G.surv!=null)});
  if(wm.coin){ coin+=wm.coin; P.coin+=wm.coin; }
  if(G.duel && G.duel.target!=null && p.score>G.duel.target) unlock('duelwin');
  const trb=recordRivals(rk, me); if(trb){ coin+=trb; P.coin+=trb; }
  { const RV=P.riv||{}, ks=Object.keys(CHARS); if(ks.every(k=>RV[k])) unlock('chars9'); if(ks.every(k=>RV[k]&&RV[k].w>0)) unlock('beat9'); }
  G.reward={xp:xp+mis.xp, base:xp, coin, mis, skins, before, after, got, won, rate:{before:r0, after:r1}, chal, cup, sty, svr, spr, bsr, luck, wm, dex, trb, trk:trb?todayRival():null};
  saveProfile();
}

function todayKey(d){ d=d||new Date(); return d.getFullYear()*10000+(d.getMonth()+1)*100+d.getDate(); }
const dailyMode = k => k%2 ? 'history' : 'classic';
const dailyLabel = k => `${Math.floor(k/100)%100}/${k%100}`;
function dailyCfg(k){
  const b=presetCfg('rec');
  return dailyMode(k)==='history' ? {...b, table:HIST.map(h=>h.r), names:HIST.map(h=>h.n), hist:true, pool:ERAS.all.ids, era:'all'} : {...b, names:NEWS, hist:false};
}
function startDaily(){

function dailyStreak(){
  const D=S.prof.daily||{}; let n=0, d=new Date();
  if(!D[todayKey(d)]) d.setDate(d.getDate()-1);          // 今日まだなら昨日から数える
  while(D[todayKey(d)]){ n++; d.setDate(d.getDate()-1); }
  return n;
}
function dailyCard(){

  const W=560,H=150,pl=30,pr=10,pt=12,pb=22, hi=Math.max(10,...L.map(x=>x.s)), lo=Math.min(0,...L.map(x=>x.s));
  const x=i=>pl+i*(W-pl-pr)/(L.length-1), y=v=>pt+(hi-v)*(H-pt-pb)/(hi-lo||1);
  let grid=''; const step=Math.max(5,Math.ceil((hi-lo)/4/5)*5);
  for(let v=Math.ceil(lo/step)*step; v<=hi; v+=step) grid+=`<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${pl-6}" y="${y(v)+4}" text-anchor="end">${v}</text>`;
  const pts=L.map((g,i)=>`${x(i).toFixed(1)},${y(g.s).toFixed(1)}`).join(' ');
  const best=Math.max(...L.map(g=>g.s)), bi=L.map(g=>g.s).lastIndexOf(best);
  const dots=L.map((g,i)=>`<g class="pt"><circle cx="${x(i)}" cy="${y(g.s)}" r="12" fill="transparent"/><circle cx="${x(i)}" cy="${y(g.s)}" r="${g.r===1?5:4}" fill="${g.r===1?'var(--gold)':'var(--panel)'}" stroke="var(--gold)" stroke-width="2"/><title>${g.s}pt · ${g.r}位/${g.n}人 · ${g.m==='h'?'歴史':'クラシック'}${g.l?'ロング':''}</title></g>`).join('');
  const line=`<svg viewBox="0 0 ${W} ${H}" class="schart" role="img" aria-label="最近${L.length}戦の得点の推移。最高${best}点">${grid}<polyline points="${pts}" fill="none" stroke="var(--gold)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>${dots}<text x="${x(bi)}" y="${y(best)-10}" text-anchor="middle" class="lab">最高 ${best}</text><text x="${pl}" y="${H-4}">${L.length}戦前</text><text x="${W-pr}" y="${H-4}" text-anchor="end">最新</text></svg>`;
  const A=S.prof.log||[], cats=[['クラシック',g=>g.m==='c'&&!g.l&&!g.d&&!g.o],['歴史モード',g=>g.m==='h'&&!g.l&&!g.d&&!g.o],['未来編',g=>g.m==='f'&&!g.d&&!g.o],['ロング版',g=>g.l],['デイリー',g=>g.d],['オンライン',g=>g.o]];
  const bars=cats.map(([n,f])=>{ const gs=A.filter(f), w=gs.filter(g=>g.r===1).length, pct=gs.length?Math.round(w/gs.length*100):0;
    return `<div class="wrow" title="${n}：${gs.length}戦 ${w}勝"><span class="wn">${n}</span><span class="wbar"><i style="width:${pct}%"></i></span><b class="num">${gs.length?pct+'%':'—'}</b><span class="note">${gs.length}戦</span></div>`; }).join('');
  return `<section class="panel"><div class="row spread"><h3>最近の得点</h3><span class="note">金の点は1位の回</span></div>${line}
    <h3 style="margin-top:12px">遊び方ごとの1位率</h3><div class="wlist">${bars}</div><p class="note">最近30戦の記録から計算しています。</p></section>`;
}

function coachHTML(p){
  if(!S.coach || !G || G.phase!=='choose') return '';
  try{
    const C=G.cfg, T=C.table, t=G.turn, known=p.foreUsed&&p.foreTurn===t, row=rowFor(p,G.deck,t);
    const vals=cardValues(C,p,G.players,G.deck,t,row,known,p.fut?futBase:null);
    const pool=unseen(C,G.deck,t), left=TURNS-1-t;
    const opp=G.players.filter(o=>o!==p).map(o=>oppDist(T,o,G.deck[t],pool,left));
    const pi=G.teams?G.players.findIndex((q,k)=>q!==p&&G.teams[k]===G.teams[G.players.indexOf(p)]):-1, pp=pi>=0&&!isHuman(G.players[pi])?G.players[pi].pick:null;   // チーム戦：相棒の予定カードは被る前提
    const alone=c=>c===pp?0:Math.round(opp.reduce((a,d)=>a*(1-d[c]),1)*100);
    const base=c=>(p.fut?futBase(T[row][c],C):T[row][c])+(p.brand===c?1:0);
    const best=p.hand.slice().sort((a,b)=>(vals[b]-(b===pp?9:0))-(vals[a]-(a===pp?9:0)))[0];
    const top=p.hand.reduce((a,c)=>base(c)>base(a)?c:a,p.hand[0]);
    let tip;
    if(top!==best) tip=`いちばん点が高い${IND[top]}（${sgn(base(top))}）は、ほかの人も出しそう。独占できる確率は${alone(top)}%。`;
    else tip = alone(best)>=50 ? `点がいちばん高く、独占できる確率も${alone(best)}%。` : `いちばん高い点。被っても${sgn(base(best))}は入るので安全（独占できる確率は${alone(best)}%）。`;
    if(top!==best && futureCost(T,p.hand,top,known?[G.deck[t+1]]:pool,left,known)>1) tip+=`${IND[top]}はこの先のNEWSでも強いので、取っておくのもあり。`;
    if(!p.foreUsed && t<TURNS-1 && C.fore==='futures'){ const nx=G.deck[t+1]; if(known===false && left>0) tip+=' 迷ったら「先物取引」で次のNEWSを見てから決めるのも手。'; }
    return `<div class="coach"><span class="ci">💡</span><span class="ct"><b>コーチのおすすめ：${IND[best]}</b><span class="cp">${sgn(base(best))} · 独占できそう ${alone(best)}%</span><span class="note">${tip}</span></span><button class="cx" onclick="toggleCoach()" aria-label="コーチを非表示">✕</button></div>`;
  }catch(e){ return ''; }
}

function todayMissions(){

function progressMissions(r){

const talkOf = p => (p.boss && G && G.boss && BOSSES.find(b=>b.id===G.boss).talk) || CPU_TALK[String(p.name).replace(/^CPU\s*/,'').replace(/（.*$/,'')] || CPU_TALK['ソラ'];
function cpuChatter(){
  if(!G || !G.last || reduced()) return;
  const top=Math.max(...G.players.map(p=>p.score));
  const lines=[];
  G.players.forEach((p,i)=>{
    if(isHuman(p)) return;
    const r=G.last[i], T=talkOf(p);
    const kind = r.k===1 ? 'mono' : r.total<0 ? 'neg' : r.total>=5 ? 'big' : (r.k>=2 && Math.random()<.6) ? 'hit' : (p.score===top && Math.random()<.5) ? 'lead' : null;
    if(kind && T[kind]) lines.push({i, text:T[kind][Math.floor(Math.random()*T[kind].length)], w:kind==='mono'||kind==='neg'?2:1});
  });
  lines.sort((a,b)=>b.w-a.w || Math.random()-.5).slice(0,2).forEach((l,j)=>setTimeout(()=>say(l.i,l.text),1100+j*700));
}
function say(i,text){
  const el=document.querySelector(`.seat[data-i="${i}"]`); if(!el) return;
  const s=document.createElement('span'); s.className='say'; s.textContent=text; el.appendChild(s); setTimeout(()=>s.remove(),2600);
  const p=G&&G.players[i]; if(p){ const c=CHARS[charKey(p)]; if(c) s.style.setProperty('--rc',c.c); voice(p.boss&&G.boss?'BOSS':charKey(p), text); }
}

function setRule(k,v){ CFG[k]=v; TURNS=CFG.turns||4; CFG.preset='custom'; saveCfg(); LAB.result=null; sfx('click'); render(); }

/* ================= バランス検証 ================= */
function mulberry(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function scenarios(){
  const n=LAB.n, rep=(v,k)=>Array(k).fill(v);
  return [
    {id:'all',label:`${n}人 · 全員読み合いCPU`,types:rep('read',n),fore:rep('auto',n)},
    {id:'skill',label:`${n}人 · 読み合い1人 vs 素直${n-1}人`,types:['read',...rep('naive',n-1)],fore:rep('auto',n),focus:true},
    {id:'fore',label:`${n}人 · 未来予測を使う1人 vs 使わない${n-1}人`,types:rep('read',n),fore:['auto',...rep('never',n-1)],focus:true},
    ...[3,4,5,6].filter(k=>k!==n).map(k=>({id:'n'+k,label:`${k}人 · 全員読み合いCPU`,types:rep('read',k),fore:rep('auto',k)}))
  ];
}
function newAcc(sc,cfg){ const m=cfg.table.length; return {sc,games:0,ties:0,sum:0,n:0,margin:0,uniq:0,picks:0,win0:0,plays:[0,0,0,0,0,0],pts:[0,0,0,0,0,0],top:new Array(m).fill(0),seen:new Array(m).fill(0)}; }
function simOne(acc,rnd,cfg){
  const sc=acc.sc, deck=buildDeck(cfg,rnd);
  const ps=sc.types.map((t,i)=>({type:t,fore:sc.fore[i],hand:[0,1,2,3,4,5],score:0,uniq:0,foreUsed:false,foreTurn:-1,fut:false,last:null}));
  for(let t=0;t<TURNS;t++){
    if(cfg.fore==='dividend' && t>0) ps.forEach(p=>{ p.score+=divOf(cfg,cfg.table[deck[t]][p.last]); });
    ps.forEach(p=>p.fut=false);
    const picks=ps.map(p=>cpuPick(p,ps,deck,t,cfg,rnd)), cnt=[0,0,0,0,0,0];
    picks.forEach(c=>cnt[c]++);
    const mx=Math.max(...cfg.table[deck[t]]);
    ps.forEach((p,i)=>{ const c=picks[i], g=gain(cfg,baseFor(cfg,p,deck,t,c),cnt[c]); p.score+=g; if(cnt[c]===1){p.uniq++; acc.uniq++;} acc.picks++; acc.plays[c]++; acc.pts[c]+=g; acc.seen[deck[t]]++; if(cfg.table[deck[t]][c]===mx) acc.top[deck[t]]++; p.hand=p.hand.filter(x=>x!==c); p.last=c; });
  }
  const rk=ranking(ps,cfg), w=rk.filter(x=>x.rank===1);
  if(w.length>1) acc.ties++;
  if(rk.find(x=>x.i===0).rank===1) acc.win0+=1/w.length;
  ps.forEach(p=>{acc.sum+=p.score; acc.n++;});
  const so=ps.map(p=>p.score).sort((a,b)=>b-a); acc.margin+=so[0]-so[1];
  acc.games++;
}
function runLab(){
  if(LAB.running) return;
  sfx('open');
  LAB.running=true; LAB.result=null;
  const saveT=TURNS, cfg=cfgFor(LAB.mode,LAB.era);
  TURNS=CFG.turns||4; if(cfg.hist && cfg.pool.length<TURNS) TURNS=cfg.pool.length;
  const scs=scenarios(), accs=scs.map(s=>newAcc(s,cfg)), rnd=mulberry(20261003), total=scs.length*LAB.games;
  let si=0, done=0;
  render();
  const step=()=>{
    const t0=performance.now();
    while(si<accs.length && performance.now()-t0<30){ simOne(accs[si],rnd,cfg); done++; if(accs[si].games>=LAB.games) si++; }
    const bar=$('#labprog'); if(bar) bar.style.width=(100*done/total).toFixed(1)+'%';
    const lbl=$('#labcount'); if(lbl) lbl.textContent=`${done.toLocaleString()} / ${total.toLocaleString()} ゲーム`;
    if(si<accs.length) setTimeout(step,0); else { LAB.running=false; LAB.result=accs; LAB.cfg=cfg; LAB.turns=TURNS; TURNS=saveT; render(); sfx('coin'); }
  };
  setTimeout(step,0);
}
function judge(kind,v){
  if(kind==='tie') return v<=0.25?['good','良好']:v<=0.5?['warn','注意']:['bad','問題'];
  if(kind==='skill') return v>=1.3?['good','良好']:v>=1.1?['warn','弱い']:['bad','問題'];
  if(kind==='fore') return v>=1.15?['good','良好']:v>=1.03?['warn','弱い']:['bad','効果なし'];
  return ['',''];
}
const pill=([c,l])=>`<span class="pill ${c}">${c==='good'?'●':c==='warn'?'▲':'✕'} ${l}</span>`;
const pct=v=>(v*100).toFixed(0)+'%';

  const R=LAB.result;

    <div class="fields">${modeSel}
      <div class="field"><label for="l-n">メインで調べる人数</label><select id="l-n" onchange="LAB.n=+this.value;LAB.result=null;render()">${[2,3,4,5,6].map(v=>`<option value="${v}" ${LAB.n===v?'selected':''}>${v}人</option>`).join('')}</select></div>
      <div class="field"><label for="l-g">1パターンあたりのゲーム数</label><select id="l-g" onchange="LAB.games=+this.value;LAB.result=null;render()">${[200,600,1500,4000].map(v=>`<option value="${v}" ${LAB.games===v?'selected':''}>${v.toLocaleString()}ゲーム</option>`).join('')}</select></div>
      <div class="field" style="justify-content:flex-end"><button class="btn go big" onclick="runLab()" ${LAB.running?'disabled':''}>${LAB.running?'対戦中…':'検証スタート'}</button></div>
    </div>${LAB.running?`<div class="prog"><i id="labprog"></i></div><span class="note num" id="labcount"></span>`:''}</section>`;
  if(!R) return `<div class="col">${setup}${LAB.running?'':`<section class="panel"><p class="note">「検証スタート」で、${scenarios().length}パターンを${LAB.games.toLocaleString()}ゲームずつ対戦させます。</p></section>`}</div>`;
  const cfg=LAB.cfg, tN=LAB.turns;
  const main=R.find(a=>a.sc.id==='all'), sk=R.find(a=>a.sc.id==='skill'), fo=R.find(a=>a.sc.id==='fore');
  const n=LAB.n, fair=1/n;
  const tie=main.ties/main.games, skR=(sk.win0/sk.games)/fair, foR=(fo.win0/fo.games)/fair, avg=main.sum/main.n;
  const indAvg=main.pts.map((p,c)=>main.plays[c]?p/main.plays[c]:0);
  const spread=Math.max(...indAvg)-Math.min(...indAvg);
  const notes=[
    [judge('tie',tie),`${n}人戦で1位が同点になる割合は${pct(tie)}。${tie>0.5?'最善手が1つに決まり、全員が同じカードを出している可能性が高いです。':tie>0.25?'やや同点が多めです。':'勝ち負けがつきやすい状態です。'}`],
    [judge('skill',skR),`読み合いCPUの勝率は${pct(sk.win0/sk.games)}（実力差がなければ${pct(fair)}）。${skR<1.1?'考えずに一番高い点を出すだけでも勝てます。':'相手を読むほど勝ちやすくなっています。'}`],
    [judge('fore',foR),`未来予測を使うCPUの勝率は${pct(fo.win0/fo.games)}（基準${pct(fair)}）。${foR<1.03?'未来予測がほぼ効いていません。':foR<1.15?'未来予測の効果は小さめです。':'未来予測が勝敗に効いています。'}`],
    [spread>0.6?['warn','偏り']:['good','良好'],`1回出したときの平均獲得POINTは、産業ごとに最大${spread.toFixed(2)}点差です。`]
  ];
  if(avg<4) notes.push([['warn','注意'],`平均点が${avg.toFixed(1)}点と低めで、点が伸びる手応えが薄いかもしれません。`]);
  const maxAvg=Math.max(0.1,...indAvg.map(Math.abs));
  const kpis=`<div class="kpis">
    <div class="kpi"><span class="label">1位同点率</span><span class="v">${pct(tie)}</span><span class="s">${pill(judge('tie',tie))}</span></div>
    <div class="kpi"><span class="label">平均POINT</span><span class="v">${avg.toFixed(1)}</span><span class="s">1位と2位の差 ${(main.margin/main.games).toFixed(1)}</span></div>
    <div class="kpi"><span class="label">読み合いの効果</span><span class="v">×${skR.toFixed(2)}</span><span class="s">${pill(judge('skill',skR))}</span></div>
    <div class="kpi"><span class="label">未来予測の効果</span><span class="v">×${foR.toFixed(2)}</span><span class="s">${pill(judge('fore',foR))}</span></div></div>`;
  const barsPlay=IND.map((d,c)=>{ const v=main.plays[c]/main.games/n; return `<div class="bar" title="${d}：1ゲームで出される確率 ${pct(v)}"><span>${d}</span><span class="tr"><span class="fl" style="--c:var(--i${c});width:${v*100}%"></span><span class="ref" style="left:${tN/6*100}%"></span></span><span class="v">${pct(v)}</span></div>`; }).join('');
  const barsAvg=IND.map((d,c)=>{ const v=indAvg[c]; return `<div class="bar" title="${d}：出したときの平均 ${v.toFixed(2)}点"><span>${d}</span><span class="tr"><span class="fl" style="--c:var(--i${c});width:${Math.max(0,v)/maxAvg*100}%"></span></span><span class="v ${cls(v)}">${v.toFixed(2)}</span></div>`; }).join('');
  const rowsIdx=cfg.hist?cfg.pool:[0,1,2,3,4,5];
  const barsTop=rowsIdx.map(r=>{ const d=(cfg.hist?yearOf(r)+' ':'')+cfg.names[r]; const v=main.seen[r]?main.top[r]/main.seen[r]:0; return `<div class="bar" style="grid-template-columns:150px minmax(0,1fr) 54px" title="${d}：最高点の産業が出された割合 ${pct(v)}"><span style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${d}</span><span class="tr"><span class="fl" style="width:${v*100}%"></span></span><span class="v">${main.seen[r]?pct(v):'—'}</span></div>`; }).join('');
  const rows=R.map(a=>{ const t=a.ties/a.games, k=a.sc.types.length; let eff='—';
    if(a.sc.focus){ const r=(a.win0/a.games)*k; eff=`${pct(a.win0/a.games)} <span class="note">(×${r.toFixed(2)})</span>`; }
    return `<tr><td>${a.sc.label}</td><td class="n">${pct(t)}</td><td>${pill(judge('tie',t))}</td><td class="n">${(a.sum/a.n).toFixed(1)}</td><td class="n">${(a.margin/a.games).toFixed(1)}</td><td class="n">${pct(a.uniq/a.picks)}</td><td class="n">${eff}</td></tr>`; }).join('');
  return `<div class="col">${setup}
    <section class="panel"><div class="row spread"><h3>診断（${n}人戦・${cfg.hist?'歴史モード '+ERAS[cfg.era].name:'クラシック'}）</h3><span class="note num">${(R.length*LAB.games).toLocaleString()}ゲーム</span></div>${kpis}
      <div class="verdict">${notes.map(([j,t])=>`<div>${pill(j)}<span>${t}</span></div>`).join('')}</div></section>
    <div class="two">
      <section class="panel"><h3>産業ごとの出される率</h3><p class="note">白い線は全産業が同じだけ出たときの値（6枚中${tN}枚）</p><div class="bars">${barsPlay}</div></section>
      <section class="panel"><h3>1回出したときの平均獲得POINT</h3><p class="note">独占ボーナスなどを含む実際の獲得点</p><div class="bars">${barsAvg}</div></section></div>
    <section class="panel"><h3>NEWSごとに「最高点の産業」が出された割合</h3><p class="note">100%に近いほど、そのNEWSでは迷わず同じカードを出しています。</p><div class="bars">${barsTop}</div></section>
    <section class="panel"><h3>すべてのパターン</h3><div class="tbl-wrap"><table class="lt"><thead><tr><th>パターン</th><th class="n">同点率</th><th></th><th class="n">平均</th><th class="n">1位-2位</th><th class="n">独占率</th><th class="n">注目CPUの勝率</th></tr></thead><tbody>${rows}</tbody></table></div>

}
// モード選択の値 "history:era" を分解
document.addEventListener('change',e=>{ if(e.target && e.target.id==='l-m'){ const v=e.target.value; if(v.startsWith('history:')){ LAB.mode='history'; LAB.era=v.split(':')[1]; } else LAB.mode='classic'; LAB.result=null; render(); } },true);

window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>
